    <p class="note">預設依進季後賽機率排序，點預估戰績可以看每週預估贏誰、輸誰。你的隊伍用藍色標示。前 ${A.odds.spots} 名進季後賽。預估戰績和機率是把剩下到第 ${A.odds.reg} 週的例行賽模擬 4000 次算出來的，每隊每週得分用「目前平均週得分」和「陣容實力」各半估算${A.odds.bonus ? "，也算進「得分高於聯盟中位數多一勝」的規則" : ""}。陣容實力 = 健康球員中今年平均最高的 ${D.seats.length} 人加總，近 7 場實力用近 7 場平均算。</p>
  </section>

  <section class="card">
    <h2>各隊陣容判斷 <small>點「展開陣容」看全部球員</small></h2>
    ${A.teamViews.map((v) => { const R = v.report, open = openTeams.has(v.t.id); return `<div class="tcard">
      <div class="thead"><b>${esc(v.t.name)}</b><span class="rec">${rec(v.t)}</span>${v.t.id === D.me.id ? '<span class="tag ok">你</span>' : v.t.id === D.opp.id ? '<span class="tag bad">本週對手</span>' : ""}
        <button class="expand" data-team="${v.t.id}" aria-expanded="${open}">${open ? "收起陣容 ▲" : "展開陣容 ▼"}</button></div>
      <div class="tline"><span class="lab">核心</span><span>${esc(R.core)}</span></div>
      <div class="tline"><span class="lab">判斷</span><span>${esc(R.judge)}</span></div>
      ${R.toYou ? `<div class="tline"><span class="lab">對你</span><span>${esc(R.toYou)}</span></div>` : ""}
      <div class="teambox" data-team="${v.t.id}"${open ? "" : " hidden"}>
        <p class="sub">陣容實力 ${r0(v.power)}（全聯盟第 ${v.rank}）· 核心 ${v.core} 人 · OUT ${v.out} 人 · 點標題可排序</p>
        <div class="scroll"><table class="roster" id="t-team-${v.t.id}">
          ${HEAD}
          ${[...D.rosters[v.t.id]].sort((a, b) => SLOT_ORDER.indexOf(a.lineupSlot) - SLOT_ORDER.indexOf(b.lineupSlot) || b.avg - a.avg).map((x) => row(x, SLOT_LABEL[x.lineupSlot] || "", verdict(x, v))).join("")}
        </table></div>
      </div></div>`; }).join("")}
    <p class="note">「核心」列出每隊最強的幾個人（今年 / 近 7 場 / 去年）。陣容表格的判斷方式跟「陣容」分頁一樣。這些文字都是依照 ESPN 數據自動產生的。</p>
  </section></div>
  ${comparePane(D, A)}
  ${changesPane()}`;

  const show = (id) => {
    activeTab = id; store("tab", id);
    document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-selected", b.dataset.pane === id));
    document.querySelectorAll(".pane").forEach((p) => (p.hidden = p.id !== id));
  };
  document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => show(b.dataset.pane)));
  document.querySelectorAll("button.expand").forEach((btn) => btn.addEventListener("click", () => {
    const id = Number(btn.dataset.team), box = document.querySelector(`.teambox[data-team="${id}"]`);
    const open = box.hidden;
    box.hidden = !open;
    open ? openTeams.add(id) : openTeams.delete(id);
    btn.setAttribute("aria-expanded", open);
    btn.textContent = open ? "收起陣容 ▲" : "展開陣容 ▼";
  }));
  document.querySelectorAll("tr.dayrow").forEach((tr) => tr.addEventListener("click", (e) => {
    if (e.target.closest(".pname")) return;
    const p = Number(tr.dataset.p), det = document.querySelector(`tr.daydetail[data-p="${p}"]`);
    det.hidden = !det.hidden;
    det.hidden ? openDays.delete(p) : openDays.add(p);
    tr.querySelector(".arrow").textContent = det.hidden ? "▼" : "▲";
  }));
  if (activeTab === "p6") activeTab = "p7";
  show(document.getElementById(activeTab) ? activeTab : "p1");
  setupSort();
  setupCompare(D);
  // 自由球員搜尋：沒輸入時顯示前 20 人，有輸入時從全部自由球員裡找
  const fs = $("#faSearch");
  if (fs) { fs.value = faQuery; const go = () => { faQuery = fs.value; const q = fs.value.trim().toLowerCase(); let n = 0;
      document.querySelectorAll("#t-fa tr[data-n]").forEach((tr) => { const show = q ? tr.dataset.n.includes(q) || tr.dataset.t === q || tr.dataset.p === q : !tr.classList.contains("xtra"); tr.hidden = !show; if (show) n++; });
      $("#faCount").textContent = q ? `找到 ${n} 人` : `顯示預估最高的 20 人，共 ${D.fas.length} 人`; };
    fs.addEventListener("input", go); if (faQuery) go(); }
}

// ---------- 球員詳細（點名字）與新聞 ----------
const NEWS = {}; // player id -> { at, items }
const IMPORTANT = /injur|sprain|strain|surgery|ruled out|\bout\b|will not play|won't play|not play|questionable|doubtful|probable|returns?\b|sidelined|(will|to) miss|day-to-day|resting|rest\b|starting|to start|will start|bench|minutes restriction|suspend|illness|sore|g league|traded|waived|concussion|mri|upgraded|downgraded|available|cleared/i;
// 標題是「XX 拿了幾分」這種比賽數據報導就不算重要新聞
const isImportant = (n) => IMPORTANT.test(n.head) && !/\d+ points|\(\d+-\d+ FG/i.test(n.head);
async function getNews(id) {
  const c = NEWS[id];
  if (c && Date.now() - c.at < 30 * 60000) return c.items;
  const r = await fetch(`https://site.api.espn.com/apis/fantasy/v2/games/fba/news/players?days=30&playerId=${id}`);
  const d = r.ok ? await r.json() : { feed: [] };
  const items = (d.feed || []).filter((n) => n.type === "Rotowire" || n.story)
    .map((n) => ({ when: new Date(n.published || n.lastModified), head: n.headline || "", story: (n.story || n.description || "").replace(/<[^>]+>/g, "") }))
    .sort((a, b) => b.when - a.when);
  NEWS[id] = { at: Date.now(), items };
  return items;
}
const recentImportant = (items) => items.find((n) => Date.now() - n.when < 3 * 86400000 && isImportant(n));

// 在名字旁邊標出最近 3 天有重要新聞（傷病、先發異動等）的球員
async function markNews() {
  const els = [...document.querySelectorAll(".pname[data-pid]")];
  const ids = [...new Set(els.map((e) => Number(e.dataset.pid)))];
  const visible = new Set([...document.querySelectorAll("#t-roster .pname, #t-fa .pname")].map((e) => Number(e.dataset.pid)));
  const todo = ids.filter((id) => visible.has(id));
  for (let i = 0; i < todo.length; i += 8) {
    await Promise.all(todo.slice(i, i + 8).map((id) => getNews(id).catch(() => [])));
  }
  for (const e of document.querySelectorAll(".pname[data-pid]")) {
    const c = NEWS[e.dataset.pid];
    const hit = c && recentImportant(c.items);
    if (hit && !e.querySelector(".news")) {
      const s = document.createElement("span");
      s.className = "news"; s.textContent = "📰"; s.title = hit.head;
      e.appendChild(s);
    }
  }
}

function findPlayer(id) {
  if (!CUR) return null;
  for (const t of CUR.teams) { const x = CUR.rosters[t.id].find((p) => p.id === id); if (x) return { x, team: t }; }
  const f = CUR.fas.find((p) => p.id === id);
  return f ? { x: f, team: null } : null;
}

async function openPlayer(id) {
  const m = $("#modal"), box = $("#modal .box");
  const hit = findPlayer(id);
  m.hidden = false;
  document.body.style.overflow = "hidden";
  const x = hit && hit.x;
  const head = x ? `<h3>${esc(x.name)} <span class="sub">${esc(x.team)}${hit.team ? ` · ${esc(hit.team.name)}` : " · 自由球員"}</span></h3>
    <p class="sub">今年 ${f1(x.avg)} · 近 7 場 ${f1(x.last7)} · 近 15 場 ${f1(x.last15)} · 去年 ${f1(x.lastYear)}${x.own != null ? ` · 持有 ${f1(x.own)}%` : ""}</p>
    ${x.injury !== "ACTIVE" && x.injury !== "NORMAL" ? `<p class="pill big">${esc(INJURY[x.injury] || x.injury)}${(() => { const i = injInfo(x, CUR); return i ? "：" + esc(i.long) : ""; })()}</p>` : ""}${keepAdvice(x, hit.team)}${bounceBox(x)}` : "";
  box.innerHTML = head + '<p class="sub">讀取中…</p>';
  try {
    const [card, news] = await Promise.all([
      get(`${LEAGUE}?view=kona_playercard`, { players: { filterIds: { value: [id] }, filterStatsForTopScoringPeriodIds: { value: 16, additionalValue: ["00" + SEASON] } } }),
      getNews(id).catch(() => []),
    ]);
    const pl = card.players && card.players[0] && card.players[0].player;
    const logs = ((pl && pl.stats) || []).filter((st) => st.statSplitTypeId === 5 && st.statSourceId === 0 && st.seasonId === SEASON && st.stats && st.stats["40"] != null)
      .sort((a, b) => b.scoringPeriodId - a.scoringPeriodId).slice(0, 10);
    const proId = pl && pl.proTeamId;
    const vs = (st) => { const g = GAMES[Number(String(st.id).slice(2))]; if (!g) return ["", ""];
      const home = g.homeProTeamId === proId; const o = home ? g.awayProTeamId : g.homeProTeamId;
      const d = new Date(g.date); return [`${d.getMonth() + 1}/${d.getDate()}`, `${home ? "vs" : "@"} ${ABBR[o] || ""}`]; };
    const n = (st, k) => st.stats[k] == null ? "-" : Math.round(st.stats[k]);
    box.innerHTML = head + `
      <h4>最近 ${logs.length} 場</h4>
      ${logs.length ? `<div class="scroll"><table class="log">
        <tr><th>日期</th><th>對手</th><th class="n">分數</th><th class="n">得分</th><th class="n">籃板</th><th class="n">助攻</th><th class="n">抄截</th><th class="n">阻攻</th><th class="n">失誤</th><th class="n">分鐘</th></tr>
        ${logs.map((st) => { const [d, o] = vs(st); const fp = st.appliedTotal || 0;
          return `<tr><td>${d}</td><td>${esc(o)}</td><td class="n big ${x ? (fp > x.avg ? "up" : fp < x.avg ? "down" : "") : ""}">${f1(fp)}</td><td class="n">${n(st, "0")}</td><td class="n">${n(st, "6")}</td><td class="n">${n(st, "3")}</td><td class="n">${n(st, "2")}</td><td class="n">${n(st, "1")}</td><td class="n">${n(st, "11")}</td><td class="n">${n(st, "40")}</td></tr>`; }).join("")}
      </table></div>` : '<p class="sub">今年還沒有出賽紀錄。</p>'}
      <h4>最新消息 <small class="sub">（Rotowire，英文）</small></h4>
      ${news.length ? news.slice(0, 4).map((nw) => `<div class="nitem${isImportant(nw) ? " imp" : ""}">
        <div class="sub">${nw.when.getMonth() + 1}/${nw.when.getDate()} ${String(nw.when.getHours()).padStart(2, "0")}:${String(nw.when.getMinutes()).padStart(2, "0")}${isImportant(nw) ? " · 重要" : ""}</div>
        <b>${esc(nw.head)}</b>${nw.story ? `<p>${esc(nw.story)}</p>` : ""}</div>`).join("") : '<p class="sub">最近 30 天沒有新聞。</p>'}
      <p class="note">分數是 fantasy 分數；<span class="up">綠色</span>代表比今年平均高，<span class="down">紅色</span>代表比較低。</p>`;
  } catch (e) {
    box.innerHTML = head + `<p class="sub">讀不到這位球員最近的比賽紀錄${/404/.test(String(e.message)) ? "（試做版只存了部分球員的紀錄，即時版都看得到）" : "：" + esc(e.message || e)}。</p>`;
  }
}
function closePlayer() { $("#modal").hidden = true; document.body.style.overflow = ""; }
document.addEventListener("click", (e) => {
  const hk = e.target.closest(".wchart .hit");
  if (hk) { document.querySelectorAll(".wchart .hit").forEach((h) => h.classList.toggle("on", h === hk));
    const r = document.querySelectorAll("#t-wk tr")[Number(hk.dataset.wk) + 1];
    $("#wk-tip").textContent = r ? [...r.children].map((c, i) => ["", "你 ", "對手 ", "中位數 ", "結果 "][i] + c.textContent.trim()).join("　") : ""; return; }
  const rv = e.target.closest(".rec2[data-rec]");
  if (rv) { openRecord(Number(rv.dataset.rec)); return; }
  const dv = e.target.closest(".dif[data-p]");
  if (dv) { openDay(Number(dv.dataset.t), Number(dv.dataset.p)); return; }
  const n = e.target.closest(".pname[data-pid]");
  if (n) { openPlayer(Number(n.dataset.pid)); return; }
  if (e.target.id === "modal" || e.target.closest(".close")) closePlayer();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePlayer(); });

let busy = false;
async function run() {
  if (busy) return;
  busy = true;
  $("#refresh").textContent = "讀取中…";
  try {
    const pick = new URLSearchParams(location.search).get("team") || store("team");
    const D = await load(pick);
    CUR = D;
    const sel = $("#team");
    sel.innerHTML = D.teams.map((t) => `<option value="${t.id}"${t.id === D.me.id ? " selected" : ""}>${esc(t.name)}</option>`).join("");
    const A = analyse(D); D.odds = A.odds; D.A = A; render(D, A);
    markNews().catch(() => {});
  } catch (e) {
    $("#app").innerHTML = `<div class="msg">讀不到 ESPN 資料：${esc(e.message || e)}<br>請稍後按「重新整理」再試一次。</div>`;
  } finally {
    busy = false;
    $("#refresh").textContent = "重新整理";
  }
}
$("#team").addEventListener("change", (e) => { store("team", e.target.value); history.replaceState(null, "", location.pathname); run(); });
$("#refresh").addEventListener("click", run);
// 開著的時候每 2 分鐘自動更新；從背景切回來也會更新
setInterval(() => { if (!document.hidden) run(); }, 120000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) run(); });
run();
</script>
