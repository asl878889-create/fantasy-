<style>
:root {
  --c1: #e06d22; --c2: #5b93e6; --c3: #2f9e6e; --c4: #a974d6; /* 圖表：你、對手（深色底上檢查過色弱可分辨） */
  /* 夜間球館：深色底、亮橘重點色（不論手機是淺色或深色模式都用這套） */
  color-scheme: dark;
  --bg: #0b0f17; --card: #151b26; --ink: #e6eaf2; --muted: #8f9aad; --line: #263043;
  --accent: #ff8a3d; --hero: #1a1f2b; --hero-bg: linear-gradient(135deg, #3a2414 0%, #1a1f2b 60%); --hero-ink: #f1ede8; --hero-muted: #b3a89c; /* 最上面卡片：暗橘漸層 */
  --core: #f2c94c; --obs: #ff8a1f; --warn-bg: #3a2a10; --warn: #f5c065; --ok-bg: #0f2e1c; --ok: #5fd38a; --bad-bg: #3a1414; --bad: #ff8080;
}

/* 配色：右上角 🎨 可以換，記在這支手機上 */
:root[data-ui="B"] { --core: #f2c94c; --obs: #ff8a1f; --bg: #0a0a10; --card: #15151f; --ink: #f1f2f8; --muted: #9a9cb3; --line: #2a2a3c; --accent: #c9d3ff; --on-accent: #14162e; --hero: #15151f; --hero-bg: linear-gradient(135deg, #3a2a6e 0%, #1d3a5e 45%, #15151f 80%); --hero-ink: #f7f8ff; --hero-muted: #c3c8e8; --hero-line: #6f7bd6; --c1: #c9d3ff; --c2: #ff8ad8; --c3: #7ff0e0; --c4: #b388ff; }
:root[data-ui="C"] { --core: #e6c98f; --obs: #e0a27a; --bg: #13110f; --card: #1d1a17; --ink: #efe8e1; --muted: #a39a90; --line: #302b26; --accent: #cdb59c; --on-accent: #2a2118; --hero: #1d1a17; --hero-bg: linear-gradient(135deg, #4a3e34 0%, #1d1a17 70%); --hero-ink: #f6f0ea; --hero-muted: #c9bcae; --hero-line: #5a4c40; --c1: #cdb59c; --c2: #9fb0c4; --c3: #a9b89c; --c4: #c9a0a4; }
:root[data-ui="D"] { --core: #f2c94c; --obs: #ff8a1f; --bg: #09080e; --card: #14121c; --ink: #ecebf2; --muted: #9a96aa; --line: #27233a; --accent: #e0414b; --on-accent: #ffffff; --hero: #14121c; --hero-bg: linear-gradient(135deg, #2e2052 0%, #14121c 62%, #2a0d12 100%); --hero-ink: #f5f3fb; --hero-muted: #bdb6d6; --hero-line: #8e1d27; --c1: #e0414b; --c2: #9b86e0; --c3: #5fd38a; --c4: #4cc9f0; }
:root[data-ui="E"] { --core: #f2c94c; --obs: #ff8a1f; --bg: #0b0814; --card: #171226; --ink: #f0edfa; --muted: #a29cbd; --line: #2b2445; --accent: #cfc6f2; --on-accent: #1d1638; --hero: #171226; --hero-bg: linear-gradient(135deg, #3f2a78 0%, #171226 70%); --hero-ink: #f7f5ff; --hero-muted: #c2b8e6; --hero-line: #4d3a8c; --c1: #cfc6f2; --c2: #4cc9f0; --c3: #5fd38a; --c4: #ff7eb6; }
:root[data-ui="F"] { --core: #f2c94c; --obs: #ff8a1f; --bg: #13080b; --card: #1f0f13; --ink: #f6ecea; --muted: #a58c8a; --line: #3d1f26; --accent: #e8c56a; --on-accent: #2a1a02; --hero: #1f0f13; --hero-bg: linear-gradient(135deg, #7a1630 0%, #1f0f13 70%); --hero-ink: #fff3ea; --hero-muted: #d9b9a8; --hero-line: #5a2030; --c1: #e8c56a; --c2: #6fb7ff; --c3: #6ed39a; --c4: #ff8aa8; }
:root[data-ui="G"] { --core: #e6c98f; --obs: #e0a27a; --bg: #101311; --card: #1a1f1b; --ink: #e9eee8; --muted: #9aa597; --line: #2a322b; --accent: #a9bba1; --on-accent: #1a2418; --hero: #1a1f1b; --hero-bg: linear-gradient(135deg, #3c4a3a 0%, #1a1f1b 70%); --hero-ink: #f2f6f0; --hero-muted: #bcc8b7; --hero-line: #4a5a47; --c1: #a9bba1; --c2: #c9a0a4; --c3: #9fb0c4; --c4: #cdb59c; }
:root[data-ui="H"] { --core: #f2c94c; --obs: #ff8a1f; --bg: #08130f; --card: #102019; --ink: #edf3ef; --muted: #91a59b; --line: #1f372c; --accent: #f29bb8; --on-accent: #2a0a16; --hero: #102019; --hero-bg: linear-gradient(135deg, #1f5a45 0%, #102019 70%); --hero-ink: #ffffff; --hero-muted: #c4d8ce; --hero-line: #f29bb8; --c1: #f29bb8; --c2: #4cc9f0; --c3: #5fd38a; --c4: #f2c94c; }
.bar .ok-btn { padding: 2px 10px; white-space: nowrap; font-size: 12px; border: 0; } .bar .is-new::before { white-space: nowrap; }
#uibtn { font-size: 16px; line-height: 1; padding: 6px 9px; }
#uimenu[hidden] { display: none; } #uimenu { margin: -4px 0 12px; padding: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
#uimenu button { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 100%; font: inherit; font-size: 12px; padding: 7px 2px 6px; border-radius: 10px; border: 1px solid transparent; background: none; color: var(--ink); cursor: pointer; }
#uimenu button[aria-checked=true] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
#uimenu i { width: 100%; max-width: 54px; height: 26px; border-radius: 7px; border: 1px solid var(--line); flex: none; }
#uimenu small { display: none; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; line-height: 1.6; }
main { max-width: 640px; margin: 0 auto; padding: 16px; }
/* 電腦等寬螢幕：自動變寬，比分和今天要做的事並排，表格不用左右滑 */
@media (min-width: 1000px) {
  main { max-width: 1240px; padding: 24px; }
  .top2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .top2 > .card { margin-top: 0; }
  .tabs button { padding: 12px 18px; font-size: 16px; }
  .roster td:nth-child(1) { position: static; box-shadow: none; }
}
.bar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
.bar select, .bar button { font: inherit; font-size: 14px; padding: 6px 10px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--card); color: var(--ink); }
.bar select { flex: 1; min-width: 0; }
.hero { position: relative; background: var(--hero-bg); color: var(--hero-ink); border-radius: 16px; padding: 22px 20px; }
.hero h1 { margin: 0; font-size: 30px; letter-spacing: .5px; }
.hero { border: 1px solid var(--hero-line, #5a3820); }
.hero .meta { color: var(--hero-muted); font-size: 14px; margin-top: 4px; }
.score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 12px; margin: 18px 0 8px; text-align: center; } .score .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .hero .threats.hab { margin-bottom: 10px; } .hero .threats.hab .rec2 { font-weight: 800; color: var(--hero-ink); }
.score .n { font-size: 46px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.score .who { font-size: 14px; color: var(--hero-muted); margin-top: 4px; }
.score .vs { color: var(--hero-muted); font-weight: 700; padding-bottom: 22px; }
.hero hr { border: 0; border-top: 1px solid var(--hero-muted); opacity: .4; margin: 14px 0; }
.hero p { margin: 6px 0; font-size: 15px; } .hero .lead.win { color: #5eea8f; } .hero .lead.lose { color: #ff7070; } /* 領先綠、落後紅 */
.hero .threats { display: flex; gap: 10px; margin: 8px 0 2px; font-size: 14.5px; } .hero .th-l { flex-shrink: 0; padding-top: 2px; } .hero .th-list { flex: 1; min-width: 0; max-width: 340px; display: flex; flex-direction: column; gap: 3px; } .hero .th-row { display: flex; align-items: baseline; gap: 8px; } .hero .th-row .pname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--hero-ink); } .hero .th-v { font-weight: 800; font-variant-numeric: tabular-nums; } .hero .th-n { font-size: 12.5px; opacity: .75; white-space: nowrap; min-width: 52px; text-align: right; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-top: 16px; }
.card h2 { margin: 0 0 12px; font-size: 19px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; white-space: nowrap; } /* 標題本身不換行，副標題在剩下的空間裡換行 */
.card h2 small { font-size: 13px; color: var(--muted); font-weight: 400; white-space: normal; text-align: right; min-width: 0; }
.todo { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin-bottom: 14px; }
.todo:last-child { margin-bottom: 0; }
.tag { font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: 6px; height: fit-content; white-space: nowrap; }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.ok { background: var(--ok-bg); color: var(--ok); }
.tag.bad { background: var(--bad-bg); color: var(--bad); }
.todo b { font-size: 16px; }
.todo p { margin: 2px 0 0; color: var(--muted); font-size: 14px; } .todo > div { min-width: 0; } .todo > .tag { align-self: start; margin-top: 1px; } .todo .nw { white-space: nowrap; } .todo-l { margin: 3px 0 0; padding-left: 18px; color: var(--muted); font-size: 14px; line-height: 1.55; } .todo-l li { margin: 1px 0; } .ac2-sum li.pk, .todo-pk li.pk { margin: 4px 0 8px; } .todo-pk, .todo-wide { grid-column: 1 / -1; } .todo-pk { margin: 0; padding-left: 0; list-style: none; font-size: 14.5px; } .todo-pk li.pk { padding-left: 9px; border-left: 2px solid var(--line); } .todo-pk li.pk > div:not(.up) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13.5px; letter-spacing: -.1px; } .todo-pk .nw { white-space: nowrap; } .todo-sub { font-size: 13px; margin-top: 2px; } .ac2-sum li.pk b { font-weight: 700; } .ac2-sum li.pk > div:not(.up) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; letter-spacing: -.1px; } .ac2-sum .nw { white-space: nowrap; } .todo-n { margin: 2px 0 0; padding-left: 18px; font-weight: 700; line-height: 1.5; }
.tabs { display: flex; gap: 4px; margin-top: 20px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { background: none; border: 0; color: var(--muted); font: inherit; font-weight: 700;
  padding: 10px 12px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
.tabs button.logtab { margin-left: auto; font-size: 13px; } /* 更新紀錄放最右邊，和其他分頁分開 */
.tabs button[aria-selected="true"] { color: var(--accent); border-color: var(--accent); }
.pane[hidden] { display: none; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 7px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 13px; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.me td { font-weight: 700; color: var(--ink); background: color-mix(in srgb, var(--accent) 12%, transparent); } tr.me td.up { color: var(--ok); } tr.me td.down { color: var(--bad); } tr.me td.win { color: var(--ok); }
/* 自己的隊伍：粗體加淡底色，不用橘紅字（會被當成警告） */
.day { padding: 10px 0; border-bottom: 1px solid var(--line); }
.day:last-child { border-bottom: 0; }
.day .top { display: flex; justify-content: space-between; font-weight: 700; }
.sub { color: var(--muted); font-size: 13px; }
.mu-nav { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; margin: 6px 0 10px; } .mu-nav b { min-width: 120px; white-space: nowrap; text-align: center; font-size: 16px; } .mu-nav button { background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 50%; width: 38px; height: 38px; font-size: 22px; line-height: 1; padding: 0; cursor: pointer; } .mu-nav button:disabled { opacity: .3; cursor: default; } .mu-nav button.mu-today { width: auto; white-space: nowrap; border-radius: 16px; font-size: 13px; padding: 0 12px; }
.pill { font-size: 12px; padding: 1px 6px; border-radius: 5px; background: var(--bad-bg); color: var(--bad); margin-left: 4px; white-space: nowrap; }
.msg { text-align: center; padding: 40px 16px; color: var(--muted); }
.roster td { padding: 9px 4px; }
.foldh { cursor: pointer; user-select: none; } .foldh::after { content: "▾"; float: right; color: var(--muted); font-size: 16px; margin-left: 8px; } .card.folded > .foldh::after { content: "▸"; } .card.folded > :not(h2) { display: none !important; } .card.folded > h2 { margin-bottom: 0; }
a.golink { color: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; } .card.flash { animation: flash 1.6s ease; } @keyframes flash { 0%, 60% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
.rankrow { display: flex; align-items: center; justify-content: flex-start; gap: 10px; padding-right: 84px; } .rkb { font-size: 12px; font-weight: 800; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); } .rkb.first { background: var(--accent); border-color: var(--accent); color: var(--on-accent, #10151f); } .rankrow .gn { font-size: 15px; font-weight: 800; color: var(--ok); } .rankrow .gn.bench { color: var(--muted); font-weight: 600; font-size: 13px; }
.pcard { margin: 10px 0; padding: 10px 10px 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); } .pcard .ph { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; } .pcard .ph .sub { margin-left: auto; }
.pcard .bars { position: relative; display: flex; align-items: flex-end; gap: 3px; } .pcard .avgline { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--pc); opacity: .75; pointer-events: none; z-index: 1; }
.pcard .bcol { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 1px; background: none; border: 0; padding: 0; cursor: pointer; font: inherit; color: var(--muted); }
.pcard .bcol span { display: block; width: 100%; border-radius: 4px 4px 0 0; background: var(--pc); opacity: .38; } .pcard .bcol.up span { opacity: 1; } .pcard .bcol.on span { outline: 2px solid var(--ink); outline-offset: 1px; }
.pcard .bcol em { font-style: normal; font-size: 10px; font-weight: 700; color: var(--ink); line-height: 1.1; } .pcard .bcol small { font-size: 9px; line-height: 1.3; color: var(--muted); white-space: nowrap; }
.pcard .kv { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; font-size: 12.5px; color: var(--muted); } .pcard .kv b { color: var(--ink); }
.cmpsearch { position: relative; display: block; } .cmpsearch input { width: 100%; font: inherit; font-size: 14px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); } .cmpres { position: absolute; z-index: 20; left: 0; right: 0; top: 100%; margin-top: 2px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 20px rgba(0,0,0,.35); max-height: 280px; overflow: auto; display: block; } .cmpres[hidden] { display: none; } .cmpres button { display: flex; flex-direction: column; align-items: flex-start; width: 100%; text-align: left; font: inherit; font-size: 14px; padding: 7px 10px; background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--ink); cursor: pointer; } .cmpres button:last-child { border-bottom: 0; } .cmpres button small { color: var(--muted); font-size: 12px; } .cmpres em { display: block; padding: 8px 10px; font-style: normal; color: var(--muted); font-size: 13px; }
.advbox { margin: 8px 0 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; } .advbox h4 { margin: 0 0 6px; font-size: 14px; } .advgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 4px; } .advgrid div { display: flex; flex-direction: column; } .advgrid small { color: var(--muted); font-size: 11.5px; } .advgrid b { font-size: 18px; } .advgrid b.up { color: var(--ok); } .advgrid b.down { color: var(--bad); } .advgrid i { font-style: normal; color: var(--muted); font-size: 11px; }
.rkbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; } .rkchip { font: inherit; font-size: 13px; font-weight: 700; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--line); background: none; color: var(--muted); cursor: pointer; } .rkchip.on { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); } .rksep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
.rkq { width: 100%; font: inherit; font-size: 14px; padding: 7px 10px; margin-bottom: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); } table.rkt td:first-child, table.rkt th:first-child { width: 30px; color: var(--muted); } table.rkt td .sub { font-size: 11.5px; line-height: 1.3; } table.rkt th.sortable.on { color: var(--accent); } table.rkt { min-width: 440px; } table.rkt td:nth-child(2), table.rkt th:nth-child(2) { min-width: 150px; max-width: 150px; } table.rkt td { vertical-align: middle; } table.rkt td.rkn .pname { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13.5px; letter-spacing: -.2px; } table.rkt td.rkn .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } table.rkt th.n, table.rkt td.n { padding-left: 4px; padding-right: 4px; white-space: nowrap; }
.roster .pill { white-space: nowrap; }
.roster td.slot { color: var(--muted); font-size: 13px; white-space: nowrap; }
.roster td.big { font-weight: 800; font-size: 15px; }
.up { color: var(--ok); } .down { color: var(--bad); } .b2b .pname.star { color: var(--bad); }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; }
.roster { min-width: 860px; }
.roster th:nth-child(1), .roster td:nth-child(1) { position: sticky; left: 0; width: 46px; min-width: 46px; background: var(--card); z-index: 1; box-shadow: 6px 0 6px -6px rgba(0,0,0,.4); }
.roster th:nth-child(2), .roster td:nth-child(2) { white-space: nowrap; }
.chips { display: inline-flex; gap: 4px; }
.chip { font-size: 12px; width: 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 5px; color: var(--muted); }
.chip.on { background: var(--accent); color: var(--card); font-weight: 700; }
.verdict { font-size: 13px; min-width: 520px; line-height: 1.45; } .roster td { vertical-align: middle; }
.verdict.core { color: var(--core); } .verdict.good { color: var(--ok); } .verdict.mid { color: var(--obs); }
.verdict.bad { color: var(--bad); } .verdict.mute { color: var(--muted); }
th.sortable { cursor: pointer; color: var(--accent); text-decoration: underline dotted; text-underline-offset: 3px; }
th.sortable::after { content: " ⇅"; font-size: 11px; opacity: .6; }
th.sortable.on::after { content: " ▼"; opacity: 1; }
.wv { font-size: 12px; padding: 1px 6px; border-radius: 5px; background: var(--warn-bg); color: var(--warn); margin-left: 4px; white-space: nowrap; font-weight: 600; }
td.name.core { color: var(--core); font-weight: 700; } td.name.good { color: var(--ok); font-weight: 700; }
td.name.mid { color: var(--obs); font-weight: 700; } td.name.bad { color: var(--bad); font-weight: 700; } td.name.mute { color: var(--muted); }
.vs td:first-child { color: var(--muted); }

// 即時評分（換人判斷用的分數，全網頁共用）= 基本評分（每分鐘效率 × 預期上場時間 × 出賽機率）× 後台資料的調整
// 規則：之後有新資料加入，就把它的調整加進 valOf()，所有用 x.val 的地方（陣容評估、補強建議、該換誰、撿人排程、排行榜）會一起套用
// 每分鐘效率：今年為主（季平均 40%、近 15 天 30%、近 7 天 30%，最近狀態差會馬上反映），打越多場越相信今年（今年比重 = 場數 ÷ (場數 + 3)），其餘用「參考值」補
// 參考值：去年打滿 20 場、每場 15 分鐘以上才用去年的效率；否則（新秀、去年打太少）用聯盟一般水準 0.95 分／分鐘
// 預期上場時間：近 15 天的平均上場分鐘（沒有就用今年平均）
const AVAIL = { DAY_TO_DAY: 0.9, QUESTIONABLE: 0.85, DOUBTFUL: 0.6 };
const PM_BASE = 0.95;
// 後台 pbpstats 調整（valAdj 記下每一項，判斷文字用）：
//   隊友缺陣：主力目前 OUT，他不在場時這位球員的每分鐘效率，跟原本的效率各算一半（受惠數字偏高，只信一半）
//   主要陣容：近 14 天打進最常用的五人陣容 → 上場時間改看近 7 天（比近 15 天快反映）；退出 → 取近 7 天和近 15 天較少的
//   球權：近 7 天使用率比整季多或少 3% 以上，每 1% 調 1%，上下限 ±5%
function valOf(x) {
  if (!x.min || !x.avg) return valOld(x);
  const pmSeason = x.avg / x.min, pm15 = x.last15 != null && x.min15 ? x.last15 / x.min15 : pmSeason, pm7 = x.last7 != null && x.min7 ? x.last7 / x.min7 : pm15;
  const pmThis = 0.4 * pmSeason + 0.3 * pm15 + 0.3 * pm7;
  const prior = x.lastYear != null && x.gpLY >= 20 && x.minLY >= 15 ? x.lastYear / x.minLY : PM_BASE;
  const w = x.gp / (x.gp + 3);
  let pm = w * pmThis + (1 - w) * prior, mins = x.min15 != null ? x.min15 : x.min;
  const base = pm * mins * (AVAIL[x.injury] || 1), adj = [];
  const ww = wwIndex().get(pbpKey(x.name));
  if (ww) { const pmW = ww.m.fpOff / 36, np = (pm + pmW) / 2; if (np > pm) { adj.push(["ww", ww]); pm = np; } }
  const lu = luMove(x);
  if (lu && x.min7 != null) { const nm = lu.up ? Math.max(mins, x.min7) : Math.min(mins, x.min7); if (nm !== mins) { adj.push(["lu", lu]); mins = nm; } }
  const p = pbpOf(x); let uf = 1;
  if (p && p.r && p.r.gp >= 2 && p.r.usg != null && p.s.usg != null) { const d = p.r.usg - p.s.usg; if (Math.abs(d) >= 3) { uf = 1 + Math.max(-0.05, Math.min(0.05, d / 100)); adj.push(["usg", d]); } }
  const v = pm * mins * uf * (AVAIL[x.injury] || 1);
  x.valBase = base; x.valAdj = adj;
  return v;
}
// 判斷文字：即時評分被 pbpstats 調整了多少（差 0.5 分以上才寫）
function valAdjTxt(x) {
  if (x.valBase == null || !x.valAdj || !x.valAdj.length || Math.abs(x.val - x.valBase) < 0.5) return "";
  const why = x.valAdj.map(([k]) => (k === "ww" ? "隊友缺陣" : k === "lu" ? "陣容變動" : "球權變化")).join("、");
  return `（基本評分 ${f1(x.valBase)}，因為${why}${x.val > x.valBase ? "加" : "減"} ${f1(Math.abs(x.val - x.valBase))}）`;
}
// 長段落拆成一句一行；名字裡的連字號換成不會斷行的（Gilgeous‑Alexander 不會被拆成兩行）
const nbh = (t) => String(t).replace(/([A-Za-z])-([A-Za-z])/g, "$1\u2011$2");
const sentences = (t) => String(t || "").split(/(?<=。)/).map((x) => x.trim()).filter(Boolean).map((x) => `<span class="sline">${esc(nbh(x))}</span>`).join("");
// 「週一 11/9」這種標籤串成「週一、三、四、日」（不帶日期，比較不會斷行）
const wkDays = (labels) => labels.map((l, i) => { const w = String(l).split(" ")[0]; return i ? w.replace("週", "") : w; }).join("、");
// 主力缺陣受惠（不分哪一隊持有）：球員名字 key → 受惠最多的那位缺陣主力
let WW_IDX = null, WW_IDX_K = null;
function wwIndex() {
  if (WW_IDX && WW_IDX_K && WW_IDX_K[0] === WOWY && WW_IDX_K[1] === INJF) return WW_IDX;
  WW_IDX = new Map(); WW_IDX_K = [WOWY, INJF];
  if (!WOWY || !WOWY.teams || !INJF) return WW_IDX;
  const inj = new Map(Object.values(INJF).map((f) => [pbpKey(f.name), f]));
  for (const stars of Object.values(WOWY.teams)) for (const st of stars) {
    const f = inj.get(pbpKey(st.n)); if (!f || f.status !== "Out") continue;
    for (const m of st.mates) { if (m.d < 4) continue; const k = pbpKey(m.n), cur = WW_IDX.get(k); if (!cur || m.d > cur.m.d) WW_IDX.set(k, { st, m }); }
  }
  return WW_IDX;
}
function toPlayer(pl, lineupSlot, teamGames, starterSlots, abbrev) {
  const p = toPlayer0(pl, lineupSlot, teamGames, starterSlots, abbrev);
  p.gp = statGP(pl, "00" + SEASON); p.gpLY = statGP(pl, "00" + (SEASON - 1)); p.min15 = statMin(pl, "02" + SEASON);
  p.val = valOf(p); p.valOld = valOld(p); return p;
}
function toPlayer0(pl, lineupSlot, teamGames, starterSlots, abbrev) {
  const avg = statAvg(pl, "00" + SEASON) || 0;
  const last15 = statAvg(pl, "02" + SEASON);
  const injury = pl.injuryStatus || "ACTIVE";
  return {
    id: pl.id, name: noDot(pl.fullName), team: abbrev[pl.proTeamId] || "FA", proTeamId: pl.proTeamId,
    slots: (pl.eligibleSlots || []).filter((s) => starterSlots.has(s)),
    lineupSlot, injury, avg,
    last7: statAvg(pl, "01" + SEASON), last15,
    lastYear: statAvg(pl, "00" + (SEASON - 1)),
    games: teamGames[pl.proTeamId] || new Set(),
    out: injury === "OUT" || injury === "SUSPENSION" || lineupSlot === IR,
    own: pl.ownership ? pl.ownership.percentOwned : null,
    pctChg: pl.ownership ? pl.ownership.percentChange || 0 : 0,
    ast: ((pl.stats || []).find((s) => s.id === "00" + SEASON && s.statSourceId === 0) || { averageStats: {} }).averageStats?.["3"] ?? null,
    box: ((st) => st ? { pts: st["0"] || 0, reb: st["6"] || 0, ast: st["3"] || 0, stl: st["2"] || 0, blk: st["1"] || 0, to: st["11"] || 0, stk: (st["2"] || 0) + (st["1"] || 0) } : null)(((pl.stats || []).find((s) => s.id === "00" + SEASON && s.statSourceId === 0) || {}).averageStats),
    min: statMin(pl, "00" + SEASON), min7: statMin(pl, "01" + SEASON), minLY: statMin(pl, "00" + (SEASON - 1)),
    pos: { 1: "PG", 2: "SG", 3: "SF", 4: "PF", 5: "C" }[pl.defaultPositionId] || "",
    proj: last15 != null ? (avg + last15) / 2 : avg, // 算得分預估用（排先發、本週預估）
  };
}

// 當天能排上先發的最佳組合（依預估分數由高到低，用擴增路徑配位置）
function bestLineup(players, seats) {
  const owner = new Array(seats.length).fill(null);
  const place = (p, seen) => {
    for (let i = 0; i < seats.length; i++) {
      if (p.slots.includes(seats[i]) && !seen.has(i)) {
        seen.add(i);
        if (owner[i] === null || place(owner[i], seen)) { owner[i] = p; return true; }
      }
    }
    return false;
  };
  [...players].sort((a, b) => b.proj - a.proj).forEach((p) => place(p, new Set()));
  const out = owner.filter(Boolean).sort((a, b) => b.proj - a.proj);
  out.seatOf = new Map(owner.map((p, i) => [p, seats[i]]).filter(([p]) => p)); // 每位先發排在哪個位置
  return out;
}

async function load(teamPick) {
  const [lg, sched] = await Promise.all([
    get(`${LEAGUE}?${qs({ view: ["mSettings", "mTeam", "mRoster", "mMatchupScore"] })}`),
    get(`${BASE}?view=proTeamSchedules_wl`),
  ]);

  const abbrev = {}, teamGames = {};
  for (const t of sched.settings.proTeams) {
    abbrev[t.id] = t.abbrev;
    for (const gs of Object.values(t.proGamesByScoringPeriod || {})) for (const g of gs) GAMES[g.id] = g;
    teamGames[t.id] = new Set(Object.keys(t.proGamesByScoringPeriod || {}).map(Number));
    TEAM_GAME[t.id] = Object.fromEntries(Object.entries(t.proGamesByScoringPeriod || {}).map(([p, gs]) => [p, gs[0]]));
  }

  ABBR = abbrev;
  const counts = lg.settings.rosterSettings.lineupSlotCounts;
  POS_LIM = Object.fromEntries(Object.entries(lg.settings.rosterSettings.positionLimits || {}).map(([k, v]) => [Number(k) - 1, Number(v)]).filter(([k, v]) => k >= 0 && k <= 4 && v > 0)); // ESPN 位置編號 1～5 → 陣容格子 0～4
  const seats = [];
  for (const [k, n] of Object.entries(counts)) {
    const s = Number(k);
    if (s !== BENCH && s !== IR) for (let i = 0; i < n; i++) seats.push(s);
  }
  const starterSlots = new Set(seats);

  const teams = lg.teams;
  const me = teams.find((t) => String(t.id) === String(teamPick)) ||
             teams.find((t) => t.name === DEFAULT_TEAM) || teams[0];
  const period = lg.scoringPeriodId;
  const week = lg.status.currentMatchupPeriod;
  // 日期以 ESPN 的比賽日（scoringPeriodId）為準，不用電腦時鐘：美東午夜到 ESPN 換日之間（台灣下午 1 點到 4 點左右）兩者會差一天
  let today = etToday();
  const anchor = Object.values(GAMES).find((g) => g.scoringPeriodId != null && g.date);
  if (anchor) {
    const [ay, am, ad] = new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date(anchor.date)).split("-").map(Number);
    const fixed = addDays(new Date(Date.UTC(ay, am - 1, ad)), period - anchor.scoringPeriodId);
    if (Math.abs(fixed - today) <= 2 * 86400000) today = fixed;
  }
  const base = addDays(today, -period);
  const monday = addDays(today, -weekdayIdx(today));
  const weekPeriods = Array.from({ length: 7 }, (_, i) => period - weekdayIdx(today) + i);
  const remaining = weekPeriods.filter((p) => p >= period);

  const m = lg.schedule.find((x) => x.matchupPeriodId === week &&
    (x.home.teamId === me.id || (x.away && x.away.teamId === me.id)));
  const home = m.home.teamId === me.id;
  const mySide = home ? m.home : m.away, oppSide = home ? m.away : m.home;
  const opp = teams.find((t) => t.id === oppSide.teamId);
  const pts = (s) => s.totalPointsLive != null ? s.totalPointsLive : (s.totalPoints || 0);

  // 今天剛被丟掉的人，ESPN 還會留在原隊名單裡（標成不屬於任何隊、在 waiver），這種人不算在陣容裡，可以被推薦撿
  const roster = (t) => t.roster.entries.filter((e) => !(e.playerPoolEntry && e.playerPoolEntry.onTeamId === 0)).map((e) =>
    toPlayer(e.playerPoolEntry.player, e.lineupSlotId, teamGames, starterSlots, abbrev));
  const myRoster = roster(me), oppRoster = roster(opp);
  const rosters = Object.fromEntries(teams.map((t) => [t.id, t.id === me.id ? myRoster : t.id === opp.id ? oppRoster : roster(t)]));
  const weekScores = {};
  for (const x of lg.schedule.filter((x) => x.matchupPeriodId === week)) {
    weekScores[x.home.teamId] = pts(x.home);
    if (x.away) weekScores[x.away.teamId] = pts(x.away);
  }

  // 每個剩下的比賽日，ESPN 上你的先發設定
  const dailySlots = {};
  await Promise.all(remaining.map(async (p) => {
    const d = await get(`${LEAGUE}?${qs({ view: "mRoster", scoringPeriodId: p, forTeamId: me.id })}`);
    const t = d.teams.find((x) => x.id === me.id);
    dailySlots[p] = Object.fromEntries(t.roster.entries.map((e) => [e.playerId, e.lineupSlotId]));
  }));

  const faRaw = await get(`${LEAGUE}?${qs({ view: "kona_player_info", scoringPeriodId: period })}`,
    { players: { filterStatus: { value: ["FREEAGENT", "WAIVERS"] }, limit: 120, sortPercOwned: { sortPriority: 1, sortAsc: false } } });
  const remSet = new Set(remaining);
  const onRoster = new Set(Object.values(rosters).flat().map((x) => x.id));
  const fas = faRaw.players.map((x) => Object.assign(toPlayer(x.player, BENCH, teamGames, starterSlots, abbrev), { status: x.status, waiverAt: x.waiverProcessDate || null }))
    .filter((f) => !f.out && f.avg > 0 && !onRoster.has(f.id)) // 真的在某隊陣容裡的人不算自由球員
    .map((f) => Object.assign(f, { weekGames: [...f.games].filter((g) => remSet.has(g)).length }))
    .sort((a, b) => b.proj - a.proj);

  // 下面五件事互相不依賴，同時送出去（以前是一件做完才做下一件，載入要等好幾輪）
  const everyone = Object.values(rosters).flat();
  const todayPts = {}, todayTeam = {};
  let moves = [], allTx = [], weekBox = {};
  const jobHurt = (async () => { // 傷兵的傷勢部位和預計回歸日（ESPN 球員卡資料）
    const hurtIds = [...new Set(everyone.filter((x) => x.injury !== "ACTIVE" && x.injury !== "NORMAL").map((x) => x.id))];
    if (!hurtIds.length) return;
    try {
      const card = await get(`${LEAGUE}?view=kona_playercard`,
        { players: { filterIds: { value: hurtIds }, filterStatsForTopScoringPeriodIds: { value: 1, additionalValue: ["00" + SEASON] } } });
      const info = Object.fromEntries((card.players || []).map((p) => [p.player.id, p.player.injuryDetails]));
      everyone.forEach((x) => { if (info[x.id]) x.injuryInfo = info[x.id]; });
    } catch (e) { /* 讀不到就只顯示狀態 */ }
  })();
  const jobToday = (async () => { // 今天每位球員已經拿的分數（比賽進行中也會更新）
    try {
      const bx = await get(`${LEAGUE}?${qs({ view: ["mBoxscore", "mMatchupScore"], scoringPeriodId: period })}`);
      for (const m of bx.schedule.filter((x) => x.matchupPeriodId === week)) for (const side of [m.home, m.away]) {
        if (!side) continue;
        todayTeam[side.teamId] = (side.pointsByScoringPeriod || {})[period] || 0;
        for (const e of ((side.rosterForCurrentScoringPeriod || {}).entries || [])) todayPts[e.playerId] = e.playerPoolEntry.appliedStatTotal || 0;
      }
    } catch (e) { /* 讀不到就不顯示分數 */ }
  })();
  const jobMoves = (async () => { // 最近 3 天聯盟裡的撿人、丟人
    try {
      const ps3 = [period, period - 1, period - 2].filter((p) => p > 0);
      const lists = await Promise.all(ps3.map((p) =>
        get(`${LEAGUE}?${qs({ view: "mTransactions2", scoringPeriodId: p })}`, { transactions: { filterType: { value: ["FREEAGENT", "WAIVER"] } } })));
      // 交易另外讀、各自包起來：交易讀不到時，只是不顯示交易，撿人丟人照常
      const tlists = await Promise.all(ps3.map((p) =>
        get(`${LEAGUE}?${qs({ view: "mTransactions2", scoringPeriodId: p })}`, { transactions: { filterType: { value: ["TRADE_PROPOSAL", "TRADE_ACCEPT"] } } }).catch(() => ({ transactions: [] }))));
      const all = tlists.flatMap((l) => l.transactions || []), props = all.filter((t) => t.type === "TRADE_PROPOSAL" && (t.items || []).length);
      // 完成的交易：ESPN 的「接受」紀錄沒有球員明細，就用接受前 6 小時內、另一隊提出、跟接受者有關的那筆提案找球員；找不到就只寫誰接受了
      const trades = all.filter((t) => t.type === "TRADE_ACCEPT" && t.status === "EXECUTED").map((t) => {
        const pr = props.filter((q) => q.teamId !== t.teamId && q.proposedDate <= t.proposedDate && t.proposedDate - q.proposedDate <= 6 * 3600000 && q.items.some((i) => i.toTeamId === t.teamId || i.fromTeamId === t.teamId)).sort((a, b) => b.proposedDate - a.proposedDate)[0];
        return { trade: true, proposedDate: t.proposedDate, status: "EXECUTED", teamId: t.teamId, otherId: pr ? pr.teamId : null, items: pr ? pr.items : [] };
      });
      moves = lists.flatMap((l) => l.transactions || []).filter((t) => t.status === "EXECUTED" && (t.items || []).some((i) => i.type === "ADD" || i.type === "DROP")).concat(trades)
        .sort((a, b) => b.proposedDate - a.proposedDate);
      const known = new Set(everyone.map((x) => x.id).concat(fas.map((f) => f.id)));
      const need = [...new Set(moves.flatMap((t) => t.items.map((i) => i.playerId)))].filter((id) => !known.has(id));
      if (need.length) {
        const r = await get(`${LEAGUE}?${qs({ view: "kona_player_info", scoringPeriodId: period })}`, { players: { filterIds: { value: need } } });
        for (const x of r.players || []) EXTRA[x.player.id] = Object.assign(toPlayer(x.player, BENCH, teamGames, starterSlots, abbrev), { status: x.status, waiverAt: x.waiverProcessDate || null });
      }
    } catch (e) { moves = []; }
  })();
  const jobTx = (async () => { // 整季撿人丟人紀錄（對手撿人丟人習慣用）；沒讀過的球員（含新秀觀察的人）順便補資料，每 60 人一批、批次同時送
    try { allTx = await loadSeasonTx(period); } catch (e) { allTx = []; }
    try {
      const known2 = new Set(everyone.map((x) => x.id).concat(fas.map((f) => f.id)));

      const need2 = [...new Set(allTx.flatMap((t) => t.items.map((i) => i.playerId)).concat(rkIds))].filter((id) => !known2.has(id));
      const chunks = []; for (let i = 0; i < need2.length; i += 60) chunks.push(need2.slice(i, i + 60));
      await Promise.all(chunks.map(async (ch) => {
        const r = await get(`${LEAGUE}?${qs({ view: "kona_player_info", scoringPeriodId: period })}`, { players: { filterIds: { value: ch } } });
        for (const x of r.players || []) if (!EXTRA[x.player.id]) EXTRA[x.player.id] = Object.assign(toPlayer(x.player, BENCH, teamGames, starterSlots, abbrev), { status: x.status, waiverAt: x.waiverProcessDate || null });
      }));
    } catch (e) { /* 補不到球員資料就先用現有的 */ }
  })();
  const jobBox = (async () => { // 本週每天每位球員實際得分（先發、替補都有）：貢獻榜用
    try { weekBox = await loadWeekBox(week, weekPeriods.filter((p) => p <= period)); } catch (e) { weekBox = {}; }
  })();
  await Promise.all([jobHurt, jobToday, jobMoves, jobTx, jobBox]);

  // 季後賽：從最後一個比賽日往回推（決賽 2 週、前兩輪各 1 週）
  const fin = lg.status.finalScoringPeriod;
  const rounds = fin ? [["第 1 輪", fin - 27, fin - 21], ["第 2 輪", fin - 20, fin - 14], ["決賽（2 週）", fin - 13, fin]] : [];

  const nextWeek = weekPeriods.map((p) => p + 7);
  const gameDays = new Set(Object.values(teamGames).flatMap((g) => [...g]));
  // 撿人次數算哪一週：這週最後一天第一場開打後，ESPN 就把撿人算到下一週（隔天生效），週一早上 ESPN 還沒換週時也一樣
  const lastP = weekPeriods[weekPeriods.length - 1], lockT = Math.min(...Object.values(GAMES).filter((g) => g.scoringPeriodId === lastP).map((g) => g.date));
  const acqWeek = isFinite(lockT) && Date.now() >= lockT ? week + 1 : week;
  const nm = lg.schedule.find((x) => x.matchupPeriodId === week + 1 && x.away && [x.home.teamId, x.away.teamId].includes(me.id));
  const nextOpp = nm ? teams.find((t) => t.id === (nm.home.teamId === me.id ? nm.away.teamId : nm.home.teamId)) : null;
  return { lg, teams, me, opp, nextOpp, today, period, week, acqWeek, base, monday, remaining, nextWeek, weekPeriods, gameDays, seats, myRoster, oppRoster,
    dailySlots, fas, rosters, weekScores, myByDay: mySide.pointsByScoringPeriod || {}, oppByDay: oppSide.pointsByScoringPeriod || {}, todayPts, todayTeam, moves, rounds, myScore: pts(mySide), oppScore: pts(oppSide), acq: lg.settings.acquisitionSettings, txs: allTx, weekBox };
}

function analyse(D) {
  const label = (p) => { const d = addDays(D.base, p); return `${WEEKDAYS[weekdayIdx(d)]} ${d.getUTCMonth() + 1}/${d.getUTCDate()}`; };
  // 已經打完的比賽不再算「剩下的預估」（得分裡已經有他們的實際分數，再算一次會重複）
  const over = (x, p) => { const g = (TEAM_GAME[x.proTeamId] || {})[p]; return !!g && (g.statsOfficial || Date.now() >= g.date + 3.5 * 3600000); };
  const playing = (ros, p) => ros.filter((x) => x.games.has(p) && !x.out && !over(x, p));
  const remSet = new Set(D.remaining);
  const days = D.remaining.map((p) => {
    const mine = bestLineup(playing(D.myRoster, p), D.seats);
    const theirs = bestLineup(playing(D.oppRoster, p), D.seats);
    const slots = D.dailySlots[p] || {};
    const isStarter = (id) => slots[id] != null && slots[id] !== BENCH && slots[id] !== IR;
    const ids = new Set(mine.map((x) => x.id));
    return {
      p, label: label(p), mine, theirs,
      myProj: mine.reduce((s, x) => s + x.proj, 0), oppProj: theirs.reduce((s, x) => s + x.proj, 0),
      benched: D.myRoster.filter((x) => ids.has(x.id) && !isStarter(x.id)),
      injured: D.myRoster.filter((x) => isStarter(x.id) && x.out && x.games.has(p) && !over(x, p)), // 那天有比賽、還沒打完的受傷先發才需要處理
      stream: D.fas.filter((f) => f.games.has(p)).slice(0, 3),
    };
  });

  const todos = [];
  const diff = D.myScore - D.oppScore;
  for (const d of days) {
    if (d.benched.length) todos.push(["bad", "要做", `${d.label} 把 ${d.benched.map((x) => x.name).join("、")} 換上先發`, "他們這天有比賽，但 ESPN 上現在排在替補。"]);
    if (d.injured.length) todos.push(["bad", "要做", `${d.label} 先發有傷兵：${d.injured.map((x) => `${x.name}（${INJURY[x.injury] || x.injury}）`).join("、")}`, "受傷的球員不會得分，請換成健康、當天有比賽的人。"]);
  }
  if (!days.some((d) => d.benched.length || d.injured.length))
    todos.push(["warn", "留意", "本週剩下的先發都排好了", "我逐日讀了 ESPN 的先發：每天有比賽、能排上的人都在先發。"]);
  // 傷兵快回來：預計回歸日 5 天內提醒；在 IR 位置的人，回來前要先有名額（陣容滿了就要先丟一人）；在替補的人，回來後記得換上先發
  {
    const cnt = D.lg.settings.rosterSettings.lineupSlotCounts, cap = Object.entries(cnt).reduce((t, [k, n]) => t + (Number(k) === IR ? 0 : n), 0), used = D.myRoster.filter((x) => x.lineupSlot !== IR).length;
    const retDate = (x) => { const f = INJF && INJF[x.id], d = x.injuryInfo && x.injuryInfo.expectedReturnDate; return f && f.ret ? new Date(f.ret) : d ? new Date(Date.UTC(d[0], d[1] - 1, d[2])) : null; };
    for (const x of D.myRoster) {
      if (!x.out) continue; const dt = retDate(x); if (!dt) continue;
      const left = Math.round((dt - D.today) / 86400000); if (left < 0 || left > 5) continue;
      const when = left === 0 ? "今天" : left === 1 ? "明天" : `${left} 天後`, md = `${dt.getUTCMonth() + 1}/${dt.getUTCDate()}`;
      if (x.lineupSlot === IR) {
        const full = used >= cap;
        todos.push([full && left <= 2 ? "bad" : "warn", full && left <= 2 ? "要做" : "留意", `${x.name} ${when}回歸：${full ? "要先丟一人" : "可直接移出 IR"}`,
          `預計 ${md} 回歸，他在 IR。` + (full ? `你的陣容 ${used}/${cap} 人，他回來要移出 IR 就得先丟一人，看陣容評估誰可以換掉。` : `你的陣容 ${used}/${cap} 人，還有空位，他回來可以直接移出 IR，不用丟人。`)]);
      } else if (x.lineupSlot === BENCH) {
        todos.push([left <= 1 ? "bad" : "warn", left <= 1 ? "要做" : "留意", `${x.name} ${when}回歸：回來後換上先發`, `預計 ${md} 回歸。他現在排在替補，復出後要自己換上先發，ESPN 不會自動換。`]);
      }
    }
  }

  const myRest = days.reduce((s, d) => s + d.myProj, 0), oppRest = days.reduce((s, d) => s + d.oppProj, 0);
  const final = diff + myRest - oppRest;

  const tc = (D.me.transactionCounter || {}).matchupAcquisitionTotals || {};
  const adds = Number(tc[D.acqWeek] || 0);
  const drop = dropOf(D.myRoster, D); // 最該換掉的人（沒有就是 null）
  const worst = drop || [...D.myRoster].filter((x) => !x.out).sort((a, b) => a.val - b.val)[0]; // 參考用：預估最低的人
  const ideas = drop ? upgrades(drop, D).slice(0, 5) : [];

  const threats = D.oppRoster.filter((x) => !x.out && [...x.games].some((g) => remSet.has(g)))
    .sort((a, b) => b.proj - a.proj).slice(0, 3)
    .map((x) => ({ x, n: [...x.games].filter((g) => remSet.has(g)).length }));
  const strength = (ros, key) => ros.filter((x) => !x.out).map((x) => x[key] || 0)
    .sort((a, b) => b - a).slice(0, D.seats.length).reduce((s, v) => s + v, 0);
  const addsOf = (t) => Number(((t.transactionCounter || {}).matchupAcquisitionTotals || {})[D.acqWeek] || 0);
  const side = (t, ros, score, proj, starts) => ({
    score, starts, proj, final: score + proj,
    power: strength(ros, "avg"), hot: strength(ros, "last7"),
    out: ros.filter((x) => x.injury === "OUT" || x.lineupSlot === IR).length, adds: addsOf(t),
  });
  const vs = [
    side(D.me, D.myRoster, D.myScore, myRest, days.reduce((s, d) => s + d.mine.length, 0)),
    side(D.opp, D.oppRoster, D.oppScore, oppRest, days.reduce((s, d) => s + d.theirs.length, 0)),
  ];
  const league = D.teams.map((t) => ({ t, week: D.weekScores[t.id] || 0,
    power: strength(D.rosters[t.id], "avg"), hot: strength(D.rosters[t.id], "last7") }));
  const ranked = [...league].sort((a, b) => b.power - a.power);
  const teamViews = D.teams.map((t) => {
    const ros = D.rosters[t.id];
    const dw = t.id === D.me.id ? drop : dropOf(ros, D);
    const w = dw || [...ros].filter((x) => !x.out).sort((a, b) => a.val - b.val)[0];
    const v = { t, worst: w, drop: dw, ideas: dw ? upgrades(dw, D).slice(0, 5) : [] };
    const l = league.find((x) => x.t.id === t.id);
    return Object.assign(v, { power: l.power, rank: ranked.indexOf(l) + 1,
      out: ros.filter((x) => x.injury === "OUT" || x.lineupSlot === IR).length });
  });
  teamViews.forEach((v) => (v.core = D.rosters[v.t.id].filter((x) => verdict(x, v)[0] === "core").length));
  teamViews.sort((a, b) => (b.t.id === D.opp.id) - (a.t.id === D.opp.id) || b.power - a.power);
  teamViews.forEach((v) => (v.report = teamReport(v, D, teamViews)));
  // 本週勝率：剩下每位先發的得分當作有起伏（標準差約為預估的 30%），算出贏的機率
  const varOf = (key) => days.reduce((s, d) => s + d[key].reduce((t, x) => t + (0.3 * x.proj) ** 2, 0), 0);
  const sd = Math.sqrt(varOf("mine") + varOf("theirs"));
  const winProb = sd > 0 ? normCdf((diff + myRest - oppRest) / sd) : (diff > 0 ? 1 : diff < 0 ? 0 : 0.5);
  const plan = streamPlan(D, adds);
  // 對手把剩下的撿人名額用完（撿場次多的自由球員、只丟合理的人），最多能追幾分；你這邊同樣撿滿最多能多拿幾分
  const oppAdds = Number(((D.opp.transactionCounter || {}).matchupAcquisitionTotals || {})[D.acqWeek] || 0);
  const chaseOpp = plan.limit != null ? streamPlan(D, oppAdds, false, { ros: D.oppRoster, chase: true }) : null;
  const chaseMe = plan.limit != null ? streamPlan(D, adds, false, { chase: true }) : null;
  const chase = chaseOpp ? { opp: chaseOpp, me: chaseMe, oppLeft: chaseOpp.left, meLeft: chaseMe.left,
    wp: sd > 0 ? normCdf((diff + myRest - oppRest - chaseOpp.total) / sd) : null } : null;
  if (plan.limit != null && plan.left === 0) plan.ref = streamPlan(D, adds, true);
  if (plan.steps.length) {
    const [s0, ...rest] = plan.steps;
    todos.push(["ok", "建議", `照撿人排程：${label(s0.p)} 撿 ${s0.f.name}、丟 ${s0.d.name}`,
      (rest.length ? `接著 ${rest.map((x) => `${label(x.p)} 撿 ${x.f.name}、丟 ${x.d.name}`).join("；")}。` : "") +
      `本週還可以加 ${plan.left} 人，照排程預估多拿 ${r0(plan.total)} 分。詳細在「決策」分頁的「補強建議」。`]);
  }
  return { chase, days, todos, myRest, oppRest, final, adds, worst, drop, ideas, threats, remSet, faList: D.fas.slice(0, 20), vs, league, teamViews,
    plan, label, next: nextWeekPreview(D), odds: playoffOdds(D, league), winProb };
}

const dayChar = (D, p) => WEEKDAYS[weekdayIdx(addDays(D.base, p))].slice(1);

// ---------- 統一的換人邏輯：所有地方（陣容判斷、點球員、補強建議、各隊判斷、自由球員判斷、Discord）都用這一套 ----------
const UPG = 3; // 自由球員即時評分要比你的人多 3 分以上，才算「比較好」
// 比 x 好的健康自由球員（即時評分高的在前；分數接近時 FA 排在 waiver 前面，因為馬上撿得到）
// 位置上限：用 f 換掉 d 之後，陣容裡有那個位置資格的人數不能超過聯盟上限（例如 Diabate 主要是 PF，但有 C 資格，也算中鋒；整個陣容都算，包含傷兵名單）
const hasSlot = (x, k) => (x.slots || []).includes(k);
function posOk(f, d, ros) {
  if (!ros) return true;
  for (const [k, L] of Object.entries(POS_LIM)) {
    const s = Number(k); if (!hasSlot(f, s) || (d && hasSlot(d, s))) continue;
    if (ros.filter((x) => (!d || x.id !== d.id) && x.id !== f.id && hasSlot(x, s)).length >= L) return false;
  }
  return true;
}
// 撿 f 要換掉誰（全站共用）：先看你最該換掉的人；位置滿了（例如中鋒已經 4 個），改找陣容評估說可以換掉、又有那個位置資格的人；都沒有就是 null
function dropFor(f, D) {
  if (!D || !D.A) return null;
  const A = D.A, ros = D.rosters[D.me.id] || D.myRoster, base = A.drop || A.worst;
  if (base && posOk(f, base, ros)) return A.drop || null;
  const can = (x) => rosterJudge(x, ros, D).tag === "bad"; // 跟陣容評估、補強建議同一個標準：只換「可以換掉」的人
  return ros.filter((x) => x.id !== f.id && posOk(f, x, ros) && can(x)).sort((a, b) => a.val - b.val)[0] || null;
}
const posFull = (f, D) => { const ros = D && (D.rosters[D.me.id] || D.myRoster); return !!ros && !posOk(f, null, ros); }; // 他的位置在你隊上已經滿了
const rosOf = (x, D) => { const t = D.teams.find((t) => (D.rosters[t.id] || []).some((y) => y.id === x.id)); return t ? D.rosters[t.id] : D.myRoster; };
function upgrades(x, D, ros) {
  const R0 = ros || rosOf(x, D);
  return D.fas.filter((f) => !f.out && f.val >= x.val + UPG && posOk(f, x, R0)).sort((a, b) => (b.val - (b.status === "WAIVERS" ? 1 : 0)) - (a.val - (a.status === "WAIVERS" ? 1 : 0)));
}
const isCore = (x, rank) => x.avg >= 38 || (x.lastYear != null && x.lastYear >= 40 && x.avg >= 33) || rank <= 5;
// 一位球員在他自己隊上該不該留：{ tag, line, alt }，tag = core / good / mid / bad
function rosterJudge(x, ros, D) {
  const sorted = [...ros].sort((a, b) => b.val - a.val), rank = sorted.findIndex((p) => p.id === x.id) + 1;
  const alt = upgrades(x, D, ros)[0];
  const ret0 = x.injuryInfo && x.injuryInfo.expectedReturnDate ? Math.round((Date.UTC(x.injuryInfo.expectedReturnDate[0], x.injuryInfo.expectedReturnDate[1] - 1, x.injuryInfo.expectedReturnDate[2]) - D.today) / 86400000) : null;
  const ret = ret0 != null ? ret0 : (x.newsRet ? x.newsRet.left : null), retWhy = ret0 == null && x.newsRet ? `（${x.newsRet.why}）` : "";
  const pct = x.avg ? (x.last7 - x.avg) / x.avg : 0;
  const wv = (f) => (f.status === "WAIVERS" ? "，在 waiver 要等處理" : "");
  if (x.injuryInfo && x.injuryInfo.outForSeason) return { tag: "bad", line: "可以放掉：本季報銷，留著只佔名額。", alt };
  if (x.out && ret != null && ret > 21 && x.avg < 38) return { tag: "bad", line: `可以考慮放掉：還要 ${ret >= 999 ? "很久" : ret + " 天"}才回來${retWhy}，先撿健康的人來用${alt ? `，例如 ${alt.name}（即時評分 ${f1(alt.val)}${wv(alt)}）` : ""}。`, alt };
  if (isCore(x, rank)) return { tag: "core", line: x.out ? "留下：核心球員，等他傷癒回來。" : "留下：核心球員，不要動。" };
  if (x.out) return { tag: "mid", line: "留下：短期傷兵，等他回來。" };
  if (alt && x.lastYear != null && x.lastYear >= x.avg + 5 && x.lastYear >= alt.val) return { tag: "mid", line: `留下觀察：今年只有 ${f1(x.avg)}，但去年 ${f1(x.lastYear)}，比自由球員 ${alt.name}（即時評分 ${f1(alt.val)}）還高，有反彈空間，先別急著丟。`, alt, hold: true };
  if (alt && x.last7 != null && x.last7 >= alt.val) return { tag: "mid", line: `留下觀察：近 7 天 ${f1(x.last7)}，手感比自由球員 ${alt.name}（即時評分 ${f1(alt.val)}）還好，先留著。`, alt, hold: true };
  const ar = advRead(x);
  if (alt && ar && ar.flag === "cold" && ar.ok) return { tag: "mid", line: `留下觀察：${ar.text.replace(/。$/, "")}，先留著（進階數據）。`, alt, hold: true };
  // 原因判斷（跟球員視窗的「單場分析與結論」同一套）：最近分數偏低如果是手感冷，通常會回來，先留著
  const dg = recentDiag(x);
  if (alt && dg && dg.low && dg.cause === "cold") return { tag: "mid", line: `留下觀察：最近 ${dg.n} 場平均 ${f1(dg.mean)}，比今年 ${f1(x.avg)} 低，原因是${dg.text}，這種通常會回來，先留著。`, alt, hold: true };
  const aa = alt ? advRead(alt) : null, adg = alt ? recentDiag(alt) : null;
  const hotNote = adg && adg.high && adg.cause === "hot" ? `；留意 ${alt.name} 最近 ${adg.n} 場真實命中率 ${pct0(adg.tsR)} 偏高（${adg.tsS != null ? `他今年 ${pct0(adg.tsS)}` : "高於聯盟平均"}），可能回落` : (aa && aa.ok && aa.flag === "hot" ? `；留意 ${alt.name} 真實命中率 ${f1(aa.a.ts)}% 偏高，可能回落` : "");
  const whyNote = dg && dg.low && dg.cause ? `；最近偏低是因為${dg.text}` : "";
  if (alt) return { tag: "bad", line: `可以換掉：自由球員 ${alt.name}（即時評分 ${f1(alt.val)}，比他多 ${f1(alt.val - x.val)} 分${wv(alt)}）比他好${whyNote}${hotNote}。`, alt };
  if (rank <= D.seats.length) return { tag: "good", line: "留下：先發主力，目前沒有更好的自由球員能取代。" };
  if (pct <= -0.15 || (x.min7 != null && x.min != null && x.min7 - x.min <= -3)) return { tag: "mid", line: "觀察：排在替補又在下滑，有更好的人出現就可以換。" };
  return { tag: "mid", line: "留下觀察：排在替補，但目前沒有明顯更好的自由球員。" };
}
// 隊上最該換掉的人：即時評分最低、而且判斷是「可以換掉」的健康球員；沒有就是 null
function dropOf(ros, D) {
  return [...ros].filter((x) => !x.out && x.lineupSlot !== IR).sort((a, b) => a.val - b.val).find((x) => { const j = rosterJudge(x, ros, D); return j.tag === "bad" && j.alt; }) || null;
}

// 每位球員一句話的判斷：[顏色, 文字]
function verdict(x, A) {
  const a = f1(x.avg), l7 = f1(x.last7), ly = f1(x.lastYear);
  const D = CUR, ros = D.rosters[A.t.id] || [], j = rosterJudge(x, ros, D);
  if (j.tag === "bad") return ["bad", `今年 ${a}、去年 ${ly}。${j.line}`];
  if (x.out) { const i = injInfo(x, CUR); return ["mute", `${INJURY[x.injury] || "傷兵"}${i ? `，${i.long}` : ""}，暫時不會得分。去年 ${ly}，回來後再看狀況。`]; }
  if (j.tag === "core") return ["core", `核心。今年 ${a}、去年 ${ly}，不要動。`];
  if (j.hold) return ["mid", j.line];
  if (x.lastYear == null) return ["good", `新秀或去年沒上場，沒有去年樣本。今年 ${a}、近 7 天 ${l7}。`];
  if (x.last7 != null && x.last7 >= x.avg + 5) { const dg = recentDiag(x); return ["good", `近 7 天 ${l7}，比今年 ${a} 高，${dg && dg.high && dg.cause ? dg.text : "手感正熱"}。`]; }
  if (x.last7 != null && x.last7 <= x.avg - 5) { const dg = recentDiag(x); return ["mid", `近 7 天 ${l7}，比今年 ${a} 低，要留意（目前還不用換）${dg && dg.low && dg.cause ? `：${dg.text}` : ""}。`]; } // 紅色只留給「可以換掉」
  if (x.lastYear >= x.avg + 5) return ["mid", `今年 ${a}、去年 ${ly}，還沒回到去年水準，可以再等等。`];
  if (x.avg >= x.lastYear + 5) return ["good", `今年 ${a} 比去年 ${ly} 好，進步明顯。`];
  return ["mid", `表現穩定：今年 ${a}、去年 ${ly}。`];
}

function faVerdict(f, A) {
  const a = f1(f.avg), l7 = f1(f.last7), ly = f1(f.lastYear), w = dropFor(f, CUR);
  if (f.injury === "DAY_TO_DAY") return ["mid", `DTD，撿之前先確認能不能上場。今年 ${a}。`];
  if (w && f.val >= w.val + UPG) {
    if (f.weekGames === 0) return ["mid", `比你的 ${w.name}（今年 ${f1(w.avg)}）好，但本週沒比賽了，可以下週再撿。`];
    return ["good", `比你的 ${w.name}（今年 ${f1(w.avg)}）好，本週還有 ${f.weekGames} 場，值得撿。`];
  }
  if (f.last7 != null && f.last7 >= f.avg + 5) return ["mid", `近 7 天 ${l7}，比今年 ${a} 高，手感正熱，可以觀察。`]; // 綠色只留給「值得撿」
  if (f.last7 != null && f.last7 <= f.avg - 5) return ["bad", `近 7 天 ${l7}，比今年 ${a} 低，先不要撿。`];
  if (f.lastYear != null && f.lastYear >= f.avg + 5) return ["mid", `去年 ${ly}，今年 ${a} 還沒回到水準，有反彈空間。`];
  return ["mute", `跟你現有的人差不多，不急著撿。`];
}
const limitText = (D) => { const l = weeklyLimit(D); return l ? `本週增補上限 ${l} 人（這週有 ${l / D.acq.matchupAcquisitionLimit} 天有 NBA 比賽，每個比賽日 ${D.acq.matchupAcquisitionLimit} 人）。` : ""; };


// 點「今年 / 近7天 / 去年」標題：由高到低排序；再點一次恢復原本順序
const sortState = {};
function applySort(table) {
  const col = sortState[table.id];
  const rows = [...table.querySelectorAll("tr")].slice(1);
  rows.forEach((r, i) => { if (r.dataset.i === undefined) r.dataset.i = i; });
  const val = (r) => { const c = r.children[col]; const v = parseFloat(c.dataset.v != null ? c.dataset.v : c.textContent.replace(/[^\d.\-]/g, "")); return isNaN(v) ? -Infinity : v; };
  const th = col == null ? null : table.querySelector("tr").children[col];
  const RANK = { core: 4, good: 3, mid: 2, bad: 1, mute: 0 }; // 球員欄：金（核心）→ 綠（先發主力）→ 橘（觀察）→ 紅（可以換掉）→ 其他
  const vrank = (r) => { const c = r.children[col]; const k = Object.keys(RANK).find((n) => c.classList.contains(n)); return k == null ? -1 : RANK[k]; };
  const avg = (r) => { const c = r.children[3]; const v = parseFloat(c ? c.textContent : ""); return isNaN(v) ? -Infinity : v; };
  if (th && th.dataset.order === "verdict") rows.sort((a, b) => vrank(b) - vrank(a) || avg(b) - avg(a) || a.dataset.i - b.dataset.i); // 同一種顏色裡，今年平均高的在前面
  else rows.sort((a, b) => col == null ? a.dataset.i - b.dataset.i : val(b) - val(a) || a.dataset.i - b.dataset.i);
  const body = rows[0] ? rows[0].parentNode : null;
  rows.forEach((r) => body.appendChild(r));
  table.querySelectorAll("th.sortable").forEach((th) => th.classList.toggle("on", th.cellIndex === col));
  if (table.id === "t-rk") rows.forEach((r, i) => r.classList.toggle("rk-x", i >= 15)); // 新秀觀察：排序後只先顯示前 15 位
}

  Personal: "個人因素", Abdomen: "腹部", Oblique: "側腹", Neck: "頸部", Thigh: "大腿", Leg: "腿", Shin: "脛骨", Chest: "胸部",

// 傷勢說明：{ short: 放在標籤上, long: 放在判斷裡 }
function injInfo(x, D) {
  const d = x.injuryInfo;
  if (!d) return null;
  const part = d.type ? (BODY[d.type] || d.type) : "";
  if (d.outForSeason) return { short: "報銷", long: `${part ? part + "傷，" : ""}本季報銷` };
  if (d.expectedReturnDate) {
    const [y, m, dd] = d.expectedReturnDate, ret = new Date(Date.UTC(y, m - 1, dd));
    const left = Math.round((ret - D.today) / 86400000);
    return { short: `${m}/${dd}`, long: `${part ? part + "傷，" : ""}預計 ${m}/${dd} 回歸${left > 0 ? `（還有 ${left} 天）` : ""}` };
  }
  return part ? { short: "", long: `${part}傷，還沒有預計回歸日` } : null;
}

// 撿人排程：用本週剩下的增補額度，挑「哪天撿誰、丟誰」讓本週預估得分最多
function streamPlan(D, adds, ignoreLimit, opt = {}) {
  const ros0 = opt.ros || D.myRoster, chase = !!opt.chase; // chase：算「這週撿滿最多能多拿幾分」（對手追分、你反制），只丟陣容評估說可以換掉的人和這週撿來的人
  const limit = weeklyLimit(D);
  // ignoreLimit：額度用完時，算「如果還有額度」的參考排程（每個比賽日最多 1 人）
  // 今天的比賽如果已經全部打完，今天就不能再撿人排進去了
  const dayOver = (p) => Object.values(GAMES).filter((g) => g.scoringPeriodId === p).every((g) => g.statsOfficial || Date.now() >= g.date + 3.5 * 3600000);
  const rem = D.remaining.filter((p) => !dayOver(p));
  let budget = ignoreLimit ? rem.length : limit == null ? 0 : Math.max(0, limit - adds);
  const left = budget;
  const dayVal = (ros, p) => bestLineup(ros.filter((x) => x.games.has(p) && !x.out), D.seats).reduce((s, x) => s + x.proj, 0);
  const pool = D.fas.filter((f) => f.status !== "WAIVERS" && f.weekGames > 0).slice(0, 25);
  let roster = [...ros0], start = 0;
  const steps = [], taken = new Set();
  while (budget > 0) {
    // 只丟「陣容評估」卡片說可以換掉的人（可以換掉，或「觀察：…有更好的人出現就可以換」）；說「留下」「留下觀察」的人不丟
    const canDrop = (x) => { const j = rosterJudge(x, ros0, D); return j.tag === "bad" || (j.tag === "mid" && /^觀察：/.test(j.line)); };
    const drops = roster.filter((x) => !x.out && x.lineupSlot !== IR && (taken.has(x.id) || !ros0.some((y) => y.id === x.id) || (canDrop(x) && !(chase && x.own >= 60))) /* 追分時不算丟掉持有率 60% 以上的人：沒有人會為了一週丟掉這種球員 */).sort((a, b) => a.proj - b.proj).slice(0, 4);
    let best = null;
    for (let i = start; i < rem.length; i++) {
      const days = rem.slice(i), base = days.map((p) => dayVal(roster, p));
      for (const f of pool) {
        if (taken.has(f.id) || !days.some((p) => f.games.has(p))) continue;
        for (const d of drops) {
          if (!posOk(f, d, roster)) continue; // 位置上限（例如中鋒最多 4 人）
          if (!chase && (f.val < d.val + UPG || d.avg >= f.avg)) continue; // 跟陣容評估同一個門檻：撿進來的人即時評分要多 3 分以上，長期陣容才不會變弱
          const next = roster.filter((x) => x.id !== d.id).concat(f);
          const gain = days.reduce((s, p, j) => s + dayVal(next, p) - base[j], 0);
          if (!best || gain > best.gain) best = { i, f, d, gain, next };
        }
      }
    }
    if (!best || best.gain < 3) break;
    steps.push({ p: rem[best.i], f: best.f, d: best.d, gain: best.gain });
    taken.add(best.f.id);
    roster = best.next; start = best.i; budget--;
  }
  return { limit, left, steps, total: steps.reduce((s, x) => s + x.gain, 0) };
}

// 下週預覽：你和下週對手每天能排上先發的人數和預估分
function nextWeekPreview(D) {
  if (!D.nextOpp) return null;
  const oppRos = D.rosters[D.nextOpp.id];
  const day = (ros, p) => bestLineup(ros.filter((x) => x.games.has(p) && !x.out), D.seats);
  const days = D.nextWeek.map((p) => {
    const a = day(D.myRoster, p), b = day(oppRos, p);
    return { p, games: D.gameDays.has(p), mine: a.length, theirs: b.length,
      myProj: a.reduce((s, x) => s + x.proj, 0), oppProj: b.reduce((s, x) => s + x.proj, 0) };
  });
  const nextSet = new Set(D.nextWeek);
  const fas = D.fas.map((f) => Object.assign(Object.create(f), { nextGames: [...f.games].filter((g) => nextSet.has(g)).length }))
    .filter((f) => f.nextGames >= 3).sort((a, b) => b.nextGames * b.proj - a.nextGames * a.proj).slice(0, 5);
  // 下週該先卡位誰：只丟「陣容評估說可以換掉」的人，撿進來的人即時評分要多 3 分以上（跟陣容評估同一個門檻）；
  // 再看下週每天排進先發後，總共能多拿幾分，挑最多的
  const rosAll = D.rosters[D.me.id] || D.myRoster;
  const dropsN = rosAll.filter((x) => { const j = rosterJudge(x, rosAll, D); return j.tag === "bad" && j.alt; }).sort((a, b) => a.val - b.val);
  const dv = (ros, p) => bestLineup(ros.filter((x) => x.games.has(p) && !x.out), D.seats).reduce((t, x) => t + x.proj, 0);
  const base = D.nextWeek.map((p) => dv(D.myRoster, p)), picks = [];
  let rosNow = [...rosAll]; // 一個一個卡位：前面已經建議的撿丟要算進位置上限
  for (const d of dropsN) {
    const best = upgrades(d, D, rosNow).filter((f) => !f.out && [...f.games].filter((g) => nextSet.has(g)).length >= 2 && !picks.some((q) => q.f.id === f.id)).map((f) => {
      const nx = D.myRoster.filter((x) => x.id !== d.id).concat(f), dg = D.nextWeek.map((p, i) => dv(nx, p) - base[i]);
      return { f, d, gain: dg.reduce((t, v) => t + v, 0), days: D.nextWeek.filter((p, i) => dg[i] > 0.5 && f.games.has(p)), n: [...f.games].filter((g) => nextSet.has(g)).length };
    }).filter((c) => c.gain >= 3).sort((a, b) => b.gain - a.gain)[0];
    if (best) { picks.push(best); rosNow = rosNow.filter((x) => x.id !== best.d.id).concat(best.f); }
  }
  picks.sort((a, b) => b.gain - a.gain);
  const gapDays = days.filter((d) => d.games && d.mine < D.seats.length).map((d) => d.p);
  return { opp: D.nextOpp, days, fas, picks: picks.slice(0, 3), gapDays, hasDrop: dropsN.length > 0,
    my: days.reduce((s, d) => s + d.myProj, 0), their: days.reduce((s, d) => s + d.oppProj, 0),
    myStarts: days.reduce((s, d) => s + d.mine, 0), theirStarts: days.reduce((s, d) => s + d.theirs, 0) };
}

// 季後賽機率：用每隊的平均週得分和陣容實力，把剩下的例行賽模擬 4000 次
function playoffOdds(D, league) {
  const S = D.lg.settings.scheduleSettings, reg = S.matchupPeriodCount, spots = S.playoffTeamCount;
  const teams = D.teams, done = Math.max(1, D.week - 1);
  const games = teams[0].record.overall.wins + teams[0].record.overall.losses + teams[0].record.overall.ties;
  const bonus = games >= 2 * done; // 有「勝過聯盟中位數多一勝」的規則
  const power = Object.fromEntries(league.map((x) => [x.t.id, x.power]));
  const avgPF = teams.reduce((s, t) => s + t.record.overall.pointsFor, 0) / teams.length / done;
  const avgPow = league.reduce((s, x) => s + x.power, 0) / league.length;
  const mean = Object.fromEntries(teams.map((t) => [t.id, 0.5 * (t.record.overall.pointsFor / done) + 0.5 * (power[t.id] / avgPow * avgPF)]));
  const frac = D.remaining.length / 7;
  const randn = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const sched = D.lg.schedule.filter((x) => x.away && x.matchupPeriodId >= D.week && x.matchupPeriodId <= reg);
  const N = 4000, res = Object.fromEntries(teams.map((t) => [t.id, { wins: 0, po: 0, top4: 0, first: 0 }]));
  const hw = {}, mw = {}; // 每隊每週：對戰贏的次數、高於中位數的次數
  for (let n = 0; n < N; n++) {
    const W = {}, PF = {};
    teams.forEach((t) => { W[t.id] = t.record.overall.wins + t.record.overall.ties / 2; PF[t.id] = t.record.overall.pointsFor; });
    for (let w = D.week; w <= reg; w++) {
      const sc = {};
      teams.forEach((t) => {
        const m = mean[t.id];
        sc[t.id] = w === D.week ? (D.weekScores[t.id] || 0) + m * frac + randn() * m * 0.12 * Math.sqrt(frac) : m + randn() * m * 0.12;
        PF[t.id] += sc[t.id];
      });
      sched.filter((x) => x.matchupPeriodId === w).forEach((x) => { const win = sc[x.home.teamId] >= sc[x.away.teamId] ? x.home.teamId : x.away.teamId; W[win]++; hw[win + "_" + w] = (hw[win + "_" + w] || 0) + 1; });
      if (bonus) { const sorted = teams.map((t) => sc[t.id]).sort((a, b) => b - a), med = sorted[Math.floor(teams.length / 2) - 1];
        teams.forEach((t) => { if (sc[t.id] >= med) { W[t.id]++; mw[t.id + "_" + w] = (mw[t.id + "_" + w] || 0) + 1; } }); }
    }
    const order = [...teams].sort((a, b) => W[b.id] - W[a.id] || PF[b.id] - PF[a.id]);
    order.forEach((t, i) => { const r = res[t.id]; r.wins += W[t.id]; if (i < spots) r.po++; if (i < 4) r.top4++; if (i === 0) r.first++; });
  }
  const perWeek = bonus ? 2 : 1, total = reg * perWeek;
  const detail = Object.fromEntries(teams.map((t) => [t.id, sched.filter((x) => x.home.teamId === t.id || x.away.teamId === t.id)
    .sort((a, b) => a.matchupPeriodId - b.matchupPeriodId).map((x) => { const w = x.matchupPeriodId, k = t.id + "_" + w;
      return { w, opp: x.home.teamId === t.id ? x.away.teamId : x.home.teamId, h: (hw[k] || 0) / N, m: (mw[k] || 0) / N }; })]));
  return { spots, reg, bonus, detail, rows: teams.map((t) => { const r = res[t.id], w = r.wins / N;
    return { t, w, l: total - w, po: r.po / N, top4: r.top4 / N, first: r.first / N }; }).sort((a, b) => b.po - a.po || b.w - a.w) };
}

function normCdf(z) { // 標準常態分布累積機率
  const t = 1 / (1 + 0.2316419 * Math.abs(z)), d = 0.3989423 * Math.exp(-z * z / 2);
  const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
  return z > 0 ? 1 - p : p;
}

const openTeams = new Set(), openDays = new Set();
let CUR = null;
const EXTRA = {}; // 聯盟動態裡、不在任何名單上的球員
const GAMES = {}; // NBA 比賽 id -> 比賽資訊（主客隊、時間）
const TEAM_GAME = {}; // NBA 球隊 id -> { 比賽日: 比賽 }
let ABBR = {}; // 目前這次讀到的資料（給判斷文字用）
let POS_LIM = {}; // 聯盟的位置上限（例如中鋒最多 4 人）：{ 4: 4 }，key 是陣容格子編號（0 PG、1 SG、2 SF、3 PF、4 C）；有這個位置資格的人都算
const lastName = (n) => { const p = n.split(" "); return p.length > 1 ? p.slice(1).join(" ") : n; };
const CN = ["零", "一", "兩", "三", "四", "五"];

// 每隊的「核心 / 判斷 / 對你」三行重點，依數據自動產生
function teamReport(v, D, views) {
  const ros = D.rosters[v.t.id], o = v.t.record.overall;
  const flag = (x) => { const i = injInfo(x, D), r = i && i.short ? ` ${i.short}` : "";
    return x.lineupSlot === IR ? `(IR ${INJURY[x.injury] || "OUT"}${r})` : x.injury !== "ACTIVE" && x.injury !== "NORMAL" ? `(${INJURY[x.injury] || x.injury}${r})` : ""; };
  const byAvg = [...ros].sort((a, b) => Math.max(b.avg, 0) - Math.max(a.avg, 0));
  let core = ros.filter((x) => verdict(x, v)[0] === "core").sort((a, b) => b.avg - a.avg);
  if (core.length < 2) core = byAvg.slice(0, 3);
  const coreText = core.slice(0, 4).map((x, i) => i < 2
    ? `${lastName(x.name)} ${r0(x.avg)}/${x.last7 == null ? "-" : r0(x.last7)}/${x.lastYear == null ? "-" : r0(x.lastYear)}${flag(x)}`
    : `${lastName(x.name)} ${r0(x.avg)}${flag(x)}`).join("、");

  const healthy = ros.filter((x) => !x.out).sort((a, b) => b.avg - a.avg);
  const stars = healthy.filter((x) => x.avg >= 38);
  const mid = healthy.filter((x) => x.avg < 38).slice(0, Math.max(0, D.seats.length - stars.length));
  const lo = mid.length ? r0(Math.min(...mid.map((x) => x.avg))) : 0, hi = mid.length ? r0(Math.max(...mid.map((x) => x.avg))) : 0;
  const parts = [];
  if (stars.length >= 2) parts.push(`${CN[stars.length] || stars.length + " "}個一線球員（${stars.map((x) => lastName(x.name)).join("、")}），其他主力多在 ${lo} 到 ${hi} 分`);
  else if (stars.length === 1) parts.push(`${lastName(stars[0].name)} 撐起陣容（今年 ${r0(stars[0].avg)}），其他主力多在 ${lo} 到 ${hi} 分${stars[0].avg - hi >= 15 ? "，頭重腳輕" : ""}`);
  else parts.push(`沒有一線球員，主力多在 ${lo} 到 ${hi} 分，靠平均分散`);
  const hurt = ros.filter((x) => x.out && Math.max(x.avg, x.lastYear || 0) >= 30);
  if (hurt.length) parts.push(`${hurt.map((x) => `${lastName(x.name)}（OUT，${x.avg > 0 ? `今年 ${r0(x.avg)}` : `去年 ${r0(x.lastYear)}`}）`).join("、")}傷停中，回來後陣容會更深`);
  const down = healthy.slice(0, 8).filter((x) => x.lastYear != null && x.lastYear - x.avg >= 6).slice(0, 2);
  if (down.length) parts.push(`${down.map((x) => `${lastName(x.name)} 今年 ${r0(x.avg)} 低於去年 ${r0(x.lastYear)}`).join("、")}，要看能不能回升`);
  const hot = healthy.slice(0, 10).filter((x) => x.last7 != null && x.last7 - x.avg >= 8).slice(0, 2);
  if (hot.length) parts.push(`${hot.map((x) => `${lastName(x.name)} 近 7 天 ${r0(x.last7)}`).join("、")}，手感正熱`);
  const rankOf = (key, asc) => [...D.teams].sort((a, b) => asc ? a.record.overall[key] - b.record.overall[key] : b.record.overall[key] - a.record.overall[key]).findIndex((t) => t.id === v.t.id) + 1;
  const winRank = [...D.teams].sort((a, b) => b.record.overall.wins - a.record.overall.wins || b.record.overall.pointsFor - a.record.overall.pointsFor).findIndex((t) => t.id === v.t.id) + 1;
  const pfRank = rankOf("pointsFor"), paRank = rankOf("pointsAgainst", true);
  if (pfRank - winRank >= 3) parts.push(`戰績 ${o.wins}-${o.losses} 但總得分只排第 ${pfRank}，戰績偏好看，較可能往下掉`);
  else if (winRank - pfRank >= 3) parts.push(`總得分排第 ${pfRank}，實力比戰績 ${o.wins}-${o.losses} 好`);
  else if (paRank === 1 && o.wins >= o.losses) parts.push(`失分 ${r0(o.pointsAgainst)} 是全聯盟最低，戰績有賽程運氣成分；總得分排第 ${pfRank}`);
  else parts.push(`總得分排第 ${pfRank}`);
  const m = D.lg.schedule.find((x) => x.matchupPeriodId === D.week && (x.home.teamId === v.t.id || (x.away && x.away.teamId === v.t.id)));
  if (m && m.away) {
    const me = m.home.teamId === v.t.id ? m.home : m.away, op = m.home.teamId === v.t.id ? m.away : m.home;
    const d = (me.totalPointsLive ?? me.totalPoints ?? 0) - (op.totalPointsLive ?? op.totalPoints ?? 0);
    parts.push(`本週${d >= 0 ? "領先" : "落後"} ${r0(Math.abs(d))} 分`);
  }

  let toYou = "";
  if (v.t.id !== D.me.id) {
    const mine = views.find((x) => x.t.id === D.me.id), d = v.power - mine.power, bits = [];
    if (v.t.id === D.opp.id) { const diff = D.myScore - D.oppScore; bits.push(`本週對手，你${diff >= 0 ? "領先" : "落後"} ${r0(Math.abs(diff))} 分`); }
    bits.push(d >= 10 ? `陣容實力 ${r0(v.power)} 比你的 ${r0(mine.power)} 強，是要追的對象`
      : d <= -25 ? `弱隊，陣容實力 ${r0(v.power)} 比你的 ${r0(mine.power)} 低很多，沒有威脅`
      : `實力跟你接近（${r0(v.power)} 對 ${r0(mine.power)}）`);
    const meets = D.lg.schedule.filter((x) => x.matchupPeriodId > D.week && x.away &&
      [x.home.teamId, x.away.teamId].includes(D.me.id) && [x.home.teamId, x.away.teamId].includes(v.t.id)).map((x) => x.matchupPeriodId);
    if (meets.length) {
      bits.push(`第 ${meets[0]} 週${meets[1] ? `與第 ${meets[1]} 週` : ""}會跟你碰面`);
    }
    toYou = bits.join("。") + "。";
  }
  return { core: coreText, judge: parts.join("。") + "。", toYou };
}

象目前缺陣（OUT）或出賽成疑（DTD）時，名字旁標出來並寫對他的影響；「隊友復出」提醒裡，如果復出的主力是他的助攻對象，會補一行互相助攻幾次。資料來自 pbpstats 助攻網路，每天更新", false],["載入變快：打開網頁時，原本讀資料是一個等一個（後台資料檔、撿人紀錄、新秀資料、傷兵新聞、逐場數據…），現在沒有先後關係的同時讀，實測載入時間從約 7 秒降到約 4.5 秒，畫面和判斷結果不變", false],["「本週對戰」沒比賽的日子不再寫「0 (+0)」：NBA 整天沒比賽寫「— 沒比賽」，有比賽但這隊沒人能上場寫「0 ／ 0 人」", false],["修正：「本週對戰」點已打完的日子看每位球員，之前用「現在」的傷勢狀態回推，今天才生病的人（例如 Paul George 昨天拿 49 分）會被當成不在預估先發、合計少算；現在改成從那天真的有上場的人排預估先發，沒上場的人（例如在 IR 的 Holmgren 0.0 分）也不再列出", false],["背靠背輪休紀錄更即時：今天是背靠背第二場、昨天有上場，今天被列 OUT 但不在 ESPN 傷兵頁（不是因為受傷，例如 Paul George 今天排休），當天就算一次輪休，不用等他下一場上場後才算", false], ["上場時間原因、隊友復出提醒、新秀球員卡修正\n• 應對策略的勝率改得比較好懂：原本「64 →29%」容易看不懂，現在大數字是現在的勝率（64%），下面一行紅字寫「對手撿滿後 29%」（對手把撿人名額用完後你的勝率）\n• 上場時間變少會寫原因：單場分析裡上場時間比平常少時，會寫這場是不是背靠背第二場（疲勞控管）、大比分（差 20 分以上，主力提早下場）或犯規麻煩（5 犯以上）；球員視窗「教練」那一行寫最近被減少上場時間時，也會看少打的那幾場有幾場是這些原因，判斷是暫時的還是角色真的變小\n• 球員視窗新增「隊友復出」提醒：他是靠同隊主力缺陣才打得好（主力不在時 fantasy 分數多 5 分以上），那位主力剛復出或傷況轉好時，寫出他在主力缺陣和有上場時各平均幾分、之後可能少幾分\n• 修正：新秀觀察裡持有率低的新秀（例如 Stirtz、Ament），點開球員視窗只剩比賽表格、沒有名字和判斷，現在會另外補抓他們的資料", false], ["「本週已加人數」修正：每週最後一天第一場開打後，ESPN 就把撿人算到下一週，網頁現在也跟著換到新的一週算（週一早上 ESPN 還沒換週時，不會再顯示上週的次數）", false], ["中鋒上限套用到全站：自由球員的判斷、聯盟動態的「可以搶」、潛力股的「值得撿」、Discord 的 waiver 提醒和有人丟好球員通知，都改成「撿他要換掉誰」一起算；你的中鋒已經 4 個時，撿中鋒只會跟陣容裡可以換掉的中鋒比", false], ["修正：今天剛被丟到 waiver 的人（例如 Gafford、Hartenstein），ESPN 還會留在原隊名單裡，之前被誤算成還在那隊；現在他們算可以撿的 waiver 球員，原隊的陣容和中鋒人數也不再算他們", false], ["換人推薦會照聯盟的位置上限：陣容裡有中鋒（C）資格的人最多 4 個（像 Diabate 主要是 PF 但有 C 資格也算），已經有 4 個時，只會建議用有 C 資格的人換有 C 資格的人（補強建議、本週先撿、下週卡位、陣容評估都適用）；另外修正：ESPN 偶爾把剛被別隊撿走的人也列成自由球員（例如 Gafford、Hartenstein），現在已經在陣容裡的人不會再被推薦", false], ["排行榜拿掉「真實水準」欄位，只留即時評分、今年、近 7 天、持有率", false], ["「炭灰螢光」主題換成「夜忍」：忍者風格，黑紫底、血紅重點色，上方大卡片是深紫到暗紅的漸層", false], ["「皇家藍」「深海青」跟其他主題太像，換成莫蘭迪色系的「奶茶」（暖灰底、燕麥奶茶色）和「鼠尾草」（灰綠底、鼠尾草綠）", false], ["主題調整：「夜間球館」改名「暗夜橘」；「白天球館」換成「aespa」（黑底、銀色、極光紫漸層）；「皇家藍」「深海青」改成比較低調的霧藍、玉綠，質感更好", false], ["金色主題太多，「黑金」換成「炭灰螢光」（炭灰底、螢光黃綠）、「紫金」換成「紫銀」（深紫底、銀紫色），選過這兩個的人會直接換成新配色", false], ["「薄荷白」主題換成「皇馬」：照皇家馬德里 2026-27 主場球衣配色，墨綠深色底（不刺眼）、粉紅重點色", false], ["主題調整：「鮮紅黑」跟「酒紅金」太像，換成新的「皇家藍」（深藍底、皇家藍重點色）；「暗夜霓虹」改成「紫金」（深紫底、金色重點色）", false], ["補強建議和潛力股的滑動卡片，點球員名字可以打開球員卡了（iPhone 上點一下常被當成滑動）", false], ["即時評分、pbpstats 後台資料、文字排版\n• 球員視窗新增「近 7 天」區塊（資料來自 pbpstats）：每 36 分鐘得分、球權、命中率、出手區域跟本季比，加上被助攻比例、失誤、犯規、在場淨效率，以及在不在球隊最常用的五人陣容\n• 判斷改用後台最新的 pbpstats 資料：「綜合評分」改名「即時評分」，並加上隊友缺陣、陣容變動、近 7 天球權的調整（陣容評估、補強建議、該換誰、撿人排程都用它），判斷裡會寫基本評分幾分、調整多少；單場分數的說明會寫這場球權比平常多或少；陣容評估、自由球員判斷會寫近 7 天球權變多或變少、有沒有打進球隊最常用的五人陣容、隊友缺陣時他多拿多少；潛力股多了「主力不在場時真的多拿分」和「打進主要陣容」的人；每天的對戰預估改用近 7 天和整季混合的比賽節奏；網頁開著時每 30 分鐘重新讀一次後台資料\n• 整理所有分頁、卡片和球員視窗的文字排版：球員名字、日期、括號裡的數字不再從中間斷行；各隊陣容判斷、本週貢獻榜改成一句一行；下週該先卡位改成「撿／丟／下週幾場」分行；球員比較的結論只寫「可以換掉」「不用撿」這類短結論", false, 200], ["「球員」分頁新增「新秀觀察」：列出今年所有新秀的近 5 場、上場時間、近 10 場走勢和在誰手上，上面直接寫哪些自由球員新秀可以撿", false], ["「預估比對」改成白話的「預估準不準」：兩個大數字寫原本的算法和新算法（加 EPM）平均每人猜差幾分，下面直接寫哪個比較準、猜得偏高還是偏低、差 12 分上下算不算正常、資料夠不夠下結論，不再用看不懂的表格", false], ["傷兵快報每位球員最下面多一行小字，寫 ESPN 這則傷兵消息的更新時間（台北時間，例如「11/8 02:17 更新」）", false], ["傷兵快報排版：第一行是狀態、名字、回歸日；第二行小字是所屬隊伍、傷勢部位、球隊位置（固定一行）；中文說明移到下面，用滿整個寬度，不再被擠在名字和回歸日中間", false], ["修正：網頁開久了之後，左右滑一下會連跳好幾個分頁、直接跳到更新紀錄（每次自動更新資料都多加了一次滑動判斷），現在滑一次只換一個分頁", false], ["修正：陣容、球員分頁大部分是可以左右捲的表格，在上面滑動切不了分頁。現在表格捲到底之後再滑一次就會切換分頁（往左滑時表格在最右邊、往右滑時表格在最左邊）", false], ["「應對策略」的數字固定四格：預估分差、勝率、對手撿滿、你撿滿；名額用完的寫「用完」，有被反超風險時勝率寫成「現在→對手撿滿後」", false], ["「應對策略」加入「前 5 名」那 1 勝（本週總分排聯盟前 5 名多拿 1 勝，也就是中位數規則）：用本週得分排名同一套預估，看你這週會不會在聯盟前一半；不在的話，算剩下的撿人名額用掉能不能擠進去、差幾分。對戰落後時的建議會跟著改：在前一半就提醒守住，撿滿追得上就叫你用名額拿這 1 勝，兩邊都拿不到就不用硬撿", false], ["對手撿滿預警、應對策略和今天要做的事改版、排版整理\n• 主畫面最上面的「領先／落後幾分」加上顏色：領先是綠色字、落後是紅色字，一眼看出現在贏還是輸\n• 新增「對手撿滿」預警：算對手把這週剩下的撿人名額全部用掉、撿場次多的自由球員，最多能追幾分（只算丟掉他陣容裡陣容評估說可以換掉、而且 ESPN 持有率低於 60% 的人，和這週撿來試用的人，不會算丟掉主力或熱門球員這種不合理的操作）。「應對策略」會寫出他撿滿最多追幾分、你的勝率會掉到多少、你撿滿能不能抵消；你落後時也會算你撿滿有沒有機會反超；有被反超風險時，主畫面最上面卡片會多一行紅字提醒\n• 「應對策略」整理：版面改成狀態（領先／拉鋸／落後／小心被反超）、一排數字（預估分差、勝率、對手撿滿、你撿滿）、一句建議、場次和對手各一行；結論（領先／拉鋸／落後／小心被反超）和該怎麼做，名額建議跟你和對手剩下的名額、對手撿滿能追幾分一致，不再出現「名額留到週末」但名額其實已經用完這種矛盾；場次只在差 3 人次以上才提；對手習慣濃縮成一行\n• 「今天要做的事」排版：好幾個球員不再用頓號串成一行，改成一人一行；撿人丟人寫成「撿 誰，丟 誰」；球員名字、日期（例如週六 11/7）、分數不會從中間斷成兩行；下面的說明有好幾句時改成條列（例如撿人排程每一步一行）\n• 球員名字裡的「Jr.」「Sr.」拿掉句點（例如 Wendell Carter Jr），全站一致\n• 補強建議「本週先撿」每一步改成三行：日期／撿誰 丟誰（同一行，中間空格隔開）／本週多拿幾分\n• 「今天要做的事」的撿人排程改成跟補強建議「本週先撿」一樣的排法：每一步三行（日期／撿誰 丟誰／本週多拿幾分），上面一行小字寫總共預估多拿幾分、還可以加幾人", false], ["手機自動更新到最新版：打開網頁或從背景切回來時，會檢查網站有沒有新版本，有就自動重新載入（加到主畫面的也會），不用再手動清快取", false], ["電腦版卡片攤開、Matchup 隊名不換行\n• 電腦版（寬螢幕）的補強建議和其他潛力股不疊卡片，直接全部攤開排成格狀；手機才是左右滑動的堆疊\n• Matchup 表頭的兩隊隊名固定一行（字稍微縮小，真的太長才用「…」截短），不再換行", false], ["首頁卡片排版、補強建議改成滑動卡片\n• 主畫面最上面卡片排版：兩隊分數置中對齊；分數上面的聯盟資訊分成兩行（聯盟・計分方式／第幾週・戰績），不再從中間斷行；「對手習慣」改成跟「對手主力」一樣的左右排法，類型、整季撿幾人、本週用了幾次各一行\n• 補強建議的球員卡片改成堆疊：像交友軟體一樣一次看一張，往左滑看下一位、往右滑回上一位（看完會從頭循環），下面也有 ‹ › 按鈕和「第幾張 / 共幾張」；在卡片上左右滑不會切換分頁，點名字、⚖ 比較照常可以用\n• 補強建議下方的「其他潛力股」也改成堆疊卡片（跟上面推薦球員一樣左右滑動）：每張有位置、球隊、持有率、⚖ 比較，標籤（上升中／隊友缺陣、值得撿、FA／Waiver），數字（最近 5 場或隊友缺陣時、之前、今年、近 7 天）和原因條列", false], ["對手習慣改名、本週得分排名排版\n• 對手撿人丟人習慣的類型改成兩個字：試用派 → 試車、升級派 → 升級、亂換派 → 降級、穩定派 → 平換、很少動 → 佛系（說明欄、應對策略、本週對決一起改）\n• 本週得分排名：隊伍名字固定一行，太長用「…」截短，每列一樣高", false], ["補強建議整合潛力發掘、手機排版整理、近 7 天改名\n• 修正：手機上卡片標題被副標題擠到換行（潛力發掘、補強建議、本週貢獻榜、球員比較、聯盟動態等）：標題固定不換行，副標題在右邊剩下的空間裡換行；「潛力發掘」副標題縮短成「隊友缺陣・上升中」\n• 「近 7 場」改名為「近 7 天」：ESPN 這個數字其實是最近 7 天的平均（通常 2 到 4 場），名稱改成跟資料一致（陣容評估、自由球員、補強建議、球員比較、聯盟總表、說明文字等）；「最近 N 場」（單場分析、上升中）是真的照場數算，維持不變\n• 「潛力發掘」整合進「補強建議」：推薦卡片上如果該球員最近真的變強，會多「上升中」或「隊友缺陣」標籤和原因；不在推薦名單裡的潛力股列在卡片下方「其他潛力股」，「你的陣容也有人上升中」也移到這裡；「決策」分頁少一張卡片\n• 手機版排版整理：陣容評估和自由球員表格每列高度變一致（判斷欄加寬，不再有特別高的列）；傷兵快報最後的「球隊 位置」不會被拆成兩行；各隊陣容判斷的「展開陣容」固定在隊名同一行；球員比較副標題縮短成一行\n• 主畫面的「對手主力」改成每人一行：名字、今年平均、剩幾場對齊排好，點名字可以看詳細\n• 各卡片下方的說明欄（橘色底的小字）改成一句一行的條列，不再是一大段文字\n• 排行榜手機排版：球員名字和下面的小字（球隊、位置、所屬隊伍）都固定一行，太長用「…」截短，每列一樣高；排行榜下方的說明也改成條列\n• 修正：排行榜的傷病標示改看 ESPN 傷兵頁，只是放在傷兵名單（IR）位置、其實已經能打的人不再標 OUT（改標 IR）\n• 排行榜裡名字太長（超過 16 個字母）的球員，名改成縮寫（例如 Giannis Antetokounmpo → G.Antetokounmpo），點名字仍可看完整資料", false], ["補強建議排版整理：上面「本週先撿」「長期換人」改成兩個並排的小方塊、條列寫；下面每位球員改成跟潛力發掘一樣的卡片：名字和 ⚖ 比較在最上面，下一行是推薦名次、綜合 +幾分、頂替誰，數字（今年、近 7 場、去年、本週和下週場次）排成一排，原因改成條列", false], ["潛力發掘改版並整合「上升中」：同一張卡片列出兩種最近真的變強的自由球員——①隊友缺陣：用逐場紀錄比「主力缺陣」和「主力有上」兩組，缺陣時上場時間和分數都明顯比較高，而且有改打先發、球權或助攻增加的佐證；②上升中：最近 5 場明顯比之前好、統計上不太像隨機起伏，而且原因會持續（上場時間、先發、球權、籃板助攻抄截阻攻變多）。每人標出是哪一種（可能兩種都有）、分數、原因和值不值得撿；你的陣容如果有人上升中，下面會另外提醒先別急著丟", false], ["「決策」分頁新增「潛力發掘」（在補強建議下面）：找出近 7 場上場時間比今年多 3 分鐘以上、而且 NBA 球隊有主力缺陣的自由球員，列出持有率、分鐘和分數（近 7 場 / 今年）、缺陣的是誰和預計何時回來，再用一句話建議值不值得撿；主力回來後角色可能縮回去", false], ["球員視窗的名字旁邊多顯示位置（例如「OKC · PG/SG · Podcast P」），可以打的位置都會列出來", false], ["背靠背第二場的「第二場 ±%」：去年和今年有上場的背靠背第二場少於 10 場的人不顯示（樣本太少，數字幾乎只是聯盟平均）；預估 FPTS 對這些人不調整（聯盟平均 +2.6% 多半是狀況不好的人被輪休造成的偏差）", false], ["球員視窗未來賽程的「預估 FPTS」套用背靠背第二場的變化：連兩天的第二場會再乘上他自己背靠背第二場的預估變化（例如 SGA −5.6%），紀錄不到 10 場的人不調整", false], ["背靠背第二場預估變化：用去年整季和今年的 NBA 比賽紀錄（3500 多場背靠背第二場），算每位球員背靠背第二場有上場時，分數比平常多或少幾 %；場次少的人會往聯盟平均（+2.6%）靠。顯示在「連兩天比賽」名單和球員視窗的賽程（「第二場 −5%」，下滑 5% 以上紅色、上升 5% 以上綠色），每週自動更新", false], ["背靠背第二場輪休紀錄：球隊連兩天比賽、他第一天有上、第二天沒上、之後又有上場，就算一次輪休（之後也沒上場的算傷缺，不算輪休）。「本週對戰」的「連兩天比賽」名單和球員視窗的未來賽程，會標出「輪休過 1/2」，一半以上標紅色「常輪休」；只看最近 16 天的紀錄，球季越後面越準", false], ["「各隊陣容判斷」卡片可以整張收起：點標題收合或展開（預設展開，會記住你的選擇）", false], ["「聯盟」分頁新增「各隊計分數據總數」（在聯盟總表下面）：10 隊整季有被計分的數據累計——得分、進攻籃板、籃板、助攻、抄截、阻攻、失誤、犯規、投進／出手、罰進／罰球、三分進／出手、勝場、四雙和總分；每一項聯盟最好的標綠色、最差的標紅色（失誤、出手這類扣分項目，最少的綠色、最多的紅色），點標題由多到少排序", false], ["「聯盟」分頁拿掉「每週得分走勢」卡片（目前週數太少看不出趨勢，也跟本週得分排名、聯盟總表重複）", false], ["球員視窗分數原因：對手球隊從上面的清單移到「結論」最後一條，用一句話寫防守強弱和聯盟排名（例如「對手 NO 防守中等（聯盟第 16）」），跟原因相關的那一項讓對手拿得比聯盟多或少 8% 以上也會接在後面", false], ["補強建議每張卡片的白字改用「分析與結論」同一套邏輯：不再只比去年和近 7 場，改成講最近幾場的分數和原因——手感熱會提醒可能回落、上場時間變長說明比較能持續、手感冷說明通常會回來、上場時間掉了提醒要小心，都有數字根據；讀不到逐場數據時才用原本的說法", false], ["陣容評估改用「原因」判斷（跟球員視窗浮現的單場分析與結論同一套門檻）：近 7 場分數偏低時，先看原因——如果是投籃手感冷（真實命中率比他今年低 6 個百分點以上）就標「留下觀察：這種通常會回來」，不再叫你換掉；如果是上場時間掉了或某一項變少，「可以換掉」的說明會寫出原因。建議換上的自由球員如果最近手感特別熱，也會提醒可能回落。補強建議、撿人排程、下週該先卡位都跟著陣容評估，所以判斷一致", false], ["球員視窗和球員比較裡「單場分數」改成整數，不顯示小數點（「最近 29(+0.8)」「分數」欄、浮現的原因、點長條的說明）；跟平均的差仍保留一位小數", false], ["球員視窗「最近 10 場」表格：游標指到（手機點一下）分數，會浮現這一場分數高或低的原因——把當場分數拆成得分與投籃、籃板、助攻、抄截、阻攻、失誤、犯規、球隊勝負，跟他近 10 場平均比，列出差最多的三項（投籃幾中幾、各項幾次），也會提示上場時間比平常少或多、對手防守強弱，右上角在這場爆發（比今年平均高很多）時出現火焰圖示、冰冷（低很多）時出現雪花圖示，最後用白話寫出結論（為什麼這場分數偏低、或偏高／爆發）", false], ["點開球員視窗，最上面（賽程下面）多一張「分數變化」圖卡：最近 10 場每場 fantasy 分數的迷你長條圖：綠色長條高於他今年平均、紅色低於，右邊寫最近一場的分數和跟平均的差（例如「最近 29.0(+0.8)」），點長條看那一場的對手、分數、上場分鐘", false], ["「決策」分頁新增「位置稀缺度」卡片（在補強建議下面）：PG、SG、SF、PF、C 五個位置，各自顯示自由市場還有幾人可補（今年平均 15 分以上）、平均最高的前 3 位，並指出目前最難補的位置", false], ["球員視窗裡按「加入比較」後，視窗會自動關起來", false], ["「排行榜」不再佔分頁：改成主畫面最上面卡片右上角的小圖示（直條圖），點一下排行榜會蓋在畫面上展開（不佔分頁位置），右上角的 X 關閉回到原本的畫面；分頁變成 6 個加更新紀錄", false], ["新增「消息」分頁（在「球員」後面）：把「聯盟動態」（誰撿人丟人）、「熱門撿人」、「對手撿人丟人習慣」三張消息類的卡片集中在這裡（原本分散在「球員」和「決策」分頁）；卡片可以點標題收合，預設只展開「聯盟動態」", false], ["新增「傷兵快報」卡片（「消息」分頁最上面）：列出你的傷兵、各隊核心球員（平均前 60 名）、值得注意的自由球員（持有率 10% 以上或平均 20 分以上）的傷病狀態、預計回歸日（沒有就用新聞推估），資料直接用 ESPN 傷兵頁（espn.com/nba/injuries）：狀態、傷勢部位、預計回歸日、新聞說明（有中文說明就顯示中文，沒有就顯示英文原文）；分成「你的球員」「聯盟其他隊的球員」「自由球員」，其他沒人持有的 NBA 傷兵收在最下面；不會發任何通知", false], ["手機可以左右滑動切換分頁：往左滑到下一個分頁，往右滑回上一個（戰況 → 決策 → 陣容 → 球員 → 消息 → 聯盟 → 更新紀錄）；在可以橫向捲動的表格、圖表、輸入框上滑動不會切換", false], ["新增「排行榜」分頁（在「球員」後面）：10 隊陣容加上載入的自由球員的球員排行榜，可以篩選（全部／我的隊／自由球員、位置 PG～C）、搜尋（打錯字也找得到），點表頭換排序依據（綜合評分、真實水準、今年、近 7 場、持有率），每位球員顯示球隊、位置、屬於哪一隊，點名字看詳細", false], ["下週卡位、傷兵新聞與判斷顏色\n• 下週預覽新增「下週該先卡位」：只列陣容評估說可以換掉的人，換成綜合評分多 3 分以上、下週場次多的自由球員，算出下週預估多拿幾分，並標出補哪幾天的空缺、waiver 球員要在台北幾點前下 claim；沒有該換的人就明說不用動\n• 陣容評估讀傷兵新聞：ESPN 沒給預計回歸日時，從新聞抓「預計缺陣幾週」，用來判斷要不要放掉長期傷兵\n• 陣容判斷的顏色統一成四種：核心金色、先發主力綠色、觀察橘色、可以換掉紅色（八款配色都有各自調整），球員名字也跟著用同樣的顏色\n• 陣容評估表和自由球員表：點「球員」標題，依金、綠、橘、紅排序，同一種顏色裡今年平均高的排前面，再點一次回到原本順序", false], ["進階數據、預估 FPTS、預估比對與細節修正\n• 新增進階數據（使用率、真實命中率、每百回合得分，每天更新）：點球員的視窗多一塊進階數據和白話判斷；球員比較表多三列進階\n• 陣容評估參考進階數據：真實命中率明顯低於「他自己去年」、但球權不低的人，不再被評成「可以換掉」，改成「留下觀察」；建議換上的自由球員命中率偏高會提醒可能回落。出賽 5 場以下樣本太少，只顯示數字、不影響判斷\n• 點球員的「未來 5 場賽程」多一欄「預估 FPTS」：用 EPM 預期能力（模型預測的真實水準，跟今年預估混合，出賽越少越相信 EPM）、對手在得分／籃板／助攻／抄截／阻攻／失誤各類被打的程度、兩隊比賽節奏來換算；EPM 這次只用在賽程預估和球員視窗，不影響撿人排程和補強建議\n• 新增「預估比對（實驗）」：每天記錄兩種預估（原本的、混合 EPM 的），等比賽打完跟實際 FPTS 比，看哪個比較準（球員分頁最下面，預設收合）\n• 球員比較的搜尋欄：打名字就能找球員，打錯一兩個字母也找得到\n• 修正：本週得分排名「你的隊伍」那一列的名次格沒填滿；提醒文字最前面的 ⚠、🔥 小圖案拿掉", false], ["換配色擴充、球員比較長條圖\n• 換配色增加到 8 款：夜間球館、白天球館、鮮紅黑、黑金、暗夜霓虹、酒紅金、深海青、薄荷白（原本的「深藍數據」「極簡灰白」換掉）；選單改成 4 欄色塊，不用往下捲\n• 球員比較的「最近 10 場每場得分」折線圖，改成每個人一張卡片的長條圖：每根長條是一場比賽，實色是高於他今年平均、淡色是低於，虛線是今年平均，所有人用同一個高度比例；卡片下面直接寫最高、最低、起伏和高於平均幾場，點長條看那天的分數和上場分鐘", false], ["聯盟總表新增欄位、撿人排程跟陣容評估一致\n• 聯盟總表新增「榜首率」（模擬 4000 次中，例行賽結束排第 1 的機率）和「總失分」（對手累計得到的分數），兩欄都可以點標題排序\n• 修正：「今天要做的事」和「補強建議」的「本週先撿」（撿人排程）改成跟「陣容評估」同一套判斷：只丟陣容評估說可以換掉的人，而且撿進來的人綜合評分要多 3 分以上；陣容評估說「留下」「留下觀察」的人不會再被叫你丟", false], ["修正：補強建議和「陣容評估」卡片的判斷不一致（ function strategyCard(D, A) {
  // 版面：狀態標籤 → 一排數字 → 一句建議 → 左右對齊的補充（場次、對手）；所有建議看同一組數字，不會前後矛盾

  const myG = restDays.reduce((s, p) => s + cnt(D.myRoster, p), 0), opG = restDays.reduce((s, p) => s + cnt(D.oppRoster, p), 0);

    const fin = (t) => (D.weekScores[t.id] || 0) + rest(D.rosters[t.id]);
    const mine = fin(D.me), others = D.teams.filter((t) => t.id !== D.me.id).map((t) => ({ t, v: fin(t) })).sort((a, b) => b.v - a.v);

    ${weeks.map((d, i) => `<text x="${x(i)}" y="${H - 8}" class="ax" text-anchor="middle">第 ${d.w} 週${d.live ? "*" : ""}</text>`).join("")}

// ---------- 適配性：球權分配、球風和球隊節奏、教練的信任度（不看隊友受傷或回歸） ----------
function fitNotes(x) {
  const D = CUR, out = [];

  const R = PA, T = R && R[x.proTeamId];
  // 球權分配
  if (T && T.pf) {

    for (const f of D.fas) if (!seen.has(f.id)) { seen.add(f.id); mates.push(f); }
    const team = mates.filter((y) => y.proTeamId === x.proTeamId && y.box && y.box.pts > 0).sort((a, b) => b.box.pts - a.box.pts);
    const rank = team.findIndex((y) => y.id === x.id) + 1, share = x.box.pts / T.pf;
    const role = share >= 0.2 ? "是隊上的主要進攻點，球權穩定" : share >= 0.12 ? "是固定的進攻選項" : share >= 0.07 ? "是配角，出手機會普通" : "出手機會少，分數多靠籃板、防守等其他數據";
    out.push(`球權：每場 ${f1(x.box.pts)} 分，佔球隊得分 ${Math.round(share * 100)}%${rank ? `，隊上第 ${rank} 得分手` : ""}，${role}`);
  }
  // 球風和球隊節奏
  const b = x.box, kinds = [];
  if (b.reb >= 8) kinds.push("籃板型"); if (b.ast >= 6) kinds.push("組織型"); if (b.stk >= 2.5) kinds.push("防守型"); if (b.pts >= 18) kinds.push("得分型");
  const kind = kinds.join("、") || "全能平均型";
  if (T && T.pf && T.pa) {
    const all = Object.values(R).filter((t) => t.pf && t.pa), lg = all.reduce((s, t) => s + t.pf + t.pa, 0) / (all.length || 1), pace = T.pf + T.pa - lg;
    const team = ABBR[x.proTeamId] || "球隊";
    if (pace >= 6) out.push(`球風：${team} 節奏偏快（每場得失分合計 ${Math.round(T.pf + T.pa)}，比聯盟平均多 ${Math.round(pace)}），回合多，對他這種${kind}的數據累積有利`);
    else if (pace <= -6) out.push(`球風：${team} 節奏偏慢（每場得失分合計 ${Math.round(T.pf + T.pa)}，比聯盟平均少 ${Math.round(-pace)}），回合少，他這種${kind}的數據會比較受限`);
    else out.push(`球風：${team} 節奏普通（每場得失分合計 ${Math.round(T.pf + T.pa)}），他是${kind}球員（每場 ${f1(b.pts)} 分、${f1(b.reb)} 籃板、${f1(b.ast)} 助攻）`);
  }
  // 教練的信任度：上場時間
  if (x.min7 != null) {
    const d = x.min != null ? x.min7 - x.min : 0;
    const lvl = x.min7 >= 32 ? "是教練信任的主要輪換" : x.min7 >= 24 ? "是穩定的輪換球員" : x.min7 >= 16 ? "上場時間不多，教練還沒完全重用" : "只是邊緣輪換";
    out.push(`教練：近 7 天平均 ${Math.round(x.min7)} 分鐘，${lvl}${Math.abs(d) >= 3 ? `，比今年${d > 0 ? "多" : "少"} ${Math.round(Math.abs(d))} 分鐘，${d > 0 ? "最近更被重用" : `最近被減少上場時間${minTrend(x) || ""}`}` : ""}`);
  }
  return out;
}

function schedTag(x, D) {

  const opp = Object.entries(TEAM_GAME[x.proTeamId] || {}).map(([p, g]) => [Number(p), g]).filter(([p]) => p >= D.period).sort((a, b) => a[0] - b[0]).slice(0, 5)

  if (!opp.length) return null;
  const avg = opp.reduce((s, r) => s + r.pct, 0) / opp.length;
