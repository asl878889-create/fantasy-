<style>

:root[data-ui="D"] { --core: #f2c94c; --obs: #ff8a1f; --bg: #09080e; --card: #14121c; --ink: #ecebf2; --muted: #9a96aa; --line: #27233a; --accent: #e0414b; --on-accent: #ffffff; --hero: #14121c; --hero-bg: linear-gradient(135deg, #2e2052 0%, #14121c 62%, #2a0d12 100%); --hero-ink: #f5f3fb; --hero-muted: #bdb6d6; --hero-line: #8e1d27; --c1: #e0414b; --c2: #9b86e0; --c3: #5fd38a; --c4: #4cc9f0; }
:root[data-ui="E"] { --core: #fdb927; --obs: #ff9f43; --bg: #0e0818; --card: #1a1030; --ink: #f4eefc; --muted: #a99bc4; --line: #34244f; --accent: #fdb927; --on-accent: #2a1a00; --hero: #1a1030; --hero-bg: linear-gradient(135deg, #34175a 0%, #221040 55%, #1a1030 100%); --hero-ink: #fff8e6; --hero-muted: #e2d0f5; --hero-line: #fdb927; --c1: #fdb927; --c2: #6f45ad; --c3: #5fd38a; --c4: #ff7eb6; }
:root[data-ui="F"] { --core: #f2c94c; --obs: #ff8a1f; --bg: #13080b; --card: #1f0f13; --ink: #f6ecea; --muted: #a58c8a; --line: #3d1f26; --accent: #e8c56a; --on-accent: #2a1a02; --hero: #1f0f13; --hero-bg: linear-gradient(135deg, #7a1630 0%, #1f0f13 70%); --hero-ink: #fff3ea; --hero-muted: #d9b9a8; --hero-line: #5a2030; --c1: #e8c56a; --c2: #6fb7ff; --c3: #6ed39a; --c4: #ff8aa8; }
:root[data-ui="H"] { --core: #f2c94c; --obs: #ff8a1f; --bg: #08130f; --card: #102019; --ink: #edf3ef; --muted: #91a59b; --line: #1f372c; --accent: #f29bb8; --on-accent: #2a0a16; --hero: #102019; --hero-bg: linear-gradient(135deg, #1f5a45 0%, #102019 70%); --hero-ink: #ffffff; --hero-muted: #c4d8ce; --hero-line: #f29bb8; --c1: #f29bb8; --c2: #4cc9f0; --c3: #5fd38a; --c4: #f2c94c; }
.bar .ok-btn { padding: 2px 10px; white-space: nowrap; font-size: 12px; border: 0; } .bar .is-new::before { white-space: nowrap; }
#uibtn { font-size: 16px; line-height: 1; padding: 6px 9px; }
#uimenu[hidden] { display: none; } #uimenu { margin: -4px 0 12px; padding: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
#uimenu button { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 100%; font: inherit; font-size: 12px; padding: 7px 2px 6px; border-radius: 10px; border: 1px solid transparent; background: none; color: var(--ink); cursor: pointer; }
#uimenu button[aria-checked=true] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
#uimenu i { width: 100%; max-width: 54px; height: 26px; border-radius: 7px; border: 1px solid var(--line); flex: none; }
#uimenu small { display: none; }
* { box-sizing: border-box; }

  font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; line-height: 1.6; }
main { max-width: 640px; margin: 0 auto; padding: 16px; }

}

.hero p { margin: 6px 0; font-size: 15px; } .hero .lead.win { color: #5eea8f; } .hero .lead.lose { color: #ff7070; } /* 領先綠、落後紅 */

.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.ok { background: var(--ok-bg); color: var(--ok); }
.tag.bad { background: var(--bad-bg); color: var(--bad); }
.todo b { font-size: 16px; }
.todo p { margin: 2px 0 0; color: var(--muted); font-size: 14px; } .todo > div { min-width: 0; } .todo > .tag { align-self: start; margin-top: 1px; } .todo .nw { white-space: nowrap; } .todo-l { margin: 3px 0 0; padding-left: 18px; color: var(--muted); font-size: 14px; line-height: 1.55; } .todo-l li { margin: 1px 0; } .ac2-sum li.pk, .todo-pk li.pk { margin: 4px 0 8px; } .todo-pk, .todo-wide { grid-column: 1 / -1; } .todo-pk { margin: 0; padding-left: 0; list-style: none; font-size: 14.5px; } .todo-pk li.pk { padding-left: 9px; border-left: 2px solid var(--line); } .todo-pk li.pk > div:not(.up) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13.5px; letter-spacing: -.1px; } .todo-pk .nw { white-space: nowrap; } .todo-sub { font-size: 13px; margin-top: 2px; } .ac2-sum li.pk b { font-weight: 700; } .ac2-sum li.pk > div:not(.up) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; letter-spacing: -.1px; } .ac2-sum .nw { white-space: nowrap; } .todo-n { margin: 2px 0 0; padding-left: 18px; font-weight: 700; line-height: 1.5; }
.tabs { display: flex; gap: 4px; margin-top: 20px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { background: none; border: 0; color: var(--muted); font: inherit; font-weight: 700;
  padding: 10px 12px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
.tabs button.logtab { margin-left: auto; font-size: 13px; } /* 更新紀錄放最右邊，和其他分頁分開 */

.pane[hidden] { display: none; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }

tr.me td { font-weight: 700; color: var(--ink); background: color-mix(in srgb, var(--accent) 12%, transparent); } tr.me td.up { color: var(--ok); } tr.me td.down { color: var(--bad); } tr.me td.win { color: var(--ok); }
/* 自己的隊伍：粗體加淡底色，不用橘紅字（會被當成警告） */
.day { padding: 10px 0; border-bottom: 1px solid var(--line); }
.day:last-child { border-bottom: 0; }

.sub { color: var(--muted); font-size: 13px; }
.mu-nav { display: grid; grid-template-columns: 38px 170px 38px; align-items: center; justify-content: center; gap: 12px; margin: 6px 0 10px; } .mu-back { margin-left: auto; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 16px; font-size: 13px; font-weight: 600; padding: 5px 12px; cursor: pointer; white-space: nowrap; } .mu-nav b { min-width: 0; white-space: nowrap; text-align: center; font-size: 16px; } .mu-nav button { background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 50%; width: 38px; height: 38px; font-size: 22px; line-height: 1; padding: 0; cursor: pointer; } .mu-nav button:disabled { opacity: .3; cursor: default; } .mu-nav button.mu-today { width: auto; white-space: nowrap; border-radius: 16px; font-size: 13px; padding: 0 12px; }
.pill { font-size: 12px; padding: 1px 6px; border-radius: 5px; background: var(--bad-bg); color: var(--bad); margin-left: 4px; white-space: nowrap; }
.msg { text-align: center; padding: 40px 16px; color: var(--muted); }
.roster td { padding: 9px 4px; }
.foldh { cursor: pointer; user-select: none; } .foldh::after { content: "▾"; float: right; color: var(--muted); font-size: 16px; margin-left: 8px; } .card.folded > .foldh::after { content: "▸"; } .card.folded > :not(h2) { display: none !important; } .card.folded > h2 { margin-bottom: 0; }
a.golink { color: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; } .card.flash { animation: flash 1.6s ease; } @keyframes flash { 0%, 60% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
.rankrow { display: flex; align-items: center; justify-content: flex-start; gap: 10px; padding-right: 84px; } .rkb { font-size: 12px; font-weight: 800; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); } .rkb.first { background: var(--accent); border-color: var(--accent); color: var(--on-accent, #10151f); } .rankrow .gn { font-size: 15px; font-weight: 800; color: var(--ok); } .rankrow .gn.bench { color: var(--muted); font-weight: 600; font-size: 13px; }
.pcard { margin: 10px 0; padding: 10px 10px 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); } .pcard .ph { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; } .pcard .ph .sub { margin-left: auto; }

.rkbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; } .rkchip { font: inherit; font-size: 13px; font-weight: 700; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--line); background: none; color: var(--muted); cursor: pointer; } .rkchip.on { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); } .rksep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }

.roster .pill { white-space: nowrap; }

.up { color: var(--ok); } .down { color: var(--bad); } .b2b .pname.star { color: var(--bad); }

.verdict.bad { color: var(--bad); } .verdict.mute { color: var(--muted); }

  if (alt && dg && dg.low && dg.cause === "cold") return { tag: "mid", line: `留下觀察：最近 ${dg.n} 場平均 ${f1(dg.mean)}，比今年 ${f1(x.avg)} 低，原因是${dg.text}，這種通常會回來，先留著。`, alt, hold: true };
  const aa = alt ? advRead(alt) : null, adg = alt ? recentDiag(alt) : null;
  const hotNote = adg && adg.high && adg.cause === "hot" ? `；留意 ${alt.name} 最近 ${adg.n} 場真實命中率 ${pct0(adg.tsR)} 偏高（${adg.tsS != null ? `他今年 ${pct0(adg.tsS)}` : "高於聯盟平均"}），可能回落` : (aa && aa.ok && aa.flag === "hot" ? `；留意 ${alt.name} 真實命中率 ${f1(aa.a.ts)}% 偏高，可能回落` : "");
  const whyNote = dg && dg.low && dg.cause ? `；最近偏低是因為${dg.text}` : "";
  if (alt) return { tag: "bad", line: `可以換掉：自由球員 ${alt.name}（即時評分 ${f1(alt.val)}，比他多 ${f1(alt.val - x.val)} 分${wv(alt)}）比他好${whyNote}${hotNote}。`, alt };
  if (rank <= D.seats.length) return { tag: "good", line: "留下：先發主力，目前沒有更好的自由球員能取代。" };
  if (pct <= -0.15 || (x.min7 != null && x.min != null && x.min7 - x.min <= -3)) return { tag: "mid", line: "觀察：排在替補又在下滑，有更好的人出現就可以換。" };
  return { tag: "mid", line: "留下觀察：排在替補，但目前沒有明顯更好的自由球員。" };
}
// 隊上最該換掉的人：即時評分最低、而且判斷是「可以換掉」的健康球員；沒有就是 null
function dropOf(ros, D) {
  return [...ros].filter((x) => !x.out && x.lineupSlot !== IR).sort((a, b) => a.val - b.val).find((x) => { const j = rosterJudge(x, ros, D); return j.tag === "bad" && j.alt; }) || null;
}

// 每位球員一句話的判斷：[顏色, 文字]
function verdict(x, A) {
  const a = f1(x.avg), l7 = f1(x.last7), ly = f1(x.lastYear);
  const D = CUR, ros = D.rosters[A.t.id] || [], j = rosterJudge(x, ros, D);
  if (j.tag === "bad") return ["bad", `今年 ${a}、去年 ${ly}。${j.line}`];
  if (x.out) { const i = injInfo(x, CUR); return ["mute", `${INJURY[x.injury] || "傷兵"}${i ? `，${i.long}` : ""}，暫時不會得分。去年 ${ly}，回來後再看狀況。`]; }
  if (j.tag === "core") return ["core", `核心。今年 ${a}、去年 ${ly}，不要動。`];
  if (j.hold) return ["mid", j.line];
  if (x.lastYear == null) return ["good", `新秀或去年沒上場，沒有去年樣本。今年 ${a}、近 7 天 ${l7}。`];
  if (x.last7 != null && x.last7 >= x.avg + 5) { const dg = recentDiag(x); return ["good", `近 7 天 ${l7}，比今年 ${a} 高，${dg && dg.high && dg.cause ? dg.text : "手感正熱"}。`]; }
  if (x.last7 != null && x.last7 <= x.avg - 5) { const dg = recentDiag(x); return ["mid", `近 7 天 ${l7}，比今年 ${a} 低，要留意（目前還不用換）${dg && dg.low && dg.cause ? `：${dg.text}` : ""}。`]; } // 紅色只留給「可以換掉」
  if (x.lastYear >= x.avg + 5) return ["mid", `今年 ${a}、去年 ${ly}，還沒回到去年水準，可以再等等。`];
  if (x.avg >= x.lastYear + 5) return ["good", `今年 ${a} 比去年 ${ly} 好，進步明顯。`];
  return ["mid", `表現穩定：今年 ${a}、去年 ${ly}。`];
}

function faVerdict(f, A) {
  const a = f1(f.avg), l7 = f1(f.last7), ly = f1(f.lastYear), w = dropFor(f, CUR);
  if (f.injury === "DAY_TO_DAY") return ["mid", `DTD，撿之前先確認能不能上場。今年 ${a}。`];
  if (w && f.val >= w.val + UPG) {
    if (f.weekGames === 0) return ["mid", `比你的 ${w.name}（今年 ${f1(w.avg)}）好，但本週沒比賽了，可以下週再撿。`];
    return ["good", `比你的 ${w.name}（今年 ${f1(w.avg)}）好，本週還有 ${f.weekGames} 場，值得撿。`];
  }
  if (f.last7 != null && f.last7 >= f.avg + 5) return ["mid", `近 7 天 ${l7}，比今年 ${a} 高，手感正熱，可以觀察。`]; // 綠色只留給「值得撿」
  if (f.last7 != null && f.last7 <= f.avg - 5) return ["bad", `近 7 天 ${l7}，比今年 ${a} 低，先不要撿。`];
  if (f.lastYear != null && f.lastYear >= f.avg + 5) return ["mid", `去年 ${ly}，今年 ${a} 還沒回到水準，有反彈空間。`];
  return ["mute", `跟你現有的人差不多，不急著撿。`];
}
const limitText = (D) => { const l = weeklyLimit(D); return l ? `本週增補上限 ${l} 人（這週有 ${l / D.acq.matchupAcquisitionLimit} 天有 NBA 比賽，每個比賽日 ${D.acq.matchupAcquisitionLimit} 人）。` : ""; };


// 點「今年 / 近7天 / 去年」標題：由高到低排序；再點一次恢復原本順序
const sortState = {};
function applySort(table) {
  const col = sortState[table.id];
  const rows = [...table.querySelectorAll("tr")].slice(1);
  rows.forEach((r, i) => { if (r.dataset.i === undefined) r.dataset.i = i; });
  const val = (r) => { const c = r.children[col]; const v = parseFloat(c.dataset.v != null ? c.dataset.v : c.textContent.replace(/[^\d.\-]/g, "")); return isNaN(v) ? -Infinity : v; };
  const th = col == null ? null : table.querySelector("tr").children[col];
  const RANK = { core: 4, good: 3, mid: 2, bad: 1, mute: 0 }; // 球員欄：金（核心）→ 綠（先發主力）→ 橘（觀察）→ 紅（可以換掉）→ 其他
  const vrank = (r) => { const c = r.children[col]; const k = Object.keys(RANK).find((n) => c.classList.contains(n)); return k == null ? -1 : RANK[k]; };
  const avg = (r) => { const c = r.children[3]; const v = parseFloat(c ? c.textContent : ""); return isNaN(v) ? -Infinity : v; };
  if (th && th.dataset.order === "verdict") rows.sort((a, b) => vrank(b) - vrank(a) || avg(b) - avg(a) || a.dataset.i - b.dataset.i); // 同一種顏色裡，今年平均高的在前面
  else rows.sort((a, b) => col == null ? a.dataset.i - b.dataset.i : val(b) - val(a) || a.dataset.i - b.dataset.i);
  const body = rows[0] ? rows[0].parentNode : null;
  rows.forEach((r) => body.appendChild(r));
  table.querySelectorAll("th.sortable").forEach((th) => th.classList.toggle("on", th.cellIndex === col));
  if (table.id === "t-rk") rows.forEach((r, i) => r.classList.toggle("rk-x", i >= 15)); // 新秀觀察：排序後只先顯示前 15 位
}
document.addEventListener("click", (e) => { const b = e.target.closest("[data-rkall]"); if (!b) return; const w = document.getElementById("rkwrap"); window.__rkAll = !window.__rkAll; w.classList.toggle("all", window.__rkAll);
  b.textContent = window.__rkAll ? "收起" : `看其他 ${w.querySelectorAll(".rkr.rk-x").length} 位`; });
function rkSort(btn, key) { // 新秀觀察：點標題排序（再點反過來）；「球員」＝恢復原本順序
  const w = btn.closest(".rkwrap"), list = w.querySelector(".rkl2"), asc = btn.dataset.dir === "0" ? 1 : 0;
  w.querySelectorAll(".rkh button").forEach((x) => { x.dataset.dir = ""; x.classList.remove("on"); }); btn.dataset.dir = String(asc); btn.classList.add("on");
  const rows = [...list.children]; rows.sort((a, b) => key === "i" ? a.dataset.i - b.dataset.i : (asc ? Number(a.dataset[key]) - Number(b.dataset[key]) : Number(b.dataset[key]) - Number(a.dataset[key])) || a.dataset.i - b.dataset.i);
  flipRows(list, () => rows.forEach((r, i) => { list.appendChild(r); r.classList.toggle("rk-x", i >= 15); }));
  const mb = w.parentElement.querySelector("[data-rkall]"); if (mb && !window.__rkAll) mb.textContent = `看其他 ${w.querySelectorAll(".rkr.rk-x").length} 位`;
}
function setupSort() {
  document.querySelectorAll("table[id]").forEach((table) => {
    table.querySelectorAll("th.sortable").forEach((th) => th.addEventListener("click", () => {
      sortState[table.id] = sortState[table.id] === th.cellIndex ? null : th.cellIndex;

    }));
    if (sortState[table.id] != null) applySort(table);

}

const BODY = { Knee: "膝蓋", Ankle: "腳踝", Hamstring: "大腿後側", Back: "背部", Foot: "腳", Hip: "髖部", Shoulder: "肩膀",
  Wrist: "手腕", Calf: "小腿", Groin: "鼠蹊部", Illness: "生病", Concussion: "腦震盪", Hand: "手", Finger: "手指",
  Achilles: "阿基里斯腱", Toe: "腳趾", Elbow: "手肘", Quadriceps: "大腿前側", Quad: "大腿前側", Thumb: "拇指", Rest: "休息",
  Personal: "個人因素", Abdomen: "腹部", Oblique: "側腹", Neck: "頸部", Thigh: "大腿", Leg: "腿", Shin: "脛骨", Chest: "胸部",
  Rib: "肋骨", Heel: "腳跟", Knee_: "膝蓋", Face: "臉部", Eye: "眼睛", Nose: "鼻子", Head: "頭部", Lower_Leg: "小腿", Arm: "手臂",
  "Not Injury Related": "非傷病", Undisclosed: "未公開", Suspension: "禁賽" };
// 傷勢說明：{ short: 放在標籤上, long: 放在判斷裡 }
function injInfo(x, D) {
  const d = x.injuryInfo;
  if (!d) return null;
  const part = d.type ? (BODY[d.type] || d.type) : "";
  if (d.outForSeason) return { short: "報銷", long: `${part ? part + "傷，" : ""}本季報銷` };
  if (d.expectedReturnDate) {
    const [y, m, dd] = d.expectedReturnDate, ret = new Date(Date.UTC(y, m - 1, dd));
    const left = Math.round((ret - D.today) / 86400000);
    return { short: `${m}/${dd}`, long: `${part ? part + "傷，" : ""}預計 ${m}/${dd} 回歸${left > 0 ? `（還有 ${left} 天）` : ""}` };
  }
  return part ? { short: "", long: `${part}傷，還沒有預計回歸日` } : null;
}

// 撿人排程：用本週剩下的增補額度，挑「哪天撿誰、丟誰」讓本週預估得分最多
function streamPlan(D, adds, ignoreLimit, opt = {}) {
  const ros0 = opt.ros || D.myRoster, chase = !!opt.chase; // chase：算「這週撿滿最多能多拿幾分」（對手追分、你反制），只丟陣容評估說可以換掉的人和這週撿來的人
  const limit = weeklyLimit(D);
  // ignoreLimit：額度用完時，算「如果還有額度」的參考排程（每個比賽日最多 1 人）
  // 今天的比賽如果已經全部打完，今天就不能再撿人排進去了
  const dayOver = (p) => Object.values(GAMES).filter((g) => g.scoringPeriodId === p).every((g) => g.statsOfficial || Date.now() >= g.date + 3.5 * 3600000);
  const rem = D.remaining.filter((p) => !dayOver(p));
  let budget = ignoreLimit ? rem.length : limit == null ? 0 : Math.max(0, limit - adds);
  const left = budget;
  const dayVal = (ros, p) => bestLineup(ros.filter((x) => x.games.has(p) && !x.out), D.seats).reduce((s, x) => s + x.proj, 0);
  const pool = D.fas.filter((f) => f.status !== "WAIVERS" && f.weekGames > 0).slice(0, 25);
  let roster = [...ros0], start = 0;
  const steps = [], taken = new Set();
  while (budget > 0) {
    // 只丟「陣容評估」卡片說可以換掉的人（可以換掉，或「觀察：…有更好的人出現就可以換」）；說「留下」「留下觀察」的人不丟
    const canDrop = (x) => { const j = rosterJudge(x, ros0, D); return j.tag === "bad" || (j.tag === "mid" && /^觀察：/.test(j.line)); };
    const drops = roster.filter((x) => !x.out && x.lineupSlot !== IR && (taken.has(x.id) || !ros0.some((y) => y.id === x.id) || (canDrop(x) && !(chase && x.own >= 60))) /* 追分時不算丟掉持有率 60% 以上的人：沒有人會為了一週丟掉這種球員 */).sort((a, b) => a.proj - b.proj).slice(0, 4);
    let best = null;
    for (let i = start; i < rem.length; i++) {
      const days = rem.slice(i), base = days.map((p) => dayVal(roster, p));
      for (const f of pool) {
        if (taken.has(f.id) || !days.some((p) => f.games.has(p))) continue;
        for (const d of drops) {
          if (!posOk(f, d, roster)) continue; // 位置上限（例如中鋒最多 4 人）
          if (!chase && (f.val < d.val + UPG || d.avg >= f.avg)) continue; // 跟陣容評估同一個門檻：撿進來的人即時評分要多 3 分以上，長期陣容才不會變弱
          const next = roster.filter((x) => x.id !== d.id).concat(f);
          const gain = days.reduce((s, p, j) => s + dayVal(next, p) - base[j], 0);
          if (!best || gain > best.gain) best = { i, f, d, gain, next };
        }
      }
    }
    if (!best || best.gain < 3) break;
    steps.push({ p: rem[best.i], f: best.f, d: best.d, gain: best.gain });
    taken.add(best.f.id);
    roster = best.next; start = best.i; budget--;
  }
  return { limit, left, steps, total: steps.reduce((s, x) => s + x.gain, 0) };
}

// 下週預覽：你和下週對手每天能排上先發的人數和預估分
function nextWeekPreview(D) {
  if (!D.nextOpp) return null;
  const oppRos = D.rosters[D.nextOpp.id];
  const day = (ros, p) => bestLineup(ros.filter((x) => x.games.has(p) && !x.out), D.seats);
  const days = D.nextWeek.map((p) => {
    const a = day(D.myRoster, p), b = day(oppRos, p);
    return { p, games: D.gameDays.has(p), mine: a.length, theirs: b.length,
      myProj: a.reduce((s, x) => s + x.proj, 0), oppProj: b.reduce((s, x) => s + x.proj, 0) };
  });
  const nextSet = new Set(D.nextWeek);
  const fas = D.fas.map((f) => Object.assign(Object.create(f), { nextGames: [...f.games].filter((g) => nextSet.has(g)).length }))
    .filter((f) => f.nextGames >= 3).sort((a, b) => b.nextGames * b.proj - a.nextGames * a.proj).slice(0, 5);
  // 下週該先卡位誰：只丟「陣容評估說可以換掉」的人，撿進來的人即時評分要多 3 分以上（跟陣容評估同一個門檻）；
  // 再看下週每天排進先發後，總共能多拿幾分，挑最多的
  const rosAll = D.rosters[D.me.id] || D.myRoster;
  const dropsN = rosAll.filter((x) => { const j = rosterJudge(x, rosAll, D); return j.tag === "bad" && j.alt; }).sort((a, b) => a.val - b.val);
  const dv = (ros, p) => bestLineup(ros.filter((x) => x.games.has(p) && !x.out), D.seats).reduce((t, x) => t + x.proj, 0);
  const base = D.nextWeek.map((p) => dv(D.myRoster, p)), picks = [];
  let rosNow = [...rosAll]; // 一個一個卡位：前面已經建議的撿丟要算進位置上限
  for (const d of dropsN) {
    const best = upgrades(d, D, rosNow).filter((f) => !f.out && [...f.games].filter((g) => nextSet.has(g)).length >= 2 && !picks.some((q) => q.f.id === f.id)).map((f) => {
      const nx = D.myRoster.filter((x) => x.id !== d.id).concat(f), dg = D.nextWeek.map((p, i) => dv(nx, p) - base[i]);
      return { f, d, gain: dg.reduce((t, v) => t + v, 0), days: D.nextWeek.filter((p, i) => dg[i] > 0.5 && f.games.has(p)), n: [...f.games].filter((g) => nextSet.has(g)).length };
    }).filter((c) => c.gain >= 3).sort((a, b) => b.gain - a.gain)[0];
    if (best) { picks.push(best); rosNow = rosNow.filter((x) => x.id !== best.d.id).concat(best.f); }
  }
  picks.sort((a, b) => b.gain - a.gain);
  const gapDays = days.filter((d) => d.games && d.mine < D.seats.length).map((d) => d.p);
  return { opp: D.nextOpp, days, fas, picks: picks.slice(0, 3), gapDays, hasDrop: dropsN.length > 0,
    my: days.reduce((s, d) => s + d.myProj, 0), their: days.reduce((s, d) => s + d.oppProj, 0),
    myStarts: days.reduce((s, d) => s + d.mine, 0), theirStarts: days.reduce((s, d) => s + d.theirs, 0) };
}

// 季後賽機率：用每隊的平均週得分和陣容實力，把剩下的例行賽模擬 4000 次
function playoffOdds(D, league) {
  const S = D.lg.settings.scheduleSettings, reg = S.matchupPeriodCount, spots = S.playoffTeamCount;
  const teams = D.teams, done = Math.max(1, D.week - 1);
  const games = teams[0].record.overall.wins + teams[0].record.overall.losses + teams[0].record.overall.ties;
  const bonus = games >= 2 * done; // 有「勝過聯盟中位數多一勝」的規則
  const power = Object.fromEntries(league.map((x) => [x.t.id, x.power]));
  const avgPF = teams.reduce((s, t) => s + t.record.overall.pointsFor, 0) / teams.length / done;
  const avgPow = league.reduce((s, x) => s + x.power, 0) / league.length;
  const mean = Object.fromEntries(teams.map((t) => [t.id, 0.5 * (t.record.overall.pointsFor / done) + 0.5 * (power[t.id] / avgPow * avgPF)]));
  const frac = D.remaining.length / 7;
  const randn = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const sched = D.lg.schedule.filter((x) => x.away && x.matchupPeriodId >= D.week && x.matchupPeriodId <= reg);
  const N = 4000, res = Object.fromEntries(teams.map((t) => [t.id, { wins: 0, po: 0, top4: 0, first: 0 }]));
  const hw = {}, mw = {}; // 每隊每週：對戰贏的次數、高於中位數的次數
  for (let n = 0; n < N; n++) {
    const W = {}, PF = {};
    teams.forEach((t) => { W[t.id] = t.record.overall.wins + t.record.overall.ties / 2; PF[t.id] = t.record.overall.pointsFor; });
    for (let w = D.week; w <= reg; w++) {
      const sc = {};
      teams.forEach((t) => {
        const m = mean[t.id];
        sc[t.id] = w === D.week ? (D.weekScores[t.id] || 0) + m * frac + randn() * m * 0.12 * Math.sqrt(frac) : m + randn() * m * 0.12;
        PF[t.id] += sc[t.id];
      });
      sched.filter((x) => x.matchupPeriodId === w).forEach((x) => { const win = sc[x.home.teamId] >= sc[x.away.teamId] ? x.home.teamId : x.away.teamId; W[win]++; hw[win + "_" + w] = (hw[win + "_" + w] || 0) + 1; });
      if (bonus) { const sorted = teams.map((t) => sc[t.id]).sort((a, b) => b - a), med = sorted[Math.floor(teams.length / 2) - 1];
        teams.forEach((t) => { if (sc[t.id] >= med) { W[t.id]++; mw[t.id + "_" + w] = (mw[t.id + "_" + w] || 0) + 1; } }); }
    }
    const order = [...teams].sort((a, b) => W[b.id] - W[a.id] || PF[b.id] - PF[a.id]);
    order.forEach((t, i) => { const r = res[t.id]; r.wins += W[t.id]; if (i < spots) r.po++; if (i < 4) r.top4++; if (i === 0) r.first++; });
  }
  const perWeek = bonus ? 2 : 1, total = reg * perWeek;
  const detail = Object.fromEntries(teams.map((t) => [t.id, sched.filter((x) => x.home.teamId === t.id || x.away.teamId === t.id)
    .sort((a, b) => a.matchupPeriodId - b.matchupPeriodId).map((x) => { const w = x.matchupPeriodId, k = t.id + "_" + w;
      return { w, opp: x.home.teamId === t.id ? x.away.teamId : x.home.teamId, h: (hw[k] || 0) / N, m: (mw[k] || 0) / N }; })]));
  return { spots, reg, bonus, detail, rows: teams.map((t) => { const r = res[t.id], w = r.wins / N;
    return { t, w, l: total - w, po: r.po / N, top4: r.top4 / N, first: r.first / N }; }).sort((a, b) => b.po - a.po || b.w - a.w) };
}

function normCdf(z) { // 標準常態分布累積機率
  const t = 1 / (1 + 0.2316419 * Math.abs(z)), d = 0.3989423 * Math.exp(-z * z / 2);
  const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
  return z > 0 ? 1 - p : p;
}

const openTeams = new Set(), openDays = new Set();
let CUR = null;
const EXTRA = {}; // 聯盟動態裡、不在任何名單上的球員
const GAMES = {}; // NBA 比賽 id -> 比賽資訊（主客隊、時間）
const TEAM_GAME = {}; // NBA 球隊 id -> { 比賽日: 比賽 }
let ABBR = {}; // 目前這次讀到的資料（給判斷文字用）
let POS_LIM = {}; // 聯盟的位置上限（例如中鋒最多 4 人）：{ 4: 4 }，key 是陣容格子編號（0 PG、1 SG、2 SF、3 PF、4 C）；有這個位置資格的人都算
const lastName = (n) => { const p = n.split(" "); return p.length > 1 ? p.slice(1).join(" ") : n; };

// 每隊的「核心 / 判斷 / 對你」三行重點，依數據自動產生
function teamReport(v, D, views) {
  const ros = D.rosters[v.t.id], o = v.t.record.overall;
  const flag = (x) => { const i = injInfo(x, D), r = i && i.short ? ` ${i.short}` : "";
    return x.lineupSlot === IR ? `(IR ${INJURY[x.injury] || "OUT"}${r})` : x.injury !== "ACTIVE" && x.injury !== "NORMAL" ? `(${INJURY[x.injury] || x.injury}${r})` : ""; };
  const byAvg = [...ros].sort((a, b) => Math.max(b.avg, 0) - Math.max(a.avg, 0));
  let core = ros.filter((x) => verdict(x, v)[0] === "core").sort((a, b) => b.avg - a.avg);
  if (core.length < 2) core = byAvg.slice(0, 3);
  const coreText = core.slice(0, 4).map((x, i) => i < 2
    ? `${lastName(x.name)} ${r0(x.avg)}/${x.last7 == null ? "-" : r0(x.last7)}/${x.lastYear == null ? "-" : r0(x.lastYear)}${flag(x)}`
    : `${lastName(x.name)} ${r0(x.avg)}${flag(x)}`).join("、");

  const healthy = ros.filter((x) => !x.out).sort((a, b) => b.avg - a.avg);
  const stars = healthy.filter((x) => x.avg >= 38);
  const mid = healthy.filter((x) => x.avg < 38).slice(0, Math.max(0, D.seats.length - stars.length));
  const lo = mid.length ? r0(Math.min(...mid.map((x) => x.avg))) : 0, hi = mid.length ? r0(Math.max(...mid.map((x) => x.avg))) : 0;
  const parts = [];
  if (stars.length >= 2) parts.push(`${CN[stars.length] || stars.length + " "}個一線球員（${stars.map((x) => lastName(x.name)).join("、")}），其他主力多在 ${lo} 到 ${hi} 分`);
  else if (stars.length === 1) parts.push(`${lastName(stars[0].name)} 撐起陣容（今年 ${r0(stars[0].avg)}），其他主力多在 ${lo} 到 ${hi} 分${stars[0].avg - hi >= 15 ? "，頭重腳輕" : ""}`);
  else parts.push(`沒有一線球員，主力多在 ${lo} 到 ${hi} 分，靠平均分散`);
  const hurt = ros.filter((x) => x.out && Math.max(x.avg, x.lastYear || 0) >= 30);
  if (hurt.length) parts.push(`${hurt.map((x) => `${lastName(x.name)}（OUT，${x.avg > 0 ? `今年 ${r0(x.avg)}` : `去年 ${r0(x.lastYear)}`}）`).join("、")}傷停中，回來後陣容會更深`);
  const down = healthy.slice(0, 8).filter((x) => x.lastYear != null && x.lastYear - x.avg >= 6).slice(0, 2);
  if (down.length) parts.push(`${down.map((x) => `${lastName(x.name)} 今年 ${r0(x.avg)} 低於去年 ${r0(x.lastYear)}`).join("、")}，要看能不能回升`);
  const hot = healthy.slice(0, 10).filter((x) => x.last7 != null && x.last7 - x.avg >= 8).slice(0, 2);
  if (hot.length) parts.push(`${hot.map((x) => `${lastName(x.name)} 近 7 天 ${r0(x.last7)}`).join("、")}，手感正熱`);
  const rankOf = (key, asc) => [...D.teams].sort((a, b) => asc ? a.record.overall[key] - b.record.overall[key] : b.record.overall[key] - a.record.overall[key]).findIndex((t) => t.id === v.t.id) + 1;
  const winRank = [...D.teams].sort((a, b) => b.record.overall.wins - a.record.overall.wins || b.record.overall.pointsFor - a.record.overall.pointsFor).findIndex((t) => t.id === v.t.id) + 1;
  const pfRank = rankOf("pointsFor"), paRank = rankOf("pointsAgainst", true);
  if (pfRank - winRank >= 3) parts.push(`戰績 ${o.wins}-${o.losses} 但總得分只排第 ${pfRank}，戰績偏好看，較可能往下掉`);
  else if (winRank - pfRank >= 3) parts.push(`總得分排第 ${pfRank}，實力比戰績 ${o.wins}-${o.losses} 好`);
  else if (paRank === 1 && o.wins >= o.losses) parts.push(`失分 ${r0(o.pointsAgainst)} 是全聯盟最低，戰績有賽程運氣成分；總得分排第 ${pfRank}`);
  else parts.push(`總得分排第 ${pfRank}`);
  const m = D.lg.schedule.find((x) => x.matchupPeriodId === D.week && (x.home.teamId === v.t.id || (x.away && x.away.teamId === v.t.id)));
  if (m && m.away) {
    const me = m.home.teamId === v.t.id ? m.home : m.away, op = m.home.teamId === v.t.id ? m.away : m.home;
    const d = (me.totalPointsLive ?? me.totalPoints ?? 0) - (op.totalPointsLive ?? op.totalPoints ?? 0);
    parts.push(`本週${d >= 0 ? "領先" : "落後"} ${r0(Math.abs(d))} 分`);
  }

  let toYou = "";
  if (v.t.id !== D.me.id) {
    const mine = views.find((x) => x.t.id === D.me.id), d = v.power - mine.power, bits = [];
    if (v.t.id === D.opp.id) { const diff = D.myScore - D.oppScore; bits.push(`本週對手，你${diff >= 0 ? "領先" : "落後"} ${r0(Math.abs(diff))} 分`); }
    bits.push(d >= 10 ? `陣容實力 ${r0(v.power)} 比你的 ${r0(mine.power)} 強，是要追的對象`
      : d <= -25 ? `弱隊，陣容實力 ${r0(v.power)} 比你的 ${r0(mine.power)} 低很多，沒有威脅`
      : `實力跟你接近（${r0(v.power)} 對 ${r0(mine.power)}）`);
    const meets = D.lg.schedule.filter((x) => x.matchupPeriodId > D.week && x.away &&
      [x.home.teamId, x.away.teamId].includes(D.me.id) && [x.home.teamId, x.away.teamId].includes(v.t.id)).map((x) => x.matchupPeriodId);
    if (meets.length) {
      bits.push(`第 ${meets[0]} 週${meets[1] ? `與第 ${meets[1]} 週` : ""}會跟你碰面`);
    }
    toYou = bits.join("。") + "。";
  }
  return { core: coreText, judge: parts.join("。") + "。", toYou };
}

    </table></div>

日得分熱力格」（陣容分頁，每位球員每天的得分，點格子看那天）、「勝率走勢」（戰況分頁，本週每天的預估勝率）、「戰報圖」（一鍵存成圖片分享）；Matchup 進行中的球員前面加紅色 LIVE 小點", false], ["聯盟動態改成卡片：一筆一張，撿進來綠色、丟掉紅色，依日期分組，交易用金色框", false], ["動畫：長條和圓環從 0 長出來、換分頁時卡片淡入、按鈕按下縮小、Matchup 換日期左右滑動、分數和勝率數字滾動（更新時增加閃綠、減少閃紅）；「對手主力」長條不動", false], ["球員排行榜改成卡片版（名次、名字、傷況、四個數字），新增「近15天」排序和 G／F 位置篩選，篩選與排序按鈕重新排列", false], ["「本週對決」改成方塊版（誰領先、領先多少一目了然）；Matchup 改成兩欄依得分排名、左右對齊，日期置中、「回到今天」移到右上；本週對戰隊名不能點、長隊名縮寫", false], ["聯盟分頁三張卡合成一張，每隊一張卡片（可排序、點開看整季數據）；「對手撿人丟人習慣」改成卡片；貢獻榜前三名改成發光圈；補強建議排得更密；移除「熱門撿人」和「各隊陣容判斷」；紫金主題的紫色調暗", false], ["介面大改版（一次上線）：頂部「隊名 日報」大卡片改成比分板（領先比例長條、剩餘日子小圓點、對手主力橫條）；「今天要做的事」每項變成帶色邊的小卡、標題旁有要做／留意計數，同一位球員連續幾天的傷兵或替補提醒合併成一條；「應對策略」改成大卡片加勝率圓環和三個數據方塊；「本週貢獻榜」改成頂部大分數加前 3 名佔比圓環、每位球員一張卡，前三名是金銀銅獎牌；「本週對戰」改成比分板加每天一列的雙長條（比之前縮小約三分之一）", false],["「下週預覽」搬到「決策」分頁，改名「下週準備」並重排：最上面是下週預估輸贏，接著是「下週要做」（卡位、人數不足的日子、下週比賽多的自由球員），每天人數與預估的表放最下面；拿掉「位置稀缺度」卡片", false],["配色主題：選單拿掉「奶茶」和「鼠尾草」，「紫銀」改成「湖人紫金」（深紫底、金色重點）；之前存了被拿掉的配色會自動回到暗夜橘", false],["隊伍卡：點全站任何一個隊名（排名、聯盟總表、本週對戰、卡片標題、球員視窗、聯盟動態…）都會打開這隊的隊伍卡：頂部大卡片（戰績、進季後賽機率圓環）、六個數據方塊（陣容實力、近 7 天實力、預估戰績、榜首率、總得分、總失分，附跟全聯盟比的長條）、本週對戰比分板、陣容判斷、撿人習慣、最近動態時間軸，最後是完整陣容（每位球員一條橫條：長度是今年平均、白線是近 7 天、顏色是判斷）；頂部「隊名 日報」標題不連結", false],["聯盟動態的交易補上完整球員明細並加「評價這筆交易」：ESPN 的接受紀錄沒有明細，改成比對交易前後兩天各隊的陣容找出換了誰（之前會漏人，例如 aespa 和村BA 那筆漏了 Jalen Green、桃園台啤那筆顯示沒提供明細）；評價寫各隊陣容實力變化、人數不同、拿到的人有沒有受傷、下週場次差，用現在的陣容回推", false],["修正「本週對戰」打完日子的括號和點進去的明細不一致（例如 11/9 外面 -58、裡面 -6.8）：外面原本把那天沒上場的人也算進預估，預估灌水；現在兩邊都只用那天真的有上場的人排最好的先發，數字一致", false],["修正本週對戰點日期的球員明細：那天打過、後來被丟掉的球員（例如 Jordan Goodwin）原本不列，造成合計跟 ESPN 實際總分對不起來，現在補回來並標「已丟掉」；後來才撿的球員（例如 11/11 還不是你的人的 Meleek Thomas）也不再算進那天。11/11 和 11/12 現在都跟 ESPN 總分一致", false],["傷兵回歸提醒會參考最新新聞：36 小時內的新聞寫 doubtful（大概不打）、確定缺陣，而且預計回歸日是今天或明天，就不再列成紅色「要做」，改成黃色「留意」，寫出新聞內容，避免 ESPN 預計回歸日和新聞不一致時誤導", false],["「今天要做的事」紅色「要做」只先顯示前 3 項，其餘收在「還有 N 項要做」裡，點開才看；傷兵回歸那兩條標題縮短（例如「Trey Murphy III 今天回歸：要先丟一人」），預計回歸日移到下面灰字", false],["介面整理：每張卡片底下的長說明（算法、顏色意思、資料來源）預設收成一行「ⓘ 說明」，點一下才展開，展開過的重畫時保持展開；球員視窗改成名字、傷勢、分析結論、會不會反彈放最上面，進階數據、球隊數據、助攻關係合併成「進階數據與助攻關係」預設收起", false],["交易試算和交易尋找器裡的球員名字可以點，點下去會打開球員卡", false],["「預估準不準」加上隊伍層級的誤差：把每隊當天實際先發的預估加起來，跟實際先發總分比（三種算法並排、平均差幾分、佔幾 %、整體偏高或偏低）；個人那個數字只算有上場的人，隊伍的則連預估會打卻沒上場的人也算進去，更接近實際感受", false],["修正「每週撿人」：原本用天數除以 7，會算出每週超過 7 次（聯盟每週上限 7 次）；改用實際的比賽週數，每個人整季最高 7.0／週", false],["聯盟動態排版：時間分兩行、隊伍欄不再用「…」截掉、交易列隊伍欄只放「交易」標籤、撿丟人名字超過 16 個字母縮寫", false],["交易試算和交易尋找器合併：選你的一位球員，會列出別隊可以換的人（即時評分比他高、對方心目中價值差不多、先檢查中鋒上限），每人一張卡片：即時評分、今年／近 7 天／去年、本週和下週場次、好不好換（容易／中等／較難），按「放進交易試算」就會帶到下面算交易後的陣容實力；也可以自己輸入名字試算", false],["聯盟動態加上交易：最近 3 天完成的交易會列出來，誰給出誰（ESPN 沒提供球員明細的交易只寫誰接受）", false],["球員視窗的單場分析：分數偏低而且犯規 5 次以上（6 次寫畢業），一定會寫「犯規麻煩」，不管上場時間有沒有變少", false],["分析文字改成一件事一行：隊友復出（缺陣場數、有上場場數、助攻關係）和「近 7 天跟本季比」都分行，好讀", false],["輸入密碼時改成跳出數字鍵盤（手機上直接顯示數字鍵）", false],["修正名稱：全站的「近 15 場」其實是 ESPN 的「最近 15 天」（15 天內打的比賽，場數依球隊賽程而定），全部改叫「近 15 天」，算法和分數沒變", false],["撿人風格判斷（「升級」「降級」「平換」）不再把被丟掉、即時評分低於 5 的球員算進去（例如一場沒打就受傷、或選秀選錯的人），避免把丟掉廢人算成「眼光不錯」", false],["球員視窗的分析（「留下觀察」「不用撿」那一塊）把網站上顯示的其他資料也一起看：命中率明顯偏熱或偏冷、EPM 真實水準預估跟今年平均差 3 分以上、近 7 天命中率和出手區域的變化、助攻對象缺陣或出賽成疑、隊友復出（場數、平均、中位數、助攻關係）、之後連兩天的第二場和輪休紀錄；只在有值得說的事時才多一行，不改結論和即時評分的分數；「隊友復出」不再單獨放一個紅色小卡片，改成只放在分析裡那一行", false],["「隊友復出」提醒改得比較不會被單場帶偏：主力缺陣和有上場時，各寫場數、每場 fpts 的平均和中位數（兩個差很多就是被單場高分或低分帶偏，會提醒別太當真），缺陣少於 5 場標「樣本少」，不再只寫一個「之後可能少 X 分」；裡面的助攻關係也改成場均（助攻次數 ÷ 兩人同場場數）", false],["傷兵快回來的提醒：你的傷兵預計 5 天內回歸時，「今天要做的事」會寫出來（Discord 早上提醒和賽後日報的「要做」也會帶上）。在 IR 位置的人：陣容滿了，回來前先決定丟誰（2 天內變「要做」）；還有空位就說可以直接移出 IR；在替補的人：回來後記得換上先發", false],["球員視窗補上別隊球員的現況：點別隊的人（包括這週的對手）會寫即時評分和隊上排名、近 7 天跟今年比、上場時間、本週和下週場次（不寫「該不該留」，因為不是你的人）；今年還沒上場的人，會寫「本季還沒上場，所以沒有進階數據」，不再是一片空白", false],["「預估準不準」加第三種算法「考慮對手」：就是球員卡賽程上的「預估 FPTS」（在新算法上再看對手防守、兩隊節奏、背靠背），三種算法並排比較平均每人猜差幾分、哪個最準、各自高估或低估多少；前幾天的第三種是事後回推的，只能當參考，從今天起是比賽前記錄的", false],["球員視窗新增「助攻關係」：這位球員最常助攻誰（前 3 位）、最常被誰助攻（前 3 位），數字是場均（助攻次數 ÷ 兩人都有上場的比賽數，至少 2 次助攻才列，同場不到 5 場標 *）；名字太長縮寫；對象目前缺陣（OUT）或出賽成疑（DTD）時，名字旁標出來並寫對他的影響；「隊友復出」提醒裡，如果復出的主力是他的助攻對象，會補一行互相助攻幾次。資料來自 pbpstats 助攻網路，每天更新", false],["載入變快：打開網頁時，原本讀資料是一個等一個（後台資料檔、撿人紀錄、新秀資料、傷兵新聞、逐場數據…），現在沒有先後關係的同時讀，實測載入時間從約 7 秒降到約 4.5 秒，畫面和判斷結果不變", false],["「本週對戰」沒比賽的日子不再寫「0 (+0)」：NBA 整天沒比賽寫「— 沒比賽」，有比賽但這隊沒人能上場寫「0 ／ 0 人」", false],["修正：「本週對戰」點已打完的日子看每位球員，之前用「現在」的傷勢狀態回推，今天才生病的人（例如 Paul George 昨天拿 49 分）會被當成不在預估先發、合計少算；現在改成從那天真的有上場的人排預估先發，沒上場的人（例如在 IR 的 Holmgren 0.0 分）也不再列出", false],["背靠背輪休紀錄更即時：今天是背靠背第二場、昨天有上場，今天被列 OUT 但不在 ESPN 傷兵頁（不是因為受傷，例如 Paul George 今天排休），當天就算一次輪休，不用等他下一場上場後才算", false], ["上場時間原因、隊友復出提醒、新秀球員卡修正\n• 應對策略的勝率改得比較好懂：原本「64 →29%」容易看不懂，現在大數字是現在的勝率（64%），下面一行紅字寫「對手撿滿後 29%」（對手把撿人名額用完後你的勝率）\n• 上場時間變少會寫原因：單場分析裡上場時間比平常少時，會寫這場是不是背靠背第二場（疲勞控管）、大比分（差 20 分以上，主力提早下場）或犯規麻煩（5 犯以上）；球員視窗「教練」那一行寫最近被減少上場時間時，也會看少打的那幾場有幾場是這些原因，判斷是暫時的還是角色真的變小\n• 球員視窗新增「隊友復出」提醒：他是靠同隊主力缺陣才打得好（主力不在時 fantasy 分數多 5 分以上），那位主力剛復出或傷況轉好時，寫出他在主力缺陣和有上場時各平均幾分、之後可能少幾分\n• 修正：新秀觀察裡持有率低的新秀（例如 Stirtz、Ament），點開球員視窗只剩比賽表格、沒有名字和判斷，現在會另外補抓他們的資料", false], ["「本週已加人數」修正：每週最後一天第一場開打後，ESPN 就把撿人算到下一週，網頁現在也跟著換到新的一週算（週一早上 ESPN 還沒換週時，不會再顯示上週的次數）", false], ["中鋒上限套用到全站：自由球員的判斷、聯盟動態的「可以搶」、潛力股的「值得撿」、Discord 的 waiver 提醒和有人丟好球員通知，都改成「撿他要換掉誰」一起算；你的中鋒已經 4 個時，撿中鋒只會跟陣容裡可以換掉的中鋒比", false], ["修正：今天剛被丟到 waiver 的人（例如 Gafford、Hartenstein），ESPN 還會留在原隊名單裡，之前被誤算成還在那隊；現在他們算可以撿的 waiver 球員，原隊的陣容和中鋒人數也不再算他們", false], ["換人推薦會照聯盟的位置上限：陣容裡有中鋒（C）資格的人最多 4 個（像 Diabate 主要是 PF 但有 C 資格也算），已經有 4 個時，只會建議用有 C 資格的人換有 C 資格的人（補強建議、本週先撿、下週卡位、陣容評估都適用）；另外修正：ESPN 偶爾把剛被別隊撿走的人也列成自由球員（例如 Gafford、Hartenstein），現在已經在陣容裡的人不會再被推薦", false], ["排行榜拿掉「真實水準」欄位，只留即時評分、今年、近 7 天、持有率", false], ["「炭灰螢光」主題換成「夜忍」：忍者風格，黑紫底、血紅重點色，上方大卡片是深紫到暗紅的漸層", false], ["「皇家藍」「深海青」跟其他主題太像，換成莫蘭迪色系的「奶茶」（暖灰底、燕麥奶茶色）和「鼠尾草」（灰綠底、鼠尾草綠）", false], ["主題調整：「夜間球館」改名「暗夜橘」；「白天球館」換成「aespa」（黑底、銀色、極光紫漸層）；「皇家藍」「深海青」改成比較低調的霧藍、玉綠，質感更好", false], ["金色主題太多，「黑金」換成「炭灰螢光」（炭灰底、螢光黃綠）、「紫金」換成「紫銀」（深紫底、銀紫色），選過這兩個的人會直接換成新配色", false], ["「薄荷白」主題換成「皇馬」：照皇家馬德里 2026-27 主場球衣配色，墨綠深色底（不刺眼）、粉紅重點色", false], ["主題調整：「鮮紅黑」跟「酒紅金」太像，換成新的「皇家藍」（深藍底、皇家藍重點色）；「暗夜霓虹」改成「紫金」（深紫底、金色重點色）", false], ["補強建議和潛力股的滑動卡片，點球員名字可以打開球員卡了（iPhone 上點一下常被當成滑動）", false], ["即時評分、pbpstats 後台資料、文字排版\n• 球員視窗新增「近 7 天」區塊（資料來自 pbpstats）：每 36 分鐘得分、球權、命中率、出手區域跟本季比，加上被助攻比例、失誤、犯規、在場淨效率，以及在不在球隊最常用的五人陣容\n• 判斷改用後台最新的 pbpstats 資料：「綜合評分」改名「即時評分」，並加上隊友缺陣、陣容變動、近 7 天球權的調整（陣容評估、補強建議、該換誰、撿人排程都用它），判斷裡會寫基本評分幾分、調整多少；單場分數的說明會寫這場球權比平常多或少；陣容評估、自由球員判斷會寫近 7 天球權變多或變少、有沒有打進球隊最常用的五人陣容、隊友缺陣時他多拿多少；潛力股多了「主力不在場時真的多拿分」和「打進主要陣容」的人；每天的對戰預估改用近 7 天和整季混合的比賽節奏；網頁開著時每 30 分鐘重新讀一次後台資料\n• 整理所有分頁、卡片和球員視窗的文字排版：球員名字、日期、括號裡的數字不再從中間斷行；各隊陣容判斷、本週貢獻榜改成一句一行；下週該先卡位改成「撿／丟／下週幾場」分行；球員比較的結論只寫「可以換掉」「不用撿」這類短結論", false, 200], ["「球員」分頁新增「新秀觀察」：列出今年所有新秀的近 5 場、上場時間、近 10 場走勢和在誰手上，上面直接寫哪些自由球員新秀可以撿", false], ["「預估比對」改成白話的「預估準不準」：兩個大數字寫原本的算法和新算法（加 EPM）平均每人猜差幾分，下面直接寫哪個比較準、猜得偏高還是偏低、差 12 分上下算不算正常、資料夠不夠下結論，不再用看不懂的表格", false], ["傷兵快報每位球員最下面多一行小字，寫 ESPN 這則傷兵消息的更新時間（台北時間，例如「11/8 02:17 更新」）", false], ["傷兵快報排版：第一行是狀態、名字、回歸日；第二行小字是所屬隊伍、傷勢部位、球隊位置（固定一行）；中文說明移到下面，用滿整個寬度，不再被擠在名字和回歸日中間", false], ["修正：網頁開久了之後，左右滑一下會連跳好幾個分頁、直接跳到更新紀錄（每次自動更新資料都多加了一次滑動判斷），現在滑一次只換一個分頁", false], ["修正：陣容、球員分頁大部分是可以左右捲的表格，在上面滑動切不了分頁。現在表格捲到底之後再滑一次就會切換分頁（往左滑時表格在最右邊、往右滑時表格在最左邊）", false], ["「應對策略」的數字固定四格：預估分差、勝率、對手撿滿、你撿滿；名額用完的寫「用完」，有被反超風險時勝率寫成「現在→對手撿滿後」", false], ["「應對策略」加入「前 5 名」那 1 勝（本週總分排聯盟前 5 名多拿 1 勝，也就是中位數規則）：用本週得分排名同一套預估，看你這週會不會在聯盟前一半；不在的話，算剩下的撿人名額用掉能不能擠進去、差幾分。對戰落後時的建議會跟著改：在前一半就提醒守住，撿滿追得上就叫你用名額拿這 1 勝，兩邊都拿不到就不用硬撿", false], ["對手撿滿預警、應對策略和今天要做的事改版、排版整理\n• 主畫面最上面的「領先／落後幾分」加上顏色：領先是綠色字、落後是紅色字，一眼看出現在贏還是輸\n• 新增「對手撿滿」預警：算對手把這週剩下的撿人名額全部用掉、撿場次多的自由球員，最多能追幾分（只算丟掉他陣容裡陣容評估說可以換掉、而且 ESPN 持有率低於 60% 的人，和這週撿來試用的人，不會算丟掉主力或熱門球員這種不合理的操作）。「應對策略」會寫出他撿滿最多追幾分、你的勝率會掉到多少、你撿滿能不能抵消；你落後時也會算你撿滿有沒有機會反超；有被反超風險時，主畫面最上面卡片會多一行紅字提醒\n• 「應對策略」整理：版面改成狀態（領先／拉鋸／落後／小心被反超）、一排數字（預估分差、勝率、對手撿滿、你撿滿）、一句建議、場次和對手各一行；結論（領先／拉鋸／落後／小心被反超）和該怎麼做，名額建議跟你和對手剩下的名額、對手撿滿能追幾分一致，不再出現「名額留到週末」但名額其實已經用完這種矛盾；場次只在差 3 人次以上才提；對手習慣濃縮成一行\n• 「今天要做的事」排版：好幾個球員不再用頓號串成一行，改成一人一行；撿人丟人寫成「撿 誰，丟 誰」；球員名字、日期（例如週六 11/7）、分數不會從中間斷成兩行；下面的說明有好幾句時改成條列（例如撿人排程每一步一行）\n• 球員名字裡的「Jr.」「Sr.」拿掉句點（例如 Wendell Carter Jr），全站一致\n• 補強建議「本週先撿」每一步改成三行：日期／撿誰 丟誰（同一行，中間空格隔開）／本週多拿幾分\n• 「今天要做的事」的撿人排程改成跟補強建議「本週先撿」一樣的排法：每一步三行（日期／撿誰 丟誰／本週多拿幾分），上面一行小字寫總共預估多拿幾分、還可以加幾人", false], ["手機自動更新到最新版：打開網頁或從背景切回來時，會檢查網站有沒有新版本，有就自動重新載入（加到主畫面的也會），不用再手動清快取", false], ["電腦版卡片攤開、Matchup 隊名不換行\n• 電腦版（寬螢幕）的補強建議和其他潛力股不疊卡片，直接全部攤開排成格狀；手機才是左右滑動的堆疊\n• Matchup 表頭的兩隊隊名固定一行（字稍微縮小，真的太長才用「…」截短），不再換行", false], ["首頁卡片排版、補強建議改成滑動卡片\n• 主畫面最上面卡片排版：兩隊分數置中對齊；分數上面的聯盟資訊分成兩行（聯盟・計分方式／第幾週・戰績），不再從中間斷行；「對手習慣」改成跟「對手主力」一樣的左右排法，類型、整季撿幾人、本週用了幾次各一行\n• 補強建議的球員卡片改成堆疊：像交友軟體一樣一次看一張，往左滑看下一位、往右滑回上一位（看完會從頭循環），下面也有 ‹ › 按鈕和「第幾張 / 共幾張」；在卡片上左右滑不會切換分頁，點名字、⚖ 比較照常可以用\n• 補強建議下方的「其他潛力股」也改成堆疊卡片（跟上面推薦球員一樣左右滑動）：每張有位置、球隊、持有率、⚖ 比較，標籤（上升中／隊友缺陣、值得撿、FA／Waiver），數字（最近 5 場或隊友缺陣時、之前、今年、近 7 天）和原因條列", false], ["對手習慣改名、本週得分排名排版\n• 對手撿人丟人習慣的類型改成兩個字：試用派 → 試車、升級派 → 升級、亂換派 → 降級、穩定派 → 平換、很少動 → 佛系（說明欄、應對策略、本週對決一起改）\n• 本週得分排名：隊伍名字固定一行，太長用「…」截短，每列一樣高", false], ["補強建議整合潛力發掘、手機排版整理、近 7 天改名\n• 修正：手機上卡片標題被副標題擠到換行（潛力發掘、補強建議、本週貢獻榜、球員比較、聯盟動態等）：標題固定不換行，副標題在右邊剩下的空間裡換行；「潛力發掘」副標題縮短成「隊友缺陣・上升中」\n• 「近 7 場」改名為「近 7 天」：ESPN 這個數字其實是最近 7 天的平均（通常 2 到 4 場），名稱改成跟資料一致（陣容評估、自由球員、補強建議、球員比較、聯盟總表、說明文字等）；「最近 N 場」（單場分析、上升中）是真的照場數算，維持不變\n• 「潛力發掘」整合進「補強建議」：推薦卡片上如果該球員最近真的變強，會多「上升中」或「隊友缺陣」標籤和原因；不在推薦名單裡的潛力股列在卡片下方「其他潛力股」，「你的陣容也有人上升中」也移到這裡；「決策」分頁少一張卡片\n• 手機版排版整理：陣容評估和自由球員表格每列高度變一致（判斷欄加寬，不再有特別高的列）；傷兵快報最後的「球隊 位置」不會被拆成兩行；各隊陣容判斷的「展開陣容」固定在隊名同一行；球員比較副標題縮短成一行\n• 主畫面的「對手主力」改成每人一行：名字、今年平均、剩幾場對齊排好，點名字可以看詳細\n• 各卡片下方的說明欄（橘色底的小字）改成一句一行的條列，不再是一大段文字\n• 排行榜手機排版：球員名字和下面的小字（球隊、位置、所屬隊伍）都固定一行，太長用「…」截短，每列一樣高；排行榜下方的說明也改成條列\n• 修正：排行榜的傷病標示改看 ESPN 傷兵頁，只是放在傷兵名單（IR）位置、其實已經能打的人不再標 OUT（改標 IR）\n• 排行榜裡名字太長（超過 16 個字母）的球員，名改成縮寫（例如 Giannis Antetokounmpo → G.Antetokounmpo），點名字仍可看完整資料", false], ["補強建議排版整理：上面「本週先撿」「長期換人」改成兩個並排的小方塊、條列寫；下面每位球員改成跟潛力發掘一樣的卡片：名字和 ⚖ 比較在最上面，下一行是推薦名次、綜合 +幾分、頂替誰，數字（今年、近 7 場、去年、本週和下週場次）排成一排，原因改成條列", false], ["潛力發掘改版並整合「上升中」：同一張卡片列出兩種最近真的變強的自由球員——①隊友缺陣：用逐場紀錄比「主力缺陣」和「主力有上」兩組，缺陣時上場時間和分數都明顯比較高，而且有改打先發、球權或助攻增加的佐證；②上升中：最近 5 場明顯比之前好、統計上不太像隨機起伏，而且原因會持續（上場時間、先發、球權、籃板助攻抄截阻攻變多）。每人標出是哪一種（可能兩種都有）、分數、原因和值不值得撿；你的陣容如果有人上升中，下面會另外提醒先別急著丟", false], ["「決策」分頁新增「潛力發掘」（在補強建議下面）：找出近 7 場上場時間比今年多 3 分鐘以上、而且 NBA 球隊有主力缺陣的自由球員，列出持有率、分鐘和分數（近 7 場 / 今年）、缺陣的是誰和預計何時回來，再用一句話建議值不值得撿；主力回來後角色可能縮回去", false], ["球員視窗的名字旁邊多顯示位置（例如「OKC · PG/SG · Podcast P」），可以打的位置都會列出來", false], ["背靠背第二場的「第二場 ±%」：去年和今年有上場的背靠背第二場少於 10 場的人不顯示（樣本太少，數字幾乎只是聯盟平均）；預估 FPTS 對這些人不調整（聯盟平均 +2.6% 多半是狀況不好的人被輪休造成的偏差）", false], ["球員視窗未來賽程的「預估 FPTS」套用背靠背第二場的變化：連兩天的第二場會再乘上他自己背靠背第二場的預估變化（例如 SGA −5.6%），紀錄不到 10 場的人不調整", false], ["背靠背第二場預估變化：用去年整季和今年的 NBA 比賽紀錄（3500 多場背靠背第二場），算每位球員背靠背第二場有上場時，分數比平常多或少幾 %；場次少的人會往聯盟平均（+2.6%）靠。顯示在「連兩天比賽」名單和球員視窗的賽程（「第二場 −5%」，下滑 5% 以上紅色、上升 5% 以上綠色），每週自動更新", false], ["背靠背第二場輪休紀錄：球隊連兩天比賽、他第一天有上、第二天沒上、之後又有上場，就算一次輪休（之後也沒上場的算傷缺，不算輪休）。「本週對戰」的「連兩天比賽」名單和球員視窗的未來賽程，會標出「輪休過 1/2」，一半以上標紅色「常輪休」；只看最近 16 天的紀錄，球季越後面越準", false], ["「各隊陣容判斷」卡片可以整張收起：點標題收合或展開（預設展開，會記住你的選擇）", false], ["「聯盟」分頁新增「各隊計分數據總數」（在聯盟總表下面）：10 隊整季有被計分的數據累計——得分、進攻籃板、籃板、助攻、抄截、阻攻、失誤、犯規、投進／出手、罰進／罰球、三分進／出手、勝場、四雙和總分；每一項聯盟最好的標綠色、最差的標紅色（失誤、出手這類扣分項目，最少的綠色、最多的紅色），點標題由多到少排序", false], ["「聯盟」分頁拿掉「每週得分走勢」卡片（目前週數太少看不出趨勢，也跟本週得分排名、聯盟總表重複）", false], ["球員視窗分數原因：對手球隊從上面的清單移到「結論」最後一條，用一句話寫防守強弱和聯盟排名（例如「對手 NO 防守中等（聯盟第 16）」），跟原因相關的那一項讓對手拿得比聯盟多或少 8% 以上也會接在後面", false], ["補強建議每張卡片的白字改用「分析與結論」同一套邏輯：不再只比去年和近 7 場，改成講最近幾場的分數和原因——手感熱會提醒可能回落、上場時間變長說明比較能持續、手感冷說明通常會回來、上場時間掉了提醒要小心，都有數字根據；讀不到逐場數據時才用原本的說法", false], ["陣容評估改用「原因」判斷（跟球員視窗浮現的單場分析與結論同一套門檻）：近 7 場分數偏低時，先看原因——如果是投籃手感冷（真實命中率比他今年低 6 個百分點以上）就標「留下觀察：這種通常會回來」，不再叫你換掉；如果是上場時間掉了或某一項變少，「可以換掉」的說明會寫出原因。建議換上的自由球員如果最近手感特別熱，也會提醒可能回落。補強建議、撿人排程、下週該先卡位都跟著陣容評估，所以判斷一致", false], ["球員視窗和球員比較裡「單場分數」改成整數，不顯示小數點（「最近 29(+0.8)」「分數」欄、浮現的原因、點長條的說明）；跟平均的差仍保留一位小數", false], ["球員視窗「最近 10 場」表格：游標指到（手機點一下）分數，會浮現這一場分數高或低的原因——把當場分數拆成得分與投籃、籃板、助攻、抄截、阻攻、失誤、犯規、球隊勝負，跟他近 10 場平均比，列出差最多的三項（投籃幾中幾、各項幾次），也會提示上場時間比平常少或多、對手防守強弱，右上角在這場爆發（比今年平均高很多）時出現火焰圖示、冰冷（低很多）時出現雪花圖示，最後用白話寫出結論（為什麼這場分數偏低、或偏高／爆發）", false], ["點開球員視窗，最上面（賽程下面）多一張「分數變化」圖卡：最近 10 場每場 fantasy 分數的迷你長條圖：綠色長條高於他今年平均、紅色低於，右邊寫最近一場的分數和跟平均的差（例如「最近 29.0(+0.8)」），點長條看那一場的對手、分數、上場分鐘", false], ["「決策」分頁新增「位置稀缺度」卡片（在補強建議下面）：PG、SG、SF、PF、C 五個位置，各自顯示自由市場還有幾人可補（今年平均 15 分以上）、平均最高的前 3 位，並指出目前最難補的位置", false], ["球員視窗裡按「加入比較」後，視窗會自動關起來", false], ["「排行榜」不再佔分頁：改成主畫面最上面卡片右上角的小圖示（直條圖），點一下排行榜會蓋在畫面上展開（不佔分頁位置），右上角的 X 關閉回到原本的畫面；分頁變成 6 個加更新紀錄", false], ["新增「消息」分頁（在「球員」後面）：把「聯盟動態」（誰撿人丟人）、「熱門撿人」、「對手撿人丟人習慣」三張消息類的卡片集中在這裡（原本分散在「球員」和「決策」分頁）；卡片可以點標題收合，預設只展開「聯盟動態」", false], ["新增「傷兵快報」卡片（「消息」分頁最上面）：列出你的傷兵、各隊核心球員（平均前 60 名）、值得注意的自由球員（持有率 10% 以上或平均 20 分以上）的傷病狀態、預計回歸日（沒有就用新聞推估）   // 版面：狀態標籤 → 一排數字 → 一句建議 → 左右對齊的補充（場次、對手）；所有建議看同一組數字，不會前後矛盾
  const H = D.habits, ho = H && H[D.opp.id], hm = H && H[D.me.id];
  const wp = A.winProb, restDays = D.weekPeriods.filter((p) => p >= D.period);
  const gap = A.final, C = A.chase, pc = (v) => `${Math.round(v * 100)}%`;
  const cnt = (ros, p) => ros.filter((x) => x.lineupSlot !== IR && x.games.has(p) && !x.out).length;
  const myG = restDays.reduce((s, p) => s + cnt(D.myRoster, p), 0), opG = restDays.reduce((s, p) => s + cnt(D.oppRoster, p), 0);
  const myLeft = C ? C.meLeft : hm && hm.limit ? Math.max(0, hm.limit - hm.used) : null;
  const oppLeft = C ? C.oppLeft : ho && ho.limit ? Math.max(0, ho.limit - ho.used) : null;
  const om = C && oppLeft ? C.opp.total : 0, mm = C && myLeft ? C.me.total : 0;
  const risk = gap > 0 && om >= 3 && gap - om <= 0;
  // 中位數那一勝：用跟「本週得分排名」同一套預估最終得分，看你是否在前一半；不在的話，撿滿能不能擠進去
  let med = null;
  if (A.odds && A.odds.bonus && restDays.length) {
    const rest = (ros) => D.remaining.reduce((s2, p) => s2 + bestLineup(ros.filter((x) => x.games.has(p) && !x.out), D.seats).reduce((t, x) => t + x.proj, 0), 0);
    const fin = (t) => (D.weekScores[t.id] || 0) + rest(D.rosters[t.id]);
    const mine = fin(D.me), others = D.teams.filter((t) => t.id !== D.me.id).map((t) => ({ t, v: fin(t) })).sort((a, b) => b.v - a.v);
    const half = Math.floor(D.teams.length / 2), cut = others[half - 1];
    med = { half, cut, m: mine - cut.v, rank: others.filter((o) => o.v > mine).length + 1 };
    med.can = med.m <= 0 && mm >= 3 && med.m + mm > 0; // 撿滿可以擠進前一半
  }
  let tag, act; // act：一句話、控制在一行內
  const h = med ? med.half : 5;
  if (risk) {
    tag = ["down", "小心被反超"];
    act = !myLeft ? "沒名額了，每天先發排滿。" : gap + mm - om > 0 ? `用掉 ${myLeft} 次名額就能抵消。` : "名額全用掉也未必夠，先發要排滿。";
  } else if (wp >= 0.7) {
    tag = ["up", "領先"];
    act = myLeft ? "名額先留著，有升級再撿。" : "每天先發排滿就好。";
  } else if (wp >= 0.3) {
    tag = ["", "拉鋸"];
    act = myLeft ? (med && med.can ? `${myLeft} 次名額用掉，還能進前 ${h} 名。` : `${myLeft} 次名額全部用掉。`) : "每天先發排最好的人。";
  } else {
    tag = ["down", "落後"];
    act = mm >= 3 && gap + mm - om > 0 ? `${myLeft} 次名額快用掉，有機會反超。`
      : med && med.m > 0 ? `對戰難贏，守住前 ${h} 名。`
      : med && med.can ? `對戰難贏，用名額拼前 ${h} 名。`
      : !myLeft ? "沒名額了，只能靠先發。"
      : med ? "這週兩勝都難拿，不必硬撿。" : "名額快用掉，能追多少算多少。";
  }
  // 固定四格：預估分差、勝率（有被反超風險時，數字下面多一行紅字「撿滿後 X%」）、對手撿滿、你撿滿（名額用完寫「用完」）
  const pick = (left, v) => (!C ? "—" : !left ? "用完" : `+${r0(v)}`);
  const nums = [[`<b class="${gap >= 0 ? "up" : "down"}">${gap >= 0 ? "+" : "−"}${r0(Math.abs(gap))}</b>`, "預估分差"],
    [risk ? `<b>${pc(wp)}</b><i class="stg-after down">對手撿滿後 ${pc(C.wp)}</i>` : `<b>${pc(wp)}</b>`, "勝率"],
    [`<b>${pick(oppLeft, om)}</b>`, "對手撿滿"], [`<b>${pick(myLeft, mm)}</b>`, "你撿滿"]];
  const rows = [];
  if (restDays.length && Math.abs(myG - opG) >= 3) rows.push(["場次", `剩 ${restDays.length} 天，你 ${myG}、對手 ${opG} 人次${myG > opG ? "（對你有利）" : "（對手有利）"}`]);
  if (ho) {
    const bits = [ho.adds < 4 ? "很少換人" : `<span class="rec2" role="button" tabindex="0" data-hab="${D.opp.id}">${ho.style}</span>型`];
    if (ho.limit) bits.push(oppLeft === 0 ? `名額用完（${ho.used}/${ho.limit}）` : `本週已撿 ${ho.used}/${ho.limit}`);
    if (ho.peak && ho.adds >= 5 && oppLeft !== 0) bits.push(`常在週${ho.peak}動作`);
    rows.push(["對手", bits.join(" · ")]);
  }
  if (med) rows.push([`前${med.half}名`, med.m > 0
      ? `預估第 ${med.rank} 名，比第 ${med.half + 1} 名多 ${r0(med.m)} 分${med.m < 40 ? "<br><span class=\"sub\">差距不大，先發要排滿</span>" : ""}`
      : `預估第 ${med.rank} 名，差第 ${med.half} 名 ${r0(-med.m)} 分${med.can ? `<br><span class="sub">撿滿 +${r0(mm)} 追得上</span>` : myLeft ? `<br><span class="sub">撿滿 +${r0(mm)} 也不夠</span>` : ""}`]);
  const tone = tag[0] === "up" ? "up" : tag[0] === "down" ? "down" : "mid";
  const ringP = Math.round(wp * 100);
  const hero = `<div class="stghero ${tone}"><div class="stgl"><div class="stg-tag ${tag[0]}">${tag[1]}</div><p class="stg-act">${act}</p></div>
      <div class="tmring stgring ${tone}" style="--p:${ringP}"><div><b>${pc(wp)}</b><small>本週勝率</small></div></div></div>
    ${risk ? `<div class="stgalert">⚠ 對手把名額撿滿後，勝率會掉到 <b>${pc(C.wp)}</b></div>` : ""}`;
  const tile = (lab, val, sub, c) => `<div class="tmtile"><small>${lab}</small><b class="${c || ""}">${val}</b><span class="sub">${sub || "&nbsp;"}</span></div>`;
  const tiles = `<div class="tmtiles stgtiles3">${tile("預估分差", `${gap >= 0 ? "+" : "−"}${r0(Math.abs(gap))}`, gap >= 0 ? "你領先" : "你落後", gap >= 0 ? "up" : "down")}${tile("對手撿滿", pick(oppLeft, om), oppLeft ? `還有 ${oppLeft} 次名額` : "名額用完")}${tile("你撿滿", pick(myLeft, mm), myLeft ? `還有 ${myLeft} 次名額` : "名額用完", myLeft && mm >= 3 ? "up" : "")}</div>`;
  const rowsHtml = rows.length ? `<div class="stgrows">${rows.map(([k, v]) => `<div class="stgr"><span class="stgk">${k}</span><span class="stgv">${v}</span></div>`).join("")}</div>` : "";
  return `<section class="card${nw("strategy")}">
    <h2>應對策略 <small>根據對手習慣、場次和勝率</small></h2>
    ${hero}${tiles}${rowsHtml}
    <p class="note">${med ? `本週總分排聯盟前 ${med.half} 名可以多拿 1 勝（ESPN 的中位數規則）。` : ""}對手撿滿＝他把剩下的撿人名額都拿去撿場次多的自由球員，只算丟掉陣容評估說可以換掉、持有率低於 60% 的人。依資料推估，參考就好。</p>
  </section>`;
}
// 已打完的日子的預估（外面「本週對戰」的括號和點進去的明細要一致，所以都用這個）：
// 只用那天真的有上場的人（含後來被丟掉的），每人用現在查得到的預估（查不到就用當時記下的預估），依位置排出最好的先發
function pastProj(D, id, p) {
  const hit = findPlayer(id); if (hit && hit.x && hit.x.proj != null) return hit.x.proj;
  const lg = PREDLOG && PREDLOG.rows ? PREDLOG.rows.find((r) => r[0] === p && r[1] === id) : null;
  return lg ? lg[3] : 0;
}
function pastPredSum(D, ti, p) {
  const t = ti ? D.opp : D.me, ents = ((D.weekBox || {})[t.id] || {})[p]; if (!ents) return null;
  // 跟點進去的明細一樣：ESPN 陣容排在先發（不是板凳也不是 IR）、當天有比賽但 OUT 沒上場的人也算進預估（實際 0）
  const ros = ti ? D.oppRoster : D.myRoster; // 只算現在還在名單上的人（明細也是這樣）
  const forced = new Set(ents.filter((e) => e.pts === 0 && e.slot !== IR && e.slot !== BENCH && ros.some((x) => x.id === e.id && x.games.has(p))).map((e) => e.id));
  const pl = ents.filter((e) => e.pts !== 0 || forced.has(e.id)).map((e) => ({ id: e.id, slots: e.elig || [], proj: pastProj(D, e.id, p) }));
  const pick = new Set(bestLineup(pl, D.seats).map((x) => x.id)); forced.forEach((id) => pick.add(id));
  return pl.filter((x) => pick.has(x.id)).reduce((a, x) => a + x.proj, 0);
}
function weekBattle(D, A) {
  const teams = [[D.me, D.myRoster, D.myByDay, D.myScore + A.myRest], [D.opp, D.oppRoster, D.oppByDay, D.oppScore + A.oppRest]];
  const days = D.weekPeriods;
  const wd = (p) => WEEKDAYS[weekdayIdx(addDays(D.base, p))];
  const md = (p) => { const d = addDays(D.base, p); return `${d.getUTCMonth() + 1}/${d.getUTCDate()}`; };
  const count = (ros, p) => ros.filter((x) => x.lineupSlot !== IR && x.games.has(p)).length;
  const pred = (ros, p) => bestLineup(ros.filter((x) => x.games.has(p) && !x.out), D.seats).reduce((s, x) => s + x.proj, 0);
  const noGame = (p) => !D.gameDays.has(p);
  const val = (i, p) => (p >= D.period ? pred(teams[i][1], p) : (teams[i][2] || {})[p] || 0);
  const mx = Math.max(1, ...days.flatMap((p) => [0, 1].map((i) => (noGame(p) ? 0 : val(i, p)))));
  const fin = teams.map((x) => x[3]), nowS = [D.myScore, D.oppScore], tot = Math.max(fin[0] + fin[1], 1);
  const shortTeam = (n) => { if (n.length <= 16) return n; const w = n.split(" "); return w.length > 2 ? w.map((x, i) => (i === 0 || i === w.length - 1 ? x : x[0] + ".")).join(" ") : n; }; // 隊名太長：中間的字縮成首字母（17*3PTS's Pointed Team → 17*3PTS's P. Team）
  const board = `<div class="wbhead"><span class="wbt"><i class="lgd me"></i><span class="nolink">${esc(shortTeam(D.me.name))}</span></span><div class="wbsc"><b class="${fin[0] > fin[1] ? "up" : ""}">${r0(fin[0])}</b><span class="sub">:</span><b class="${fin[1] > fin[0] ? "up" : ""}">${r0(fin[1])}</b></div><span class="wbt r"><span class="nolink">${esc(shortTeam(D.opp.name))}</span><i class="lgd op"></i></span></div>
    <i class="tmsplit"><u style="width:${Math.round((fin[0] / tot) * 100)}%"></u></i>
    <div class="sub wbsum">預估最終${fin[0] >= fin[1] ? "領先" : "落後"} ${r0(Math.abs(fin[0] - fin[1]))}・目前 ${r0(nowS[0])} : ${r0(nowS[1])}（${nowS[0] >= nowS[1] ? "領先" : "落後"} ${r0(Math.abs(nowS[0] - nowS[1]))}）・淡色是預估</div>`;
  const dayRow = (p) => {
    const past = p < D.period, today = p === D.period;
    if (noGame(p)) return `<div class="wbd off"><span class="wbl">${wd(p).slice(1)}<small>${md(p)}</small></span><span class="sub">NBA 沒有比賽</span></div>`;
    const vals = [0, 1].map((i) => { const v = val(i, p), c = count(teams[i][1], p);
      let extra;
      if (past) { const pp = pastPredSum(D, i, p), d = v - (pp != null ? pp : pred(teams[i][1], p)); extra = `<small class="dif ${d >= 0.05 ? "up" : d <= -0.05 ? "down" : "sub"}" role="button" tabindex="0" data-t="${i}" data-p="${p}">${Math.round(d) >= 0 ? "+" : ""}${r0(d)}</small>`; }
      else extra = `<small class="dif fut sub" role="button" tabindex="0" data-t="${i}" data-p="${p}">${c}人</small>`;
      return { v, extra }; });
    const bar = (i) => `<i class="${i ? "op" : "me"}${past ? "" : " fut"}"><u style="width:${Math.max(3, Math.round((vals[i].v / mx) * 100))}%"></u></i>`;
    return `<div class="wbd${today ? " today" : ""}"><span class="wbl">${wd(p).slice(1)}<small>${md(p)}</small></span><div class="wbbars">${bar(0)}${bar(1)}</div>${[0, 1].map((i) => `<span class="wbv ${i ? "op" : "me"}"><b>${r0(vals[i].v)}</b>${vals[i].extra}</span>`).join("")}</div>`;
  };
  return `<section class="card${nw("wkb")}">
    <h2>本週對戰 <small>${esc(D.me.name)} vs ${esc(D.opp.name)}</small></h2>
    ${board}
    <div class="wbdays">${days.map(dayRow).join("")}</div>
    <p class="note">打完的日子是實際得分，旁邊是比預估多或少；還沒打的日子是預估分，旁邊是能上場的人數。點括號或人數看那天每位球員。預估方式跟整個網頁一樣：每人用「今年平均和近 15 天各半」，依位置排出當天最好的 ${D.seats.length} 人先發，OUT 的人不算。已打完日子的預估只用那天真的有上場的人（含後來被丟掉的）排最好的先發，不是當天事前的預估。最上面的大字是「預估最終」= 目前得分＋剩下日子的預估。</p>
  ${b2bLine(D)}
  </section>`;
}

// 點「本週對戰」的括號：那天每位球員實際和預估差多少
async function openDay(ti, p) {
  const D = CUR; if (!D) return;
  if (p === D.period && document.getElementById("todayCard")) { document.getElementById("todayCard").scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if (p > D.period) return openFuture(ti, p);
  const t = ti ? D.opp : D.me, ros = ti ? D.oppRoster : D.myRoster;
  const m = $("#modal"), box = $("#modal .box");
  m.hidden = false; document.body.style.overflow = "hidden";
  const d = addDays(D.base, p), lab = `${WEEKDAYS[weekdayIdx(d)]} ${d.getUTCMonth() + 1}/${d.getUTCDate()}`;
  const playing = ros.filter((x) => x.games.has(p));
  let lineup = new Set(bestLineup(playing.filter((x) => !x.out), D.seats).map((x) => x.id));
  const head = `<h3>${esc(t.name)} <span class="sub">${lab}</span></h3>`;
  box.innerHTML = head + '<p class="sub">讀取中…</p>';
  const fp = {}, played = new Set();
  const take = (pl) => { const st = (pl.stats || []).find((s) => s.statSplitTypeId === 5 && s.statSourceId === 0 && s.seasonId === SEASON && s.scoringPeriodId === p);
    if (st) { fp[pl.id] = st.appliedTotal || 0; if (Number(st.stats && st.stats["40"]) > 0) played.add(pl.id); } };
  const one = (id) => get(`${LEAGUE}?view=kona_playercard`, { players: { filterIds: { value: [id] }, filterStatsForTopScoringPeriodIds: { value: 16, additionalValue: ["00" + SEASON] } } });
  try {
    const r = await get(`${LEAGUE}?view=kona_playercard`, { players: { filterIds: { value: playing.map((x) => x.id) }, filterStatsForTopScoringPeriodIds: { value: 16, additionalValue: ["00" + SEASON] } } });
    (r.players || []).forEach((x) => take(x.player));
  } catch (e) {
    await Promise.all(playing.map((x) => one(x.id).then((r) => (r.players || []).forEach((y) => take(y.player))).catch(() => {})));
  }
  // 已經打完的日子：用「那天真的有上場的人」排預估先發。不能用現在的傷勢狀態（例如他今天才生病變成 OUT，昨天明明打了 49 分），
  // 也不列那天沒上場的人（之後才進傷兵名單的 IR 球員會變成 0 分的一列）
  const past = p < D.period && played.size > 0;
  const forced = new Set();
  let shown = past ? playing.filter((x) => played.has(x.id)) : playing;
  // 那天打過、但後來被丟掉（或交易走）的球員不在現在的名單上，要補回來，不然實際總分對不起來：
  // 用 ESPN 當天的陣容紀錄找出他們和實際分數；預估用當時記下的預估（預估比對紀錄），沒有就用現在查得到的預估
  if (past) {
    try {
      const bx = await get(`${LEAGUE}?${qs({ view: ["mBoxscore", "mMatchupScore"], scoringPeriodId: p })}`);
      let side = null;
      for (const mm of bx.schedule) for (const sd of [mm.home, mm.away]) if (sd && sd.teamId === t.id && sd.rosterForCurrentScoringPeriod) side = sd;
      // 反過來也要處理：現在在名單上、但那天還不是你的人（後來才撿的，例如 11/11 還沒撿的 Meleek Thomas），不能算進那天
      if (side) { const onThatDay = new Set(side.rosterForCurrentScoringPeriod.entries.map((e) => e.playerId)); shown = shown.filter((x) => onThatDay.has(x.id)); }
      const have = new Set(shown.map((x) => x.id));
      for (const e of side ? side.rosterForCurrentScoringPeriod.entries : []) {
        const pts = e.playerPoolEntry.appliedStatTotal || 0;
        // ESPN 陣容把他排在先發（不是板凳也不是 IR），但他 OUT 沒上場（例如 Avdija）：真的少了一個人的分數，要算進預估，實際記 0
        if (!have.has(e.playerId) && !pts && e.lineupSlotId !== BENCH && e.lineupSlotId !== IR) {
          const rx = playing.find((x) => x.id === e.playerId);
          if (rx) { fp[rx.id] = 0; shown.push(rx); have.add(rx.id); forced.add(rx.id); continue; }
        }
        if (have.has(e.playerId) || !pts) continue;
        const hit = findPlayer(e.playerId), lg = PREDLOG && PREDLOG.rows ? PREDLOG.rows.find((r) => r[0] === p && r[1] === e.playerId) : null;
        const x0 = hit && hit.x, pj = x0 && x0.proj != null ? x0.proj : lg ? lg[3] : null;
        const px = Object.assign({}, x0 || {}, { id: e.playerId, name: noDot(e.playerPoolEntry.player.fullName), slots: (e.playerPoolEntry.player.eligibleSlots || []), proj: pj != null ? pj : 0, games: new Set([p]), dropped: true });
        fp[px.id] = pts; played.add(px.id); shown.push(px);
      }
    } catch (e) { /* 讀不到就維持原本只列現在名單上的人 */ }
  }
  if (past) { lineup = new Set(bestLineup(shown, D.seats).map((x) => x.id)); forced.forEach((id) => lineup.add(id)); }
  const rows = shown.map((x) => ({ x, pr: lineup.has(x.id) ? x.proj : null, act: fp[x.id] }))
    .sort((a, b) => (b.pr != null) - (a.pr != null) || (b.act ?? -1) - (a.act ?? -1));
  const inL = rows.filter((r) => r.pr != null);
  const sp = inL.reduce((s, r) => s + r.pr, 0), sa = inL.reduce((s, r) => s + (r.act || 0), 0);
  const dif = (v) => `<span class="${v >= 0.05 ? "up" : v <= -0.05 ? "down" : "sub"}">${v >= 0 ? "+" : ""}${f1(v)}</span>`;
  box.innerHTML = head + `
    <p class="sub">ESPN 實際總分 <b>${r0(((ti ? D.oppByDay : D.myByDay) || {})[p] || 0)}</b> · 預估 <b>${f1(sp)}</b></p>
    <div class="scroll"><table class="vs">
      <tr><th>球員</th><th class="n">預估</th><th class="n">實際</th><th class="n">差</th></tr>
      ${rows.map(({ x, pr, act }) => `<tr><td><span class="pname" data-pid="${x.id}">${esc(x.name)}</span>${x.dropped ? '<span class="pill">已丟掉</span>' : ""}${pr == null ? '<span class="pill">不在預估先發</span>' : ""}</td>
        <td class="n">${pr == null ? "-" : f1(pr)}</td><td class="n big">${act == null ? '<span class="sub">沒上場</span>' : f1(act)}</td><td class="n">${pr == null || act == null ? (pr != null ? dif(-pr) : "-") : dif(act - pr)}</td></tr>`).join("")
        || '<tr><td colspan="4" class="sub">這天沒有人有比賽</td></tr>'}

    if (x.last7 >= x.avg + 3) { sc += 1; why.push(`近 7 天 ${f1(x.last7)}，已經比今年平均 ${f1(x.avg)} 高，開始在回升`); }

  }
  if (m7 != null && m != null) {
    if (m7 <= m - 5) { sc -= 1; why.push(`近 7 天只打 ${Math.round(m7)} 分鐘，比今年平均少 ${Math.round(m - m7)} 分鐘${x.injury !== "ACTIVE" && x.injury !== "NORMAL" ? "，可能跟傷勢有關" : ""}`); }

  return `<div class="advice ${cls}"><b>會不會反彈：${txt}</b>
    <p class="sub" style="margin:4px 0 0">今年 ${f1(x.avg)}、去年 ${f1(x.lastYear)}，差 ${f1(x.lastYear - x.avg)} 分。</p>
    <ul>${why.map((w) => `<li>${esc(w)}</li>`).join("")}</ul></div>`;
}

(() => {
  if (!/github\.io$/.test(location.hostname)) return;
  const check = async () => {
    try {
      const h = await fetch(location.pathname + "?nc=" + Date.now(), { cache: "no-store" }).then((r) => (r.ok ? r.text() : ""));
      const m = h.match(/^const CHANGES = \[\["((?:[^"\\]|\\.)*)"/m);
      if (!m) return;
      const latest = JSON.parse('"' + m[1] + '"');
      if (latest === CHANGES[0][0]) return;
      const key = "upd:" + latest.slice(0, 40);
      if (sessionStorage.getItem(key)) return; // 同一個新版只試一次，避免一直重新整理
      sessionStorage.setItem(key, "1");
      location.replace(location.pathname + "?v=" + Date.now() + location.hash);
    } catch (_) {}
  };
  check();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") check(); });
})();

function swWrap(cards, cls = "") { // 卡片疊起來（只有一張就照原本排）

// 補強建議卡片堆疊：像交友軟體一樣，左滑看下一位、右滑回上一位（循環），也可以按 ‹ ›
function initSwStack(box) {
  const deck = box.querySelector(".swdeck"), cards = [...deck.children], n = cards.length, pos = box.querySelector(".swpos"), wide = () => matchMedia("(min-width: 700px)").matches; // 電腦版全部攤開，不能滑
  let cur = 0, busy = false;
  const lay = () => {
    cards.forEach((c, i) => {
      const k = (i - cur + n) % n;
      c.style.zIndex = n - k;
      c.style.pointerEvents = k ? "none" : "";
      c.style.transform = k === 0 ? "" : k <= 2 ? `translateY(${k * 8}px) scale(${1 - k * 0.04})` : "translateY(16px) scale(.92)";
      c.style.opacity = k <= 2 ? (k ? 1 - k * 0.25 : 1) : 0;
      c.setAttribute("aria-hidden", k && !wide() ? "true" : "false");
    });
    pos.textContent = `${cur + 1} / ${n}`;
    fit();
  };
  // 卡片高度不一樣：高度跟著最上面那張走，後面的卡片截成一樣高，不要留一大塊空白（電腦版攤開就不處理）
  const fit = () => {
    cards.forEach((c) => { c.style.height = ""; c.style.overflow = ""; });
    deck.style.height = "";
    if (wide()) return;
    const h = cards[cur].offsetHeight; if (!h) return;
    cards.forEach((c, i) => { if (i !== cur) { c.style.height = h + "px"; c.style.overflow = "hidden"; } });
    deck.style.height = (h + 16) + "px";
  };
  box._lay = lay;
  const go = (d, fly) => {
    if (busy) return; busy = true;
    const top = cards[cur];
    top.classList.remove("drag");
    top.style.transform = `translateX(${(fly || -d) * 120}%) rotate(${(fly || -d) * 14}deg)`; top.style.opacity = 0;
    setTimeout(() => { cur = (cur + d + n) % n; lay(); busy = false; }, 230);
  };
  box.querySelectorAll(".swb").forEach((b) => b.addEventListener("click", () => go(Number(b.dataset.d))));
  let sx = 0, sy = 0, dx = 0, on = false, drag = false, pid = null;
  deck.addEventListener("pointerdown", (e) => { if (busy || e.button > 0 || e.pointerType !== "mouse" || wide()) return; on = true; drag = false; dx = 0; sx = e.clientX; sy = e.clientY; pid = e.pointerId; });
  deck.addEventListener("pointermove", (e) => {
    if (!on || e.pointerId !== pid) return;
    dx = e.clientX - sx; const dy = e.clientY - sy;
    if (!drag) { if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { on = false; return; } if (Math.abs(dx) < 8) return; drag = true; try { deck.setPointerCapture(pid); } catch (_) {} cards[cur].classList.add("drag"); }
    cards[cur].style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
  });
  const end = () => {
    if (!on) return; on = false;
    if (!drag) return;
    const top = cards[cur]; top.classList.remove("drag");
    if (Math.abs(dx) > Math.min(90, deck.offsetWidth * 0.25)) go(dx < 0 ? 1 : -1, dx < 0 ? -1 : 1); else lay();
    lastDrag = Date.now(); drag = false;
  };
  let lastDrag = 0;
  deck.addEventListener("click", (ev) => { if (Date.now() - lastDrag < 350) { ev.stopPropagation(); ev.preventDefault(); } }, true);
  deck.addEventListener("pointerup", end);
  // 手機：用 touch 事件，判斷是橫向滑動後就擋住頁面捲動（iOS 斜著滑時不會讓頁面跟著上下跑）
  let tx = 0, ty = 0, mode = 0; // 0 還沒判斷、1 橫向拖卡片、2 直向捲頁面
  let tapEl = null;
  deck.addEventListener("touchstart", (e) => { tapEl = e.target; if (busy || e.touches.length !== 1 || wide()) { mode = 2; return; } const t = e.touches[0]; tx = t.clientX; ty = t.clientY; dx = 0; mode = 0; }, { passive: true });
  deck.addEventListener("touchmove", (e) => {
    if (mode === 2) return;
    const t = e.touches[0], mx = t.clientX - tx, my = t.clientY - ty;
    if (mode === 0) { if (Math.abs(mx) < 10 && Math.abs(my) < 10) return; tapEl = null; if (Math.abs(my) > Math.abs(mx)) { mode = 2; return; } mode = 1; cards[cur].classList.add("drag"); } // 手指抖動 10px 內都算點一下，不算滑動
    e.preventDefault(); dx = mx;
    cards[cur].style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
  }, { passive: false });
  const tend = (e) => {
    if (mode !== 1) { // 點一下：點到球員名字就直接打開球員卡（iPhone 在疊起來的卡片上有時不會送出 click）
      const n = mode === 0 && tapEl && tapEl.closest && tapEl.closest(".pname[data-pid]"); mode = 0; tapEl = null;
      if (n && e && e.type === "touchend") { e.preventDefault(); openPlayer(Number(n.dataset.pid)).then(applyMarks); }
      return;
    }
    mode = 0;
    cards[cur].classList.remove("drag");
    if (Math.abs(dx) > Math.min(90, deck.offsetWidth * 0.25)) go(dx < 0 ? 1 : -1, dx < 0 ? -1 : 1); else lay();
    if (Math.abs(dx) > 10) lastDrag = Date.now();
  };
  deck.addEventListener("touchend", tend); deck.addEventListener("touchcancel", tend); deck.addEventListener("pointercancel", () => { if (on && drag) { on = false; cards[cur].classList.remove("drag"); lay(); } on = false; });
  lay();
}

// ---------- 交易模擬：勾選雙方要換的人，馬上算出兩隊每週差幾分 ----------
let TS = { tid: null, give: [], get: [] };
function tsResult(D, R, oname) {
  const cell = (v) => `<td class="n ${sgnCls(v)}">${sgn0(v)}</td>`;
  // 每種估法看例行賽和季後賽的平均：多 5 分以上算賺、少 5 分以上算虧，中間算差不多
  const sc = (d, m) => (d[m].reg + d[m].po) / 2, grp = (d) => ({ win: SIM_MODELS.filter(([m]) => sc(d, m) > 5), lose: SIM_MODELS.filter(([m]) => sc(d, m) < -5) });
  const me = grp(R.me), th = grp(R.them), lab = (arr) => arr.map(([, l]) => l).join("、");

// ---------- 球員詳細（點名字）與新聞 ----------
const NEWS = {}; // player id -> { at, items }
const IMPORTANT = /injur|sprain|strain|surgery|ruled out|\bout\b|will not play|won't play|not play|questionable|doubtful|probable|returns?\b|sidelined|(will|to) miss|day-to-day|resting|rest\b|starting|to start|will start|bench|minutes restriction|suspend|illness|sore|g league|traded|waived|concussion|mri|upgraded|downgraded|available|cleared/i;
// 標題是「XX 拿了幾分」這種比賽數據報導就不算重要新聞
const isImportant = (n) => IMPORTANT.test(n.head) && !/\d+ points|\(\d+-\d+ FG/i.test(n.head);
async function getNews(id) {
  const c = NEWS[id];
  if (c && Date.now() - c.at < 30 * 60000) return c.items;
  const r = await fetch(`https://site.api.espn.com/apis/fantasy/v2/games/fba/news/players?days=30&playerId=${id}`);
  const d = r.ok ? await r.json() : { feed: [] };
  const items = (d.feed || []).filter((n) => n.type === "Rotowire" || n.story)
    .map((n) => ({ when: new Date(n.published || n.lastModified), head: n.headline || "", story: (n.story || n.description || "").replace(/<[^>]+>/g, "") }))
    .sort((a, b) => b.when - a.when);
  NEWS[id] = { at: Date.now(), items };
  return items;
}
const recentImportant = (items) => items.find((n) => Date.now() - n.when < 3 * 86400000 && isImportant(n));

// 在名字旁邊標出最近 3 天有重要新聞（傷病、先發異動等）的球員
async function markNews() {
  const els = [...document.querySelectorAll(".pname[data-pid]")];
  const ids = [...new Set(els.map((e) => Number(e.dataset.pid)))];
  const visible = new Set([...document.querySelectorAll("#rrl .pname, #rrl-fa .pname")].map((e) => Number(e.dataset.pid)));
  const todo = ids.filter((id) => visible.has(id));
  for (let i = 0; i < todo.length; i += 8) {
    await Promise.all(todo.slice(i, i + 8).map((id) => getNews(id).catch(() => [])));
  }
  for (const e of document.querySelectorAll(".pname[data-pid]")) {
    const c = NEWS[e.dataset.pid];
    const hit = c && recentImportant(c.items);
    if (hit && !e.querySelector(".news")) {
      const s = document.createElement("span");
      s.className = "news"; s.textContent = "📰"; s.title = hit.head;
      e.appendChild(s);
    }
  }
}

function findPlayer(id) {
  if (!CUR) return null;
  for (const t of CUR.teams) { const x = CUR.rosters[t.id].find((p) => p.id === id); if (x) return { x, team: t }; }
  const f = CUR.fas.find((p) => p.id === id) || EXTRA[id];
  return f ? { x: f, team: null } : null;
}

// 今天要做的事：紅色「要做」常常一次好幾項，只先顯示前 3 項，其餘收在「還有 N 項要做」裡；留意、建議照舊
let TODO_OPEN = false;
// 同一位球員連續好幾天先發有傷兵、或同一批人好幾天都在替補：合成一條，日期用頓號串起來，不要一天一條
function mergeTodos(list) {
  const out = [], idx = {};
  for (const t of list) {
    const [c, tag, title] = t; let m, key = null, kind = null;
    if (tag === "要做" && (m = title.match(/^(.+?) 先發有傷兵：(.+)$/))) { key = "inj|" + m[2]; kind = "inj"; }
    else if (tag === "要做" && (m = title.match(/^(.+?) 把 (.+) 換上先發$/))) { key = "bn|" + m[2]; kind = "bn"; }
    if (!key) { out.push(t); continue; }
    if (idx[key] != null) { out[idx[key]]._days.push(m[1]); continue; }
    const row = t.slice(); row._days = [m[1]]; row._kind = kind; row._names = m[2]; idx[key] = out.length; out.push(row);
  }
  return out.map((r) => (r._days && r._days.length > 1 ? [r[0], r[1], r._kind === "inj" ? `${r._days.join("、")} 先發有傷兵：${r._names}` : `${r._days.join("、")} 把 ${r._names} 換上先發`, r[3]] : r));
}
function todoCounts(A) {
  const L = mergeTodos(A.todos), n = (tag) => L.filter((t) => t[1] === tag).length;
  return [["bad", "要做", n("要做")], ["warn", "留意", n("留意")], ["ok", "建議", n("建議")]].filter((x) => x[2]).map(([c, t, k]) => `<span class="tdcount ${c}">${t} ${k}</span>`).join("");
}
function todoListHtml(A, LK) {
  const row = ([c, tag, t, b]) => `<div class="todo"><span class="tag ${c}">${tag}</span>${/^照撿人排程：/.test(t) && A.plan.steps.length ? todoPlan(A, LK) : `<div>${todoHead(t, LK) + todoBody(b, LK)}</div>`}</div>`;
  const LIST = mergeTodos(A.todos), must = LIST.filter((t) => t[1] === "要做"), rest = LIST.filter((t) => t[1] !== "要做");
  const SHOW = 3;
  return must.slice(0, SHOW).map(row).join("")
    + (must.length > SHOW ? `<details class="todofold"${TODO_OPEN ? " open" : ""}><summary>還有 ${must.length - SHOW} 項要做</summary>${must.slice(SHOW).map(row).join("")}</details>` : "")
    + rest.map(row).join("");
}

  const head = x ? `<button type="button" class="tocmp" data-cmp="${x.id}">⚖ 加入比較</button><h3>${esc(x.name)} <span class="sub">${esc(x.team)}${(() => { const ps = [...new Set((x.slots || []).map((sl) => SLOT_LABEL[sl]).filter((l) => ["PG", "SG", "SF", "PF", "C"].includes(l)))].join("/"); return ps ? ` · ${ps}` : ""; })()}${hit.team ? ` · ${esc(hit.team.name)}` : " · 自由球員"}</span></h3>
    <p class="sub">${[`今年 ${f1(x.avg)}`, `近 7 天 ${f1(x.last7)}`, `近 15 天 ${f1(x.last15)}`, `去年 ${f1(x.lastYear)}`, x.own != null ? `持有 ${f1(x.own)}%` : ""].filter(Boolean).map((t) => `<span class="nw">${t}</span>`).join(" · ")}</p>
    ${x.injury !== "ACTIVE" && x.injury !== "NORMAL" ? `<p class="pill big">${esc(INJURY[x.injury] || x.injury)}${(() => { const i = injInfo(x, CUR); return i ? "：" + esc(i.long) : ""; })()}</p>` : ""}${keepAdvice(x, hit.team)}${bounceBox(x)}
    <details class="advfold"><summary>進階數據與助攻關係</summary>${advBox(x) || noAdvNote(x)}${pbpBox(x)}${assistBox(x)}</details>` : "";
  box.innerHTML = head + '<p class="sub">讀取中…</p>';
  const schedP = x ? scheduleBox(x).catch(() => "") : Promise.resolve("");
  try {
    const [card, news] = await Promise.all([
      get(`${LEAGUE}?view=kona_playercard`, { players: { filterIds: { value: [id] }, filterStatsForTopScoringPeriodIds: { value: 16, additionalValue: ["00" + SEASON] } } }),
      getNews(id).catch(() => []),
    ]);
    const pl = card.players && card.players[0] && card.players[0].player;
    const logs = ((pl && pl.stats) || []).filter((st) => st.statSplitTypeId === 5 && st.statSourceId === 0 && st.seasonId === SEASON && st.stats && st.stats["40"] != null)
      .sort((a, b) => b.scoringPeriodId - a.scoringPeriodId).slice(0, 10);
    const proId = pl && pl.proTeamId;
    const vs = (st) => { const g = GAMES[Number(String(st.id).slice(2))]; if (!g) return ["", ""];
      const home = g.homeProTeamId === proId; const o = home ? g.awayProTeamId : g.homeProTeamId;
      const d = new Date(g.date); return [`${d.getMonth() + 1}/${d.getDate()}`, `${home ? "vs" : "@"} ${ABBR[o] || ""}`]; };
    const n = (st, k) => st.stats[k] == null ? "-" : Math.round(st.stats[k]);
    const sched = await schedP;
    // 分數變化量圖卡：每根長條是一場的 fantasy 分數，實色高於今年平均、淡色低於，虛線是今年平均
    const series = [...logs].reverse().map((st) => ({ v: st.appliedTotal || 0, min: st.stats["40"], d: vs(st) })), avgV = x && x.avg ? x.avg : (series.length ? series.reduce((a, g) => a + g.v, 0) / series.length : 0);
    const barsCard = (() => {
      if (!series.length) return "";
      const vals = series.map((g) => g.v), mx = Math.max(10, ...vals), BH = 46, last = series[series.length - 1], delta = last.v - avgV, cls = delta >= 0 ? "up" : "down";
      return `<div class="pcard mspark"><div class="ph"><b>分數變化</b><span class="sub">最近 ${series.length} 場 · 今年平均 ${f1(avgV)}</span></div>
        <div class="msrow"><div class="msb" style="height:${BH}px">${series.map((g, k) => `<button type="button" class="msbar ${g.v >= avgV ? "pu" : "pd"}" data-mi="${k}" style="height:${Math.max(3, Math.round((Math.max(0, g.v) / mx) * BH))}px" aria-label="${esc(g.d[0])} ${Math.round(g.v)} 分"></button>`).join("")}</div>
          <div class="msv ${cls}">最近 ${Math.round(last.v)}<span>(${delta >= 0 ? "+" : ""}${f1(delta)})</span></div></div>
        <p class="sub mtip" id="mTip">綠色長條高於今年平均，紅色低於；點長條看那一場。</p></div>`;
    })();
    box.innerHTML = head + (sched ? `<div class="mark-wrap${nw("sched")}">${sched}</div>` : "") + barsCard + `
      <h4>最近 ${logs.length} 場</h4>
      ${logs.length ? `<div class="scroll"><table class="log">
        <tr><th>日期</th><th>對手</th><th class="n">fpts</th><th class="n">pts</th><th class="n">籃板</th><th class="n">助攻</th><th class="n">抄截</th><th class="n">阻攻</th><th class="n">失誤</th><th class="n">分鐘</th></tr>
        ${logs.map((st) => { const [d, o] = vs(st); const fp = st.appliedTotal || 0;
          return `<tr><td>${d}</td><td>${esc(o)}</td><td class="n big why ${x ? (fp > x.avg ? "up" : fp < x.avg ? "down" : "") : ""}" data-wi="${logs.indexOf(st)}" tabindex="0">${Math.round(fp)}</td><td class="n">${n(st, "0")}</td><td class="n">${n(st, "6")}</td><td class="n">${n(st, "3")}</td><td class="n">${n(st, "2")}</td><td class="n">${n(st, "1")}</td><td class="n">${n(st, "11")}</td><td class="n">${n(st, "40")}</td></tr>`; }).join("")}
      </table></div>` : '<p class="sub">今年還沒有出賽紀錄。</p>'}
      <h4>最新消息 <small class="sub">（Rotowire，英文）</small></h4>
      ${news.length ? news.slice(0, 4).map((nw) => `<div class="nitem${isImportant(nw) ? " imp" : ""}">
        <div class="sub">${nw.when.getMonth() + 1}/${nw.when.getDate()} ${String(nw.when.getHours()).padStart(2, "0")}:${String(nw.when.getMinutes()).padStart(2, "0")}${isImportant(nw) ? " · 重要" : ""}</div>
        <b>${esc(nw.head)}</b>${nw.story ? `<p>${esc(nw.story)}</p>` : ""}</div>`).join("") : '<p class="sub">最近 30 天沒有新聞。</p>'}
      <p class="note">fpts 是 fantasy 分數，pts 是真實得分；<span class="up">綠色</span>代表比今年平均高，<span class="down">紅色</span>代表比較低。點 fpts 可以看這場高低分的原因。</p>`;
    box.querySelectorAll(".mspark .msbar").forEach((b) => b.addEventListener("click", () => {
      box.querySelectorAll(".mspark .msbar").forEach((o) => o.classList.toggle("on", o === b));
      const g = series[Number(b.dataset.mi)], dl = g.v - avgV;
      $("#mTip").innerHTML = `<b>${esc(g.d[0])}</b> ${esc(g.d[1])}：${Math.round(g.v)} fpts（${Math.round(g.min)} 分鐘），比今年平均 <b class="${dl >= 0 ? "up" : "down"}">${dl >= 0 ? "+" : ""}${f1(dl)}</b>`;
    }));
    const seasonSt = ((pl && pl.stats) || []).find((st) => st.statSplitTypeId === 0 && st.statSourceId === 0 && st.seasonId === SEASON && st.stats), seasonInfo = seasonSt ? { gp: Number(seasonSt.stats["42"]) || 0, tot: seasonSt.stats } : null;
    const WHY = logs.map((st) => gameWhy(st, logs, avgV, seasonInfo, (vs(st)[1] || "").split(" ")[1] || "", x)), tip = $("#whytip");
    const showWhy = (td) => { tip.innerHTML = WHY[Number(td.dataset.wi)]; tip.hidden = false; const r = td.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight; tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.right - w)) + "px"; tip.style.top = (r.bottom + h + 12 > innerHeight ? Math.max(8, r.top - h - 6) : r.bottom + 6) + "px"; };
    box.querySelectorAll("td.why").forEach((td) => { td.addEventListener("mouseenter", () => showWhy(td)); td.addEventListener("mouseleave", () => { tip.hidden = true; }); td.addEventListener("focus", () => showWhy(td)); td.addEventListener("blur", () => { tip.hidden = true; }); td.addEventListener("click", (ev) => { ev.stopPropagation(); if (tip.hidden || tip.dataset.for !== td.dataset.wi) { tip.dataset.for = td.dataset.wi; showWhy(td); } else tip.hidden = true; }); });
  } catch (e) {
    const sched = await schedP;
    box.innerHTML = head + (sched ? `<div class="mark-wrap${nw("sched")}">${sched}</div>` : "") + `<p class="sub">讀不到這位球員最近的比賽紀錄${/404/.test(String(e.message)) ? "（試做版只存了部分球員的紀錄，即時版都看得到）" : "：" + esc(e.message || e)}。</p>`;
  }
}
function closePlayer() { $("#modal").hidden = true; const rk = $("#p12"); document.body.style.overflow = rk && !rk.hidden ? "hidden" : ""; }
document.addEventListener("click", (e) => {
  const tc = e.target.closest(".tocmp[data-cmp]");
  if (tc) { addToCompare(Number(tc.dataset.cmp)); if (tc.closest("#modal")) closePlayer(); return; }
  const ok = e.target.closest(".ok-btn[data-ok]");
  if (ok) { confirmMark(ok.dataset.ok); return; }
  const hk = e.target.closest(".wchart .hit");
  if (hk) { document.querySelectorAll(".wchart .hit").forEach((h) => h.classList.toggle("on", h === hk));
    const r = document.querySelectorAll("#t-wk tr")[Number(hk.dataset.wk) + 1];
    $("#wk-tip").textContent = r ? [...r.children].map((c, i) => ["", "你 ", "對手 ", "中位數 ", "結果 "][i] + c.textContent.trim()).join("　") : ""; return; }
  const sh = e.target.closest("[data-share]");
  if (sh) { openShare(Number(sh.dataset.share)); return; }
  const hb = e.target.closest(".rec2[data-hab]");
  if (hb) { openHabit(Number(hb.dataset.hab)); return; }
  const rv = e.target.closest(".rec2[data-rec]");
  if (rv) { openRecord(Number(rv.dataset.rec)); return; }

  if (hz) { openDay(0, Number(hz.dataset.p)); return; }
  const dv = e.target.closest(".dif[data-p]");

  if (e.target.id === "modal" || e.target.closest(".close")) closePlayer();
