    top.style.transform = `translateX(${(fly || -d) * 120}%) rotate(${(fly || -d) * 14}deg)`; top.style.opacity = 0;
    setTimeout(() => { cur = (cur + d + n) % n; lay(); busy = false; }, 230);
  };
  box.querySelectorAll(".swb").forEach((b) => b.addEventListener("click", () => go(Number(b.dataset.d))));
  let sx = 0, sy = 0, dx = 0, on = false, drag = false, pid = null;
  deck.addEventListener("pointerdown", (e) => { if (busy || e.button > 0 || e.pointerType !== "mouse" || wide()) return; on = true; drag = false; dx = 0; sx = e.clientX; sy = e.clientY; pid = e.pointerId; });
  deck.addEventListener("pointermove", (e) => {
    if (!on || e.pointerId !== pid) return;
    dx = e.clientX - sx; const dy = e.clientY - sy;
    if (!drag) { if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { on = false; return; } if (Math.abs(dx) < 8) return; drag = true; try { deck.setPointerCapture(pid); } catch (_) {} cards[cur].classList.add("drag"); }
    cards[cur].style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
  });
  const end = () => {
    if (!on) return; on = false;
    if (!drag) return;
    const top = cards[cur]; top.classList.remove("drag");
    if (Math.abs(dx) > Math.min(90, deck.offsetWidth * 0.25)) go(dx < 0 ? 1 : -1, dx < 0 ? -1 : 1); else lay();
    lastDrag = Date.now(); drag = false;
  };
  let lastDrag = 0;
  deck.addEventListener("click", (ev) => { if (Date.now() - lastDrag < 350) { ev.stopPropagation(); ev.preventDefault(); } }, true);
  deck.addEventListener("pointerup", end);
  // 手機：用 touch 事件，判斷是橫向滑動後就擋住頁面捲動（iOS 斜著滑時不會讓頁面跟著上下跑）
  let tx = 0, ty = 0, mode = 0; // 0 還沒判斷、1 橫向拖卡片、2 直向捲頁面
  let tapEl = null;
  deck.addEventListener("touchstart", (e) => { tapEl = e.target; if (busy || e.touches.length !== 1 || wide()) { mode = 2; return; } const t = e.touches[0]; tx = t.clientX; ty = t.clientY; dx = 0; mode = 0; }, { passive: true });
  deck.addEventListener("touchmove", (e) => {
    if (mode === 2) return;
    const t = e.touches[0], mx = t.clientX - tx, my = t.clientY - ty;
    if (mode === 0) { if (Math.abs(mx) < 10 && Math.abs(my) < 10) return; tapEl = null; if (Math.abs(my) > Math.abs(mx)) { mode = 2; return; } mode = 1; cards[cur].classList.add("drag"); } // 手指抖動 10px 內都算點一下，不算滑動
    e.preventDefault(); dx = mx;
    cards[cur].style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
  }, { passive: false });
  const tend = (e) => {
    if (mode !== 1) { // 點一下：點到球員名字就直接打開球員卡（iPhone 在疊起來的卡片上有時不會送出 click）
      const n = mode === 0 && tapEl && tapEl.closest && tapEl.closest(".pname[data-pid]"); mode = 0; tapEl = null;
      if (n && e && e.type === "touchend") { e.preventDefault(); openPlayer(Number(n.dataset.pid)).then(applyMarks); }
      return;
    }
    mode = 0;
    cards[cur].classList.remove("drag");
    if (Math.abs(dx) > Math.min(90, deck.offsetWidth * 0.25)) go(dx < 0 ? 1 : -1, dx < 0 ? -1 : 1); else lay();
    if (Math.abs(dx) > 10) lastDrag = Date.now();
  };
  deck.addEventListener("touchend", tend); deck.addEventListener("touchcancel", tend); deck.addEventListener("pointercancel", () => { if (on && drag) { on = false; cards[cur].classList.remove("drag"); lay(); } on = false; });
  lay();
}

function openFuture(ti, p) {

  const rows = [...playing].sort((a, b) => ids.has(b.id) - ids.has(a.id) || b.proj - a.proj);

    ${rows.map((x) => `<tr><td><span class="pname" data-pid="${x.id}">${esc(x.name)}</span>${x.out ? `<span class="pill">${esc(INJURY[x.injury] || "OUT")}</span>` : ""}${!ids.has(x.id) && !x.out ? '<span class="pill">排不進先發</span>' : ""}${benched(x) ? '<span class="pill">ESPN 上在替補</span>' : ""}</td><td class="n">${ids.has(x.id) ? f1(x.proj) : "-"}</td></tr>`).join("") || '<tr><td colspan="2" class="sub">這天沒有人有比賽</td></tr>'}

function lineupCard(D, A) {
  const days = A.days.filter((d) => D.myRoster.filter((x) => x.games.has(d.p) && !x.out).length > D.seats.length);
  if (!days.length) return "";
  const order = (s) => SLOT_ORDER.indexOf(s);
  const blocks = days.map((d) => {
    const playing = D.myRoster.filter((x) => x.games.has(d.p) && !x.out);
    const lu = bestLineup(playing, D.seats), ids = new Set(lu.map((x) => x.id));
    const sit = playing.filter((x) => !ids.has(x.id)).sort((a, b) => b.proj - a.proj);
    const slots = D.dailySlots[d.p] || {}, onEspn = (x) => slots[x.id] != null && slots[x.id] !== BENCH && slots[x.id] !== IR;
    const toStart = lu.filter((x) => !onEspn(x)), toSit = sit.filter(onEspn);
    const ok = !toStart.length && !toSit.length;
    const rows = [...lu].sort((a, b) => order(lu.seatOf.get(a)) - order(lu.seatOf.get(b)) || b.proj - a.proj);
    return `<div class="lu">
      <div class="luhead"><b>${d.label}</b><span class="sub">${playing.length} 人能上場，先發只有 ${D.seats.length} 個位置</span>${ok ? '<span class="atag ok">ESPN 已經排好</span>' : '<span class="atag bad">要調整</span>'}</div>
      ${ok ? "" : `<p class="warnline">${toStart.length ? `換上先發：${toStart.map((x) => `<span class="pname" data-pid="${x.id}">${esc(x.name)}</span>（${f1(x.proj)}）`).join("、")}` : ""}${toStart.length && toSit.length ? "；" : ""}${toSit.length ? `移到板凳：${toSit.map((x) => `<span class="pname" data-pid="${x.id}">${esc(x.name)}</span>（${f1(x.proj)}）`).join("、")}` : ""}</p>`}
      <div class="lugrid">${rows.map((x) => `<span class="luslot"><i>${SLOT_LABEL[lu.seatOf.get(x)] || ""}</i><span class="pname" data-pid="${x.id}">${esc(x.name)}</span><small class="sub">${f1(x.proj)}</small></span>`).join("")}</div>
      <p class="sub" style="margin:6px 0 0">坐板凳：${sit.map((x) => `<span class="pname" data-pid="${x.id}">${esc(x.name)}</span>（${f1(x.proj)}）`).join("、")}</p>
    </div>`;
  });
  return `<section class="card${nw("lineup")}">
    <h2>最佳先發建議 <small>只列出能上場超過 ${D.seats.length} 人的日子</small></h2>

  </section>`;
}

// ---------- 球員詳細（點名字）與新聞 ----------
const NEWS = {}; // player id -> { at, items }
const IMPORTANT = /injur|sprain|strain|surgery|ruled out|\bout\b|will not play|won't play|not play|questionable|doubtful|probable|returns?\b|sidelined|(will|to) miss|day-to-day|resting|rest\b|starting|to start|will start|bench|minutes restriction|suspend|illness|sore|g league|traded|waived|concussion|mri|upgraded|downgraded|available|cleared/i;
// 標題是「XX 拿了幾分」這種比賽數據報導就不算重要新聞
const isImportant = (n) => IMPORTANT.test(n.head) && !/\d+ points|\(\d+-\d+ FG/i.test(n.head);
async function getNews(id) {
  const c = NEWS[id];
  if (c && Date.now() - c.at < 30 * 60000) return c.items;
  const r = await fetch(`https://site.api.espn.com/apis/fantasy/v2/games/fba/news/players?days=30&playerId=${id}`);
  const d = r.ok ? await r.json() : { feed: [] };
  const items = (d.feed || []).filter((n) => n.type === "Rotowire" || n.story)
    .map((n) => ({ when: new Date(n.published || n.lastModified), head: n.headline || "", story: (n.story || n.description || "").replace(/<[^>]+>/g, "") }))
    .sort((a, b) => b.when - a.when);
  NEWS[id] = { at: Date.now(), items };
  return items;
}
const recentImportant = (items) => items.find((n) => Date.now() - n.when < 3 * 86400000 && isImportant(n));

// 在名字旁邊標出最近 3 天有重要新聞（傷病、先發異動等）的球員
async function markNews() {
  const els = [...document.querySelectorAll(".pname[data-pid]")];
  const ids = [...new Set(els.map((e) => Number(e.dataset.pid)))];
  const visible = new Set([...document.querySelectorAll("#t-roster .pname, #t-fa .pname")].map((e) => Number(e.dataset.pid)));
  const todo = ids.filter((id) => visible.has(id));
  for (let i = 0; i < todo.length; i += 8) {
    await Promise.all(todo.slice(i, i + 8).map((id) => getNews(id).catch(() => [])));
  }
  for (const e of document.querySelectorAll(".pname[data-pid]")) {
    const c = NEWS[e.dataset.pid];
    const hit = c && recentImportant(c.items);
    if (hit && !e.querySelector(".news")) {
      const s = document.createElement("span");
      s.className = "news"; s.textContent = "📰"; s.title = hit.head;
      e.appendChild(s);
    }
  }
}

function findPlayer(id) {
  if (!CUR) return null;
  for (const t of CUR.teams) { const x = CUR.rosters[t.id].find((p) => p.id === id); if (x) return { x, team: t }; }
  const f = CUR.fas.find((p) => p.id === id) || EXTRA[id];
  return f ? { x: f, team: null } : null;
}

      ${news.length ? news.slice(0, 4).map((nw) => `<div class="nitem${isImportant(nw) ? " imp" : ""}">
        <div class="sub">${nw.when.getMonth() + 1}/${nw.when.getDate()} ${String(nw.when.getHours()).padStart(2, "0")}:${String(nw.when.getMinutes()).padStart(2, "0")}${isImportant(nw) ? " · 重要" : ""}</div>
        <b>${esc(nw.head)}</b>${nw.story ? `<p>${esc(nw.story)}</p>` : ""}</div>`).join("") : '<p class="sub">最近 30 天沒有新聞。</p>'}
      <p class="note">分數是 fantasy 分數；<span class="up">綠色</span>代表比今年平均高，<span class="down">紅色</span>代表比較低。</p>`;
    box.querySelectorAll(".mspark .msbar").forEach((b) => b.addEventListener("click", () => {

      const g = series[Number(b.dataset.mi)], dl = g.v - avgV;
      $("#mTip").innerHTML = `<b>${esc(g.d[0])}</b> ${esc(g.d[1])}：${Math.round(g.v)} 分（${Math.round(g.min)} 分鐘），比今年平均 <b class="${dl >= 0 ? "up" : "down"}">${dl >= 0 ? "+" : ""}${f1(dl)}</b>`;
    }));
    const seasonSt = ((pl && pl.stats) || []).find((st) => st.statSplitTypeId === 0 && st.statSourceId === 0 && st.seasonId === SEASON && st.stats), seasonInfo = seasonSt ? { gp: Number(seasonSt.stats["42"]) || 0, tot: seasonSt.stats } : null;
    const WHY = logs.map((st) => gameWhy(st, logs, avgV, seasonInfo, (vs(st)[1] || "").split(" ")[1] || "", x)), tip = $("#whytip");
    const showWhy = (td) => { tip.innerHTML = WHY[Number(td.dataset.wi)]; tip.hidden = false; const r = td.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight; tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.right - w)) + "px"; tip.style.top = (r.bottom + h + 12 > innerHeight ? Math.max(8, r.top - h - 6) : r.bottom + 6) + "px"; };
    box.querySelectorAll("td.why").forEach((td) => { td.addEventListener("mouseenter", () => showWhy(td)); td.addEventListener("mouseleave", () => { tip.hidden = true; }); td.addEventListener("focus", () => showWhy(td)); td.addEventListener("blur", () => { tip.hidden = true; }); td.addEventListener("click", (ev) => { ev.stopPropagation(); if (tip.hidden || tip.dataset.for !== td.dataset.wi) { tip.dataset.for = td.dataset.wi; showWhy(td); } else tip.hidden = true; }); });
  } catch (e) {
    const sched = await schedP;
    box.innerHTML = head + (sched ? `<div class="mark-wrap${nw("sched")}">${sched}</div>` : "") + `<p class="sub">讀不到這位球員最近的比賽紀錄${/404/.test(String(e.message)) ? "（試做版只存了部分球員的紀錄，即時版都看得到）" : "：" + esc(e.message || e)}。</p>`;
  }
}

document.addEventListener("click", (e) => {

let busy = false;
// ---------- 密碼：輸入密碼只能看自己那一隊；管理員（你）用專屬連結或管理員密碼看全部 ----------
// 注意：網站是純靜態頁面，密碼只能擋住一般人，懂程式的人還是能繞過；聯盟資料在 ESPN 上本來就是公開的
const AUTH = { salt: "tpbl-v1", teams: { "2": "fde73bebdbdd23f6320c424e5170b1c1a35b83c573f39641eedd2385b735667b" }, admin: "4e3d68fc8385925dede3dfa734b6e507f96abbe9b48ba15d6f1d03e5c51d71e9" };
const PW_DEMO = null; // DEMO（試做用提示，已關閉）
let AUTHED = null;
const sha = async (t) => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)))].map((x) => x.toString(16).padStart(2, "0")).join("");
async function tryPw(pw) {
  pw = (pw || "").trim(); if (!pw) return null;
  if ((await sha(`${AUTH.salt}:admin:${pw}`)) === AUTH.admin) return { role: "admin", h: AUTH.admin };
  for (const id of Object.keys(AUTH.teams)) if ((await sha(`${AUTH.salt}:${id}:${pw}`)) === AUTH.teams[id]) return { role: "team", id: Number(id), h: AUTH.teams[id] };
  return null;
}
function storedAuth() {
  try { const a = JSON.parse(store("auth") || "null"); if (a && a.role === "admin" && a.h === AUTH.admin) return a; if (a && a.role === "team" && AUTH.teams[a.id] === a.h) return a; } catch (e) { /* 沒存過 */ }
  return null;
}
function showLock() {
  return new Promise((done) => {
    document.body.classList.add("locked");
    const el = document.createElement("div"); el.id = "lock";
    el.innerHTML = `<div class="lbox"><h1>🏀 Fantasy 日報</h1><p>請輸入密碼</p><input id="pw" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password" aria-label="密碼"><div class="err" id="pwerr"></div><button id="pwgo" type="button">進入</button>
      ${PW_DEMO ? `<div class="demo">試做版：${Object.entries(PW_DEMO).map(([k, v]) => `${esc(k)} 的密碼是 <b>${esc(v)}</b>`).join("；")}</div>` : ""}</div>`;
    document.body.appendChild(el);
    let bad = 0;
    const go = async () => {
      const r = await tryPw($("#pw").value);
      if (r) { store("auth", JSON.stringify(r)); AUTHED = r; el.remove(); document.body.classList.remove("locked"); done(); return; }
      bad++; $("#pwerr").textContent = bad >= 3 ? "密碼不對，請稍等再試" : "密碼不對"; $("#pw").value = "";
      if (bad >= 3) { $("#pwgo").disabled = true; setTimeout(() => { $("#pwgo").disabled = false; }, 3000); }
    };
    $("#pwgo").addEventListener("click", go); $("#pw").addEventListener("keydown", (e) => { if (e.key === "Enter") go(); }); $("#pw").focus();
  });
}
async function authInit() {
  if (window.__NOAUTH) { AUTHED = { role: "admin" }; return; } // 給 Discord 通知程式用（它在雲端自己打開網頁）
  const m = location.hash.match(/key=([^&]+)/); // 管理員專屬連結：網址後面加 #key=管理員密碼，點一次這台裝置就記住
  if (m) { const r = await tryPw(decodeURIComponent(m[1])); if (r && r.role === "admin") store("auth", JSON.stringify(r)); history.replaceState(null, "", location.pathname + location.search); }
  AUTHED = storedAuth();
  if (!AUTHED) await showLock();
  $("#logout").hidden = false;
  if (AUTHED.role === "team") $("#team").hidden = true; // 朋友只能看自己那一隊，不能切換
}
$("#logout").addEventListener("click", () => { store("auth", ""); location.reload(); });

async function run() {
  if (busy || !AUTHED) return;
  if (Date.now() - (window.__dataAt || 0) > 1800000) { // 網頁一直開著時，每 30 分鐘重新讀後台資料檔（進階數據、pbpstats、新秀、開竅名單…），判斷才會用到最新的
    if (window.__dataAt) { ADV = null; BRK = null; B2BJ = null; INJN = null; RKS = null; PBP = null; WOWY = null; PLOG = null; ASSIST = null; PREDLOG = null; }
    window.__dataAt = Date.now();
  }
  busy = true;
  $("#refresh").textContent = "…";
  try {
    const pick = AUTHED.role === "team" ? String(AUTHED.id) : (new URLSearchParams(location.search).get("team") || store("team"));
    // 後台資料檔互相不依賴，同時讀（以前一個一個讀）；全部讀完才開始算，陣容評估才用得到
    await Promise.all([loadAdv(), loadInjN(), loadInjFeed(), loadB2B(), loadBreak(), loadRookies(), loadPbp(), loadPredLog()]);
    const D = await load(pick);
    await Promise.all([
      loadInjNews(D), // 傷兵的預計缺陣時間（新聞）
      prefetchRich(D), // 陣容和候選自由球員最近的逐場數據（原因判斷用）
      prefetchSleep(D), // 潛力發掘：缺陣主力和同隊自由球員的整季逐場
      teamRecords().catch(() => {}), // 先讀 NBA 戰績，賽程標籤才算得出來
    ]);
    CUR = D;
    const sel = $("#team");
    sel.innerHTML = D.teams.map((t) => `<option value="${t.id}"${t.id === D.me.id ? " selected" : ""}>${esc(t.name)}</option>`).join("");
    const A = analyse(D); D.odds = A.odds; D.A = A; D.habits = analyseHabits(D); render(D, A);
    markNews().catch(() => {});
    teamRecords().catch(() => {});
  } catch (e) {
    $("#app").innerHTML = `<div class="msg">讀不到 ESPN 資料：${esc(e.message || e)}<br>請稍後按右上角的 ↻ 再試一次。</div>`;
  } finally {
    busy = false;
    $("#refresh").textContent = "↻";
  }
}
$("#team").addEventListener("change", (e) => { store("team", e.target.value); history.replaceState(null, "", location.pathname); run(); });
$("#refresh").addEventListener("click", run);
// 開著的時候每 2 分鐘自動更新；從背景切回來也會更新
setInterval(() => { if (!document.hidden) run(); }, 120000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) run(); });
// 陣容變動偵測：每 20 秒讀一次兩隊今天的陣容和聯盟撿人丟人紀錄（很輕），有人換先發、撿人或丟人就馬上整頁更新
let ROSTER_SIG = "", ROSTER_KEY = "";
async function rosterWatch() {
  if (busy || document.hidden || !CUR) return;
  try {
    const [r1, r2, ...tx] = await Promise.all([...[CUR.me.id, CUR.opp.id].map((id) => get(`${LEAGUE}?${qs({ view: "mRoster", scoringPeriodId: CUR.period, forTeamId: id })}`)),
      ...[CUR.period, CUR.period - 1].filter((p) => p > 0).map((p) => get(`${LEAGUE}?${qs({ view: "mTransactions2", scoringPeriodId: p })}`, { transactions: { filterType: { value: ["FREEAGENT", "WAIVER"] } } }))]);
    const txSig = tx.flatMap((d) => (d.transactions || []).filter((t) => t.status === "EXECUTED").map((t) => t.id)).sort().join(","); // 聯盟裡任何人撿人丟人也要更新
    const sig = [r1, r2].map((d) => (d.teams || []).filter((t) => t.roster).map((t) => t.id + ":" + t.roster.entries.map((e) => e.playerId + "/" + e.lineupSlotId).sort().join(",")).join("|")).join("#") + "#" + txSig;
    const key = CUR.me.id + "-" + CUR.period; // 換看別隊或換日時只重記，不重複更新
    if (key !== ROSTER_KEY) { ROSTER_KEY = key; ROSTER_SIG = sig; return; }
    if (sig !== ROSTER_SIG) { ROSTER_SIG = sig; run(); }
  } catch (e) { /* 讀不到就等下一次 */ }
}
setInterval(rosterWatch, 20000);
try { localStorage.removeItem("qaKey"); localStorage.removeItem("qaOpen"); } catch (e) { /* 清掉以前存的 API 金鑰 */ }
authInit().then(run);
